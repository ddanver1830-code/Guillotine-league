<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — History</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#06101c;--p:#0d1b2b;--line:#203951;--text:#f8fbff;--muted:#8fa4bb;--blue:#38bdf8;--red:#fb7185;--green:#34d399;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#10283f,#050b13 60%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:14px 14px 95px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-size:20px;font-weight:900}.logo small{display:block;color:var(--muted);font-size:11px}.week{text-align:right}.week b{font-size:17px}.week small{display:block;color:var(--muted)}.hero{border:1px solid var(--line);border-radius:20px;padding:20px;background:linear-gradient(135deg,#123552,#0b1726);margin-bottom:12px}.eyebrow{color:#86efac;font-weight:900;font-size:11px;text-transform:uppercase}.hero h1{margin:5px 0;font-size:29px}.sub{color:var(--muted)}.champ{margin-top:15px;padding:15px;border-radius:14px;background:#2b2110;border:1px solid #73551c}.champ b{color:#fde68a;font-size:21px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:12px}.stat b{font-size:22px}.stat small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.section{margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.head h2{margin:0;font-size:17px}.head small{color:var(--muted)}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:8px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.right{text-align:right!important}.danger{color:#fda4af;font-weight:800}.winner{color:#86efac;font-weight:800}.gold{color:#fde68a;font-weight:900}.muted{color:var(--muted)}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#172a3d;color:#b9d4e8;font-size:10px;font-weight:800}.bar{height:5px;background:#172a3d;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;background:var(--blue)}.timeline{display:grid;gap:7px}.event{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;background:var(--p);border:1px solid var(--line);border-radius:12px;padding:11px}.event .wk{font-weight:900;color:var(--blue)}.event .score{font-weight:900}.bottom{position:fixed;bottom:0;left:0;right:0;background:#07111eeb;border-top:1px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.bottom a{color:var(--muted);font-size:11px;padding:6px 10px;text-decoration:none;text-align:center}.bottom .active{color:var(--blue);font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.event{grid-template-columns:48px 1fr}.event .score{grid-column:2}}@media(max-width:430px){.hero h1{font-size:24px}}
</style></head><body><main class="wrap" id="app">Loading League History…</main><nav class="bottom"><a href="manager-center.html">⌂<br>Home</a><a href="game-center.html">🏈<br>Game Day</a><a href="lineup-center.html">📋<br>Lineup</a><a href="waiver-center.html">💰<br>Waivers</a><a class="active" href="league-history.html">🏆<br>History</a></nav><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',sb=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let league,teams=[],scores=[],elim=[],bids=[],roster=[],players=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=x=>'$'+Number(x||0).toFixed(0);const teamName=id=>teams.find(t=>t.id===id)?.name||'Unknown Team';
async function load(){let lid=localStorage.getItem(LK);if(!lid)throw Error('Open the main league app first.');let L=await sb.from('leagues').select('*').eq('id',lid).single();if(L.error)throw L.error;league=L.data;let [t,s,e,b,r,p]=await Promise.all([sb.from('teams').select('*').eq('league_id',lid).order('team_number'),sb.from('weekly_scores').select('*').eq('league_id',lid).order('week'),sb.from('eliminations').select('*').eq('league_id',lid).order('week'),sb.from('waiver_bids').select('*').eq('league_id',lid).order('week'),sb.from('roster_players').select('*').eq('league_id',lid),sb.from('players').select('*')]);teams=t.data||[];scores=s.data||[];elim=e.data||[];bids=b.data||[];roster=r.data||[];players=p.data||[];render()}
function render(){let alive=teams.filter(t=>t.alive),champ=league.status==='complete'?(alive[0]||teams.find(t=>!t.elimination_week)):null;let spent={};bids.forEach(b=>{if(b.processed_at)spent[b.team_id]=(spent[b.team_id]||0)+Number(b.bid_amount||0)});let pickups=bids.filter(b=>b.processed_at&&Number(b.bid_amount||0)>=0);let totalScored=scores.length?new Set(scores.map(s=>s.week)).size:0;let low=elim.length?elim[elim.length-1]:null;let avg=scores.length?scores.reduce((a,s)=>a+Number(s.points||0),0)/scores.length:0;let order=[...teams].sort((a,b)=>{let ea=a.elimination_week??99,eb=b.elimination_week??99;if(ea!==eb)return ea-eb;return a.team_number-b.team_number});document.getElementById('app').innerHTML=`<div class="top"><div class="logo">🏆 Guillotine League<small>${esc(league.name)}</small></div><div class="week"><b>${league.status==='complete'?'Complete':'Week '+(league.current_week||1)}</b><small>${teams.length} teams</small></div></div><section class="hero"><div class="eyebrow">Season History & Records</div><h1>${esc(league.name)}</h1><div class="sub">A permanent record of the ${league.season||2026} Guillotine season.</div>${champ?`<div class="champ">🏆 <span class="muted">GUILLITONE CHAMPION</span><br><b>${esc(champ.name)}</b><br><span class="muted">${esc(champ.manager_name||'')}</span></div>`:''}</section><div class="grid"><div class="stat"><b>${elim.length}</b><small>Teams Eliminated</small></div><div class="stat"><b>${alive.length}</b><small>Teams Alive</small></div><div class="stat"><b>${totalScored}</b><small>Weeks Scored</small></div><div class="stat"><b>${avg?avg.toFixed(1):'—'}</b><small>Avg Team Score</small></div></div><section class="section"><div class="head"><h2>☠️ Elimination Order</h2><small>First eliminated → latest</small></div><div class="timeline">${elim.length?elim.map(e=>`<div class="event"><div class="wk">Wk ${e.week}</div><div><b>${esc(teamName(e.team_id))}</b><br><span class="muted">${esc(teams.find(t=>t.id===e.team_id)?.manager_name||'')}</span></div><div class="score danger">${Number(e.score||0).toFixed(2)} pts</div></div>`).join(''):'<div class="card muted">No teams have been eliminated yet.</div>'}</div></section><section class="section"><div class="head"><h2>📊 Team Records</h2><small>Elimination order & FAAB</small></div><div class="card tablewrap"><table class="table"><tr><th>Finish</th><th>Team</th><th>Manager</th><th>Eliminated</th><th>FAAB Spent</th><th>Status</th></tr>${order.map((t,i)=>`<tr><td>${t.alive?'—':'#'+(i+1)}</td><td><b>${esc(t.name)}</b></td><td>${esc(t.manager_name||'—')}</td><td>${t.elimination_week?'Week '+t.elimination_week:'—'}</td><td>${money(spent[t.id]||0)}</td><td>${t.alive?'<span class="winner">ALIVE</span>':'<span class="danger">ELIMINATED</span>'}</td></tr>`).join('')}</table></div></section><section class="section"><div class="head"><h2>💰 FAAB Leaders</h2><small>Most spent on waivers</small></div><div class="card tablewrap"><table class="table"><tr><th>Rank</th><th>Team</th><th>Manager</th><th>Spent</th><th>Remaining</th></tr>${[...teams].sort((a,b)=>(spent[b.id]||0)-(spent[a.id]||0)).map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name)}</td><td>${esc(t.manager_name||'—')}</td><td>${money(spent[t.id]||0)}</td><td>${money(t.faab)}</td></tr>`).join('')}</table></div></section><section class="section"><div class="head"><h2>📅 Weekly Scores</h2><small>Official scores</small></div><div class="card tablewrap"><table class="table"><tr><th>Week</th><th>Team</th><th>Score</th><th>Status</th></tr>${scores.length?scores.slice().sort((a,b)=>b.week-a.week||a.points-b.points).map(s=>`<tr><td>Week ${s.week}</td><td>${esc(teamName(s.team_id))}</td><td><b>${Number(s.points||0).toFixed(2)}</b></td><td>${elim.some(e=>e.week===s.week&&e.team_id===s.team_id)?'<span class="danger">ELIMINATED</span>':'<span class="muted">Recorded</span>'}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">No official weekly scores yet.</td></tr>'}</table></div></section><section class="section"><div class="card"><b>Season rules</b><p class="muted">Lowest surviving team score is eliminated each week. The eliminated roster enters the waiver pool for blind FAAB bidding. Season-long points are used as the elimination tiebreaker.</p></div></section>`}
async function start(){try{await load();sb.channel('history-room').on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'weekly_scores',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'eliminations',filter:'league_id=eq.'+league.id},load).subscribe()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Unable to load history</h2><p class="muted">'+esc(e.message)+'</p><a href="index.html">Return to League Manager</a></div>'}}start();setInterval(load,30000);
</script></body></html>
