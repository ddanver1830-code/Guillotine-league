<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guillotine League — Manager Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111f;--panel:#0e1b2d;--panel2:#12243b;--text:#f7fbff;--muted:#91a4bb;--line:#20344d;--accent:#38bdf8;--good:#34d399;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#081526,#050b14);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;padding-bottom:76px}.wrap{max-width:900px;margin:auto;padding:18px 14px 35px}.brand{text-align:center;margin:18px 0 24px}.brand .icon{font-size:42px}.brand h1{font-size:30px;margin:5px 0}.brand p,.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 12px 35px rgba(0,0,0,.2)}.entry{max-width:560px;margin:0 auto}.eyebrow{color:var(--accent);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.title{font-size:20px;font-weight:900;margin:5px 0 7px}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:15px 0 6px}input{width:100%;padding:14px;border-radius:11px;border:1px solid #35516d;background:#07111f;color:#fff;font-size:18px;text-align:center;text-transform:uppercase;letter-spacing:.12em}button{border:0;border-radius:11px;padding:12px 16px;font-weight:900;cursor:pointer;background:var(--accent);color:#04111d}button:disabled{opacity:.5;cursor:not-allowed}.primary{width:100%;margin-top:14px;font-size:16px}.success{background:var(--good);color:#032016}.error{background:#3a1720;border:1px solid #713040;color:#fecdd3;padding:13px;border-radius:11px;margin-top:12px}.hidden{display:none!important}.leagueHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.leagueName{font-size:25px;font-weight:900}.code{font-weight:900;color:var(--accent);font-size:18px;letter-spacing:.08em}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.team{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line)}.team:first-child{border-top:0}.teamInfo{flex:1}.teamName{font-weight:900}.teamMeta{font-size:11px;color:var(--muted);margin-top:2px}.open{color:var(--good);font-size:11px;font-weight:900}.joined{color:var(--accent);font-size:11px;font-weight:900}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;font-weight:900}.action span{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px}.notice{background:#102b27;border:1px solid #21584d;color:#b7f7e8;padding:13px;border-radius:12px}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(6,14,25,.97);border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav a{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:9px;font-weight:800;border-radius:10px;gap:2px;text-decoration:none}.nav a b{font-size:18px}.nav a.active{background:#132a42;color:#fff}.smallbtn{padding:8px 11px;font-size:11px}@media(max-width:620px){.wrap{padding:12px 11px 25px}.brand h1{font-size:25px}.card{padding:16px}.leagueHead{flex-direction:column}.stats{gap:7px}.stat{padding:10px 5px}.stat b{font-size:19px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<div class="brand"><div class="icon">🏈</div><h1>Manager Portal</h1><p>Fantasy Guillotine League</p></div>
<section id="entry" class="card entry"><div class="eyebrow">Join or return to your league</div><div class="title">Enter your league code</div><p class="muted">Use the code provided by your commissioner. You can bookmark this manager portal and come back anytime.</p><label for="leagueCode">League Code</label><input id="leagueCode" maxlength="8" placeholder="HO441Q" autocomplete="off"><button id="enterBtn" class="primary">Enter League</button><div id="entryError" class="error hidden"></div></section>
<section id="league" class="hidden"></section>
</main>
<nav class="bottom"><div class="nav"><a class="active" href="manager-lobby.html"><b>⌂</b>Lobby</a><a href="manager-center.html"><b>🏠</b>Home</a><a href="draft-room.html"><b>🏈</b>Draft</a><a href="waiver-center.html"><b>💰</b>Waivers</a><a href="live-scoring.html"><b>📈</b>Scores</a></div></nav>
<script>
const SUPABASE_URL='https://unmahnndjtljktvrupkh.supabase.co';
const SUPABASE_KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const LEAGUE_STORAGE_KEY='guillotine-live-league-id';
let currentLeague=null,currentTeams=[],currentDraft=null,currentUserId=null,realtimeChannel=null;
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function ensureAuthenticated(){const sessionResult=await supabaseClient.auth.getSession();if(sessionResult.error)throw sessionResult.error;if(!sessionResult.data?.session){const signInResult=await supabaseClient.auth.signInAnonymously();if(signInResult.error)throw signInResult.error}const userResult=await supabaseClient.auth.getUser();if(userResult.error)throw userResult.error;currentUserId=userResult.data.user.id}
async function enterLeague(){const code=document.getElementById('leagueCode').value.trim().toUpperCase();const errorBox=document.getElementById('entryError');errorBox.classList.add('hidden');if(!code){errorBox.textContent='Enter your league code first.';errorBox.classList.remove('hidden');return}const button=document.getElementById('enterBtn');button.disabled=true;button.textContent='Opening League…';try{await ensureAuthenticated();const result=await supabaseClient.from('leagues').select('*').eq('code',code).maybeSingle();if(result.error)throw result.error;if(!result.data)throw new Error('We could not find a league with that code. Check the code and try again.');localStorage.setItem(LEAGUE_STORAGE_KEY,result.data.id);history.replaceState(null,'',location.pathname+'?code='+encodeURIComponent(code));await loadLeague()}catch(error){errorBox.textContent=error.message||'Unable to open that league.';errorBox.classList.remove('hidden')}finally{button.disabled=false;button.textContent='Enter League'}}
async function loadLeague(){try{await ensureAuthenticated();const leagueId=localStorage.getItem(LEAGUE_STORAGE_KEY);if(!leagueId){document.getElementById('entry').classList.remove('hidden');return}const [leagueResult,teamsResult,draftResult]=await Promise.all([supabaseClient.from('leagues').select('*').eq('id',leagueId).single(),supabaseClient.from('teams').select('*').eq('league_id',leagueId).order('team_number'),supabaseClient.from('draft_state').select('*').eq('league_id',leagueId).maybeSingle()]);if(leagueResult.error)throw leagueResult.error;if(teamsResult.error)throw teamsResult.error;if(draftResult.error)throw draftResult.error;currentLeague=leagueResult.data;currentTeams=teamsResult.data||[];currentDraft=draftResult.data||null;renderLeague();subscribeRealtime()}catch(error){localStorage.removeItem(LEAGUE_STORAGE_KEY);document.getElementById('entry').classList.remove('hidden');const errorBox=document.getElementById('entryError');errorBox.textContent=error.message||'Unable to load the league.';errorBox.classList.remove('hidden')}}
function renderLeague(){const entry=document.getElementById('entry');entry.classList.add('hidden');const container=document.getElementById('league');const mine=currentTeams.find(team=>team.owner_user_id===currentUserId);const joined=currentTeams.filter(team=>team.owner_user_id).length;const openTeams=currentTeams.filter(team=>!team.owner_user_id&&team.alive);const ready=currentTeams.filter(team=>team.ready).length;const draftStatus=currentDraft?.status||'setup';const rows=currentTeams.map(team=>{const isMine=team.owner_user_id===currentUserId;const canJoin=!team.owner_user_id&&team.alive;return `<div class="team"><div class="teamInfo"><div class="teamName">Team ${team.team_number}${isMine?' · YOU':''}</div><div class="teamMeta">${esc(team.name||('Team '+team.team_number))}${team.manager_name?' · '+esc(team.manager_name):''}</div></div><div>${isMine?'<div class="joined">YOUR TEAM</div>':team.owner_user_id?'<div class="joined">JOINED</div>':canJoin?'<div class="open">OPEN</div>':'<div class="muted">UNAVAILABLE</div>'}</div>${canJoin?`<button class="smallbtn success" onclick="claimTeam(${team.team_number})">Join</button>`:''}</div>`}).join('');container.innerHTML=`<section class="card"><div class="leagueHead"><div><div class="eyebrow">Manager Portal</div><div class="leagueName">${esc(currentLeague.name)}</div><div class="muted">Season ${esc(currentLeague.season||2026)} · Week ${esc(currentLeague.current_week||1)} of 17</div></div><div><div class="muted" style="font-size:10px;text-align:right">LEAGUE CODE</div><div class="code">${esc(currentLeague.code||'')}</div></div></div><div class="stats"><div class="stat"><b>${joined}/18</b><span>Managers Joined</span></div><div class="stat"><b>${ready}/18</b><span>Ready</span></div><div class="stat"><b>${draftStatus==='running'?'LIVE':esc(draftStatus).toUpperCase()}</b><span>Draft Status</span></div></div></section>${mine?`<section class="card"><div class="eyebrow">Your Team</div><div class="title">${esc(mine.name||('Team '+mine.team_number))}</div><div class="muted">Manager: ${esc(mine.manager_name||'Manager')} · ${mine.alive?'Active':'Eliminated'} · $${Number(mine.faab||0).toFixed(0)} FAAB</div><div class="notice" style="margin-top:13px">You are connected to this league. Use the manager tools below to manage your lineup, roster, waivers and draft.</div></section>`:`<section class="card"><div class="eyebrow">Choose your team</div><div class="title">${openTeams.length} open team${openTeams.length===1?'':'s'} available</div><p class="muted">Pick an open team to claim it. You will enter your manager name on the next screen.</p></section>`}<section class="card"><div class="eyebrow">League Teams</div><div class="title">18-Team Live Lobby</div>${rows}</section><section class="card"><div class="eyebrow">Manager Tools</div><div class="actions"><a class="action" href="manager-center.html">🏠 Manager Home<span>Your dashboard and league overview</span></a><a class="action" href="draft-room.html">🏈 Draft Room<span>Enter when the commissioner starts the draft</span></a><a class="action" href="roster-center.html">👥 My Roster<span>View your current players</span></a><a class="action" href="index.html">📋 Lineup<span>Set your weekly starting lineup</span></a><a class="action" href="waiver-center.html">💰 Waivers<span>Submit blind FAAB bids</span></a><a class="action" href="live-scoring.html">📈 Live Scores<span>Track your team and danger zone</span></a></div></section>`;container.classList.remove('hidden')}
function claimTeam(teamNumber){const code=currentLeague?.code;if(code)location.href='join.html?code='+encodeURIComponent(code)+'&team='+teamNumber}
function subscribeRealtime(){if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);realtimeChannel=supabaseClient.channel('manager-lobby-'+currentLeague.id).on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+currentLeague.id},loadLeague).on('postgres_changes',{event:'*',schema:'public',table:'leagues',filter:'id=eq.'+currentLeague.id},loadLeague).on('postgres_changes',{event:'*',schema:'public',table:'draft_state',filter:'league_id=eq.'+currentLeague.id},loadLeague).subscribe()}
function init(){const params=new URLSearchParams(location.search);const code=(params.get('code')||'').trim().toUpperCase();if(code)document.getElementById('leagueCode').value=code;const storedLeagueId=localStorage.getItem(LEAGUE_STORAGE_KEY);if(code&&!storedLeagueId)enterLeague();else if(storedLeagueId)loadLeague()}
document.getElementById('enterBtn').addEventListener('click',enterLeague);document.getElementById('leagueCode').addEventListener('keydown',event=>{if(event.key==='Enter')enterLeague()});init();
</script>
</body>
</html>
