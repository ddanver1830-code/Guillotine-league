<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guillotine League — Manager Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111f;--panel:#0e1b2d;--panel2:#12243b;--text:#f7fbff;--muted:#91a4bb;--line:#20344d;--accent:#38bdf8;--good:#34d399;--warn:#fbbf24;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#081526,#050b14);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;padding-bottom:76px}a{text-decoration:none;color:inherit}.wrap{max-width:900px;margin:auto;padding:18px 14px 35px}.brand{text-align:center;margin:18px 0 24px}.brand .icon{font-size:42px}.brand h1{font-size:30px;margin:5px 0}.brand p{color:var(--muted);margin:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 12px 35px rgba(0,0,0,.2)}.entry{max-width:560px;margin:0 auto}.eyebrow{color:var(--accent);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.title{font-size:20px;font-weight:900;margin:5px 0 7px}.muted{color:var(--muted)}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:15px 0 6px}input{width:100%;padding:14px;border-radius:11px;border:1px solid #35516d;background:#07111f;color:#fff;font-size:18px;text-align:center;text-transform:uppercase;letter-spacing:.12em}button{border:0;border-radius:11px;padding:12px 16px;font-weight:900;cursor:pointer;background:var(--accent);color:#04111d}button:disabled{opacity:.5;cursor:not-allowed}.primary{width:100%;margin-top:14px;font-size:16px}.success{background:var(--good);color:#032016}.danger{background:#351824;color:#fecdd3;border:1px solid #613040}.error{background:#3a1720;border:1px solid #713040;color:#fecdd3;padding:13px;border-radius:11px;margin-top:12px}.hidden{display:none!important}.leagueHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.leagueName{font-size:25px;font-weight:900}.code{font-weight:900;color:var(--accent);font-size:18px;letter-spacing:.08em}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.team{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line)}.team:first-child{border-top:0}.teamName{font-weight:900}.teamMeta{font-size:11px;color:var(--muted);margin-top:2px}.open{color:var(--good);font-size:11px;font-weight:900}.joined{color:var(--accent);font-size:11px;font-weight:900}.ready{color:var(--good);font-size:11px;font-weight:900}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;font-weight:900}.action span{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px}.notice{background:#102b27;border:1px solid #21584d;color:#b7f7e8;padding:13px;border-radius:12px}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(6,14,25,.97);border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav a{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:9px;font-weight:800;border-radius:10px;gap:2px}.nav a b{font-size:18px}.nav a.active{background:#132a42;color:#fff}.smallbtn{padding:8px 11px;font-size:11px}.loading{text-align:center;padding:45px;color:var(--muted)}@media(max-width:620px){.wrap{padding:12px 11px 25px}.brand h1{font-size:25px}.card{padding:16px}.leagueHead{flex-direction:column}.stats{grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:10px 5px}.stat b{font-size:19px}.actions{grid-template-columns:1fr}.team{align-items:flex-start}.team button{padding:9px 10px;font-size:12px}}
</style>
</head>
<body>
<main class="wrap">
<div class="brand"><div class="icon">🏈</div><h1>Manager Portal</h1><p>Fantasy Guillotine League</p></div>
<section id="entry" class="card entry">
<div class="eyebrow">Join or return to your league</div>
<div class="title">Enter your league code</div>
<p class="muted">Use the code provided by your commissioner. You can bookmark this manager portal and come back here anytime.</p>
<label for="code">League Code</label>
<input id="code" maxlength="8" placeholder="HO441Q" autocomplete="off" onkeydown="if(event.key==='Enter')openLeague()">
<button class="primary" onclick="openLeague()">Enter League</button>
<div id="entryError" class="error hidden"></div>
</section>
<section id="league" class="hidden"></section>
</main>
<nav class="bottom"><div class="nav"><a class="active" href="manager-lobby.html"><b>⌂</b>Lobby</a><a href="manager-center.html"><b>🏠</b>Home</a><a href="draft-room.html"><b>🏈</b>Draft</a><a href="waiver-center.html"><b>💰</b>Waivers</a><a href="live-scoring.html"><b>📈</b>Scores</a></div></nav>
<script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const LK='guillotine-live-league-id';
let league=null,teams=[],draft=null,uid=null,channel=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function ensureAuth(){let r=await db.auth.getSession();if(!r.data.session){let s=await db.auth.signInAnonymously();if(s.error)throw s.error}let u=await db.auth.getUser();if(u.error)throw u.error;uid=u.data.user.id}
async function openLeague(){let code=(document.getElementById('code').value||'').trim().toUpperCase();if(!code){showEntryError('Enter your league code first.');return}setEntryBusy(true);try{await ensureAuth();let r=await db.from('leagues').select('*').eq('code',code).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('We could not find a league with that code. Check the code and try again.');localStorage.setItem(LK,r.data.id);history.replaceState(null,'',location.pathname+'?code='+encodeURIComponent(code));await loadLeague()}catch(e){showEntryError(e.message||'Unable to open that league.')}finally{setEntryBusy(false)}}
function setEntryBusy(b){let btn=document.querySelector('#entry button');btn.disabled=b;btn.textContent=b?'Opening League…':'Enter League'}
function showEntryError(x){let el=document.getElementById('entryError');el.textContent=x;el.classList.remove('hidden')}
async function loadLeague(){try{await ensureAuth();let lid=localStorage.getItem(LK);if(!lid){document.getElementById('entry').classList.remove('hidden');return}let [l,t,d]=await Promise.all([db.from('leagues').select('*').eq('id',lid).single(),db.from('teams').select('*').eq('league_id',lid).order('team_number'),db.from('draft_state').select('*').eq('league_id',lid).maybeSingle()]);if(l.error)throw l.error;if(t.error)throw t.error;if(d.error)throw d.error;league=l.data;teams=t.data||[];draft=d.data||null;render();subscribe()}catch(e){localStorage.removeItem(LK);document.getElementById('entry').classList.remove('hidden');showEntryError(e.message||'Unable to load the league.')}}
function render(){document.getElementById('entry').classList.add('hidden');let mine=teams.find(t=>t.owner_user_id===uid);let joined=teams.filter(t=>t.owner_user_id).length;let open=teams.filter(t=>!t.owner_user_id&&t.alive);let ready=teams.filter(t=>t.ready).length;let status=draft?.status||'setup';let code=esc(league.code||'');let rows=teams.map(t=>{let isMine=t.owner_user_id===uid;let openTeam=!t.owner_user_id&&t.alive;return `<div class="team"><div><div class="teamName">Team ${t.team_number}${isMine?' · YOU':''}</div><div class="teamMeta">${esc(t.name||('Team '+t.team_number))}${t.manager_name?' · '+esc(t.manager_name):''}</div></div><div>${isMine?'<div class="joined">YOUR TEAM</div>':t.owner_user_id?'<div class="joined">JOINED</div>':openTeam?'<div class="open">OPEN</div>':'<div class="muted">UNAVAILABLE</div>'}</div>${openTeam?`<button class="smallbtn success" onclick="claimTeam(${t.team_number})">Join</button>`:''}</div>`}).join('');document.getElementById('league').innerHTML=`<section class="card"><div class="leagueHead"><div><div class="eyebrow">Manager Portal</div><div class="leagueName">${esc(league.name)}</div><div class="muted">Season ${esc(league.season||2026)} · Week ${esc(league.current_week||1)} of 17</div></div><div><div class="muted" style="font-size:10px;text-align:right">LEAGUE CODE</div><div class="code">${code}</div></div></div><div class="stats"><div class="stat"><b>${joined}/18</b><span>Managers Joined</span></div><div class="stat"><b>${ready}/18</b><span>Ready</span></div><div class="stat"><b>${status==='running'?'LIVE':status.toUpperCase()}</b><span>Draft Status</span></div></div></section>${mine?`<section class="card"><div class="eyebrow">Your Team</div><div class="title">${esc(mine.name||'Team '+mine.team_number)}</div><div class="muted">Manager: ${esc(mine.manager_name||'Manager')} · ${mine.alive?'Active':'Eliminated'} · $${Number(mine.faab||0).toFixed(0)} FAAB</div><div class="notice" style="margin-top:13px">You are connected to this league. Use the manager tools below to manage your lineup, roster, waivers and draft.</div></section>`:`<section class="card"><div class="eyebrow">Choose your team</div><div class="title">${open.length} open team${open.length===1?'':'s'} available</div><p class="muted">Pick an open team to claim it. You will be asked for your manager name.</p></section>`}<section class="card"><div class="eyebrow">League Teams</div><div class="title">18-Team Live Lobby</div>${rows}</section><section class="card"><div class="eyebrow">Manager Tools</div><div class="actions"><a class="action" href="manager-center.html">🏠 Manager Home<span>Your dashboard and league overview</span></a><a class="action" href="draft-room.html">🏈 Draft Room<span>Enter when the commissioner starts the draft</span></a><a class="action" href="roster-center.html">👥 My Roster<span>View your current players</span></a><a class="action" href="index.html">📋 Lineup<span>Set your weekly starting lineup</span></a><a class="action" href="waiver-center.html">💰 Waivers<span>Submit blind FAAB bids</span></a><a class="action" href="live-scoring.html">📈 Live Scores<span>Track your team and danger zone</span></a></div></section>`;document.getElementById('league').classList.remove('hidden')}
async function claimTeam(n){let code=league.code;location.href='join.html?code='+encodeURIComponent(code)+'&team='+n}
function subscribe(){if(channel)db.removeChannel(channel);channel=db.channel('manager-lobby-'+league.id).on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},loadLeague).on('postgres_changes',{event:'*',schema:'public',table:'leagues',filter:'id=eq.'+league.id},loadLeague).on('postgres_changes',{event:'*',schema:'public',table:'draft_state',filter:'league_id=eq.'+league.id},loadLeague).subscribe();}
function init(){let q=new URLSearchParams(location.search);let code=(q.get('code')||'').trim().toUpperCase();if(code)document.getElementById('code').value=code;let lid=localStorage.getItem(LK);if(code&&!lid)openLeague();else if(lid)loadLeague()}
init();
</script>
</body>
</html>
