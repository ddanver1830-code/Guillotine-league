<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine — Manager Lobby</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050b13;--p:#0d1826;--line:#263b51;--text:#f8fafc;--muted:#91a4b9;--blue:#38bdf8;--green:#34d399;--gold:#fbbf24;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12314a,#050b13 60%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:15px 15px 92px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.brand{font-size:21px;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.status{text-align:right}.status b{font-size:18px}.status small{display:block;color:var(--muted)}.hero{border:1px solid var(--line);border-radius:20px;padding:22px;background:linear-gradient(135deg,#153b58,#0b1725);margin-bottom:12px}.eyebrow{font-size:11px;color:#86efac;font-weight:900;text-transform:uppercase}.hero h1{margin:5px 0;font-size:30px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}.card{background:#0d1826ee;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}.card h2{font-size:17px;margin:0 0 10px}.big{font-size:32px;font-weight:900}.bar{height:9px;background:#17283a;border-radius:20px;overflow:hidden;margin:8px 0}.fill{height:100%;background:var(--blue)}.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}.team{border:1px solid var(--line);border-radius:11px;padding:11px;background:#0b1522;display:grid;grid-template-columns:35px 1fr auto;gap:9px;align-items:center}.num{width:32px;height:32px;border-radius:9px;background:#182c42;display:grid;place-items:center;font-weight:900}.joined{border-color:#176b55}.waiting{border-color:#634d18}.teamname{font-weight:900}.manager{font-size:11px;color:var(--muted);margin-top:2px}.pill{font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px}.green{color:var(--green)}.gold{color:var(--gold)}.red{color:var(--red)}.notice{padding:11px;border-radius:10px;background:#14253a;color:#b7c9dc;margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:900;cursor:pointer;background:#2563eb;color:#fff}button.alt{background:#253449}button.green{background:#059669}button:disabled{opacity:.5;cursor:not-allowed}.code{font-size:25px;font-weight:900;letter-spacing:3px;background:#07121e;border:1px dashed #3d5972;border-radius:10px;padding:14px;text-align:center;margin:10px 0}.countdown{font-size:27px;font-weight:900}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info div{background:#0a1420;border:1px solid var(--line);padding:10px;border-radius:9px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#06101eee;border-top:1px solid var(--line);display:flex;justify-content:center;gap:3px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);z-index:5}.bottom a{color:var(--muted);text-decoration:none;font-size:11px;text-align:center;padding:6px 10px}.bottom a.active{color:var(--blue);font-weight:900}@media(max-width:760px){.grid{grid-template-columns:1fr}.teams{grid-template-columns:1fr 1fr}}@media(max-width:480px){.hero h1{font-size:25px}.teams{grid-template-columns:1fr}.bottom a{padding:6px 7px}}</style></head><body><main class="wrap"><div id="app"><div class="card">Connecting to league…</div></div></main><nav class="bottom"><a class="active" href="manager-lobby.html">👥<br>Lobby</a><a href="manager-center.html">⌂<br>Home</a><a href="draft-room.html">📝<br>Draft</a><a href="waiver-center.html">💰<br>Waivers</a><a href="league-history.html">🏆<br>History</a></nav><script>const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let user,league,teams=[],draftState=null;const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function auth(){let r=await db.auth.getSession();if(r.error)throw r.error;if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}user=(await db.auth.getUser()).data.user}async function load(){let id=localStorage.getItem(LK);if(!id)throw Error('Open the main league app first.');let [l,t,d]=await Promise.all([db.from('leagues').select('*').eq('id',id).single(),db.from('teams').select('*').eq('league_id',id).order('team_number'),db.from('draft_state').select('*').eq('league_id',id).maybeSingle()]);if(l.error)throw l.error;if(t.error)throw t.error;if(d.error)throw d.error;league=l.data;teams=t.data||[];draftState=d.data||null;render()}function me(){return teams.find(t=>t.owner_user_id===user.id)||null}function countdown(){if(!draftState?.scheduled_at)return '';let diff=new Date(draftState.scheduled_at).getTime()-Date.now();if(diff<=0)return 'DRAFT TIME!';let s=Math.floor(diff/1000),days=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return days?`${days}d ${String(h).padStart(2,'0')}h`:h?`${h}h ${String(m).padStart(2,'0')}m`:m?`${m}m ${String(s).padStart(2,'0')}s`:`${s}s`}function render(){let joined=teams.filter(t=>t.owner_user_id).length,m=me(),all=joined===18,ready=teams.filter(t=>t.ready).length;document.getElementById('app').innerHTML=`<div class="top"><div class="brand">👥 Manager Lobby<small>${esc(league.name)} · ${esc(league.season||2026)} Season</small></div><div class="status"><b>${joined}/18 Joined</b><small>${ready}/18 Ready</small></div></div><section class="hero"><div class="eyebrow">Preseason Command Center</div><h1>Get your team ready for the draft.</h1><div class="muted">Claim your team, mark yourself ready, and watch the league fill up live.</div><div class="big" style="margin-top:14px">${joined}/18</div><div class="bar"><div class="fill" style="width:${Math.min(100,joined/18*100)}%"></div></div><div class="muted">${all?'🎉 All 18 managers have joined!':`${18-joined} manager${18-joined===1?'':'s'} still needed.`}</div></section><div class="grid"><div><section class="card"><h2>👥 League Teams</h2><div class="teams">${teams.map(t=>`<div class="team ${t.owner_user_id?'joined':'waiting'}"><div class="num">${t.team_number}</div><div><div class="teamname">${esc(t.name)}</div><div class="manager">${esc(t.manager_name||'Waiting for manager')}</div></div><div>${t.owner_user_id?'<span class="pill green">JOINED</span>':'<span class="pill gold">OPEN</span>'}</div></div>`).join('')}</div></section></div><div><section class="card"><h2>🔗 Invite Managers</h2><div class="muted">Send managers the league code or your join page.</div><div class="code">${esc(league.code||'—')}</div><div class="actions"><button onclick="copyCode()">📋 Copy Code</button><button class="alt" onclick="copyLink()">🔗 Copy Join Link</button></div></section><section class="card"><h2>📝 My Team</h2>${m?`<div class="notice"><b>${esc(m.name)}</b><br><span class="muted">${esc(m.manager_name||'')}</span></div><button class="green" onclick="toggleReady()">${m.ready?'✓ READY — Click to Unready':'✓ Mark Me Ready'}</button>`:'<div class="notice">No team is linked to this account yet. Use the league join page to claim a team.</div><button class="alt" onclick="location.href=\'join.html\'">Join League</button>'}</section><section class="card"><h2>📅 Draft</h2><div class="info"><div><span class="muted">Status</span><br><b>${esc(draftState?.status||'Not scheduled')}</b></div><div><span class="muted">Rounds</span><br><b>${draftState?.rounds||13}</b></div><div><span class="muted">Pick Timer</span><br><b>${draftState?.pick_seconds||90}s</b></div><div><span class="muted">Starts In</span><br><b id="cd">${countdown()||'Not scheduled'}</b></div></div><div class="actions" style="margin-top:10px"><button class="alt" onclick="location.href='draft-room.html'">📝 Draft Room</button><button class="alt" onclick="location.href='draft-control.html'">⚙️ Draft Control</button></div></section></div></div>`}async function toggleReady(){let m=me();if(!m)return;let r=await db.from('teams').update({ready:!m.ready}).eq('id',m.id);if(r.error)alert(r.error.message);else await load()}async function copyCode(){let x=league.code||'';try{await navigator.clipboard.writeText(x);alert('League code copied!')}catch(e){prompt('Copy league code:',x)}}async function copyLink(){let x=location.origin+location.pathname.replace('manager-lobby.html','join.html')+'?code='+encodeURIComponent(league.code||'');try{await navigator.clipboard.writeText(x);alert('Join link copied!')}catch(e){prompt('Copy join link:',x)}}async function start(){try{await auth();await load();db.channel('manager-lobby-live').on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'leagues',filter:'id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'draft_state',filter:'league_id=eq.'+league.id},load).subscribe();setInterval(()=>{let el=document.getElementById('cd');if(el)el.textContent=countdown()},1000);setInterval(load,30000)}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Manager Lobby unavailable</h2><p class="muted">'+esc(e.message||e)+'</p><a href="index.html">Return to League Manager</a></div>'}}start();</script></body></html>
