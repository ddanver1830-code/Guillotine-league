<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — Manager Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07111f;color:#f7fbff;font:15px system-ui;padding:20px 14px 90px}.wrap{max-width:850px;margin:auto}.brand{text-align:center;margin:20px 0}.brand h1{font-size:30px}.muted{color:#91a4bb}.card{background:#0e1b2d;border:1px solid #20344d;border-radius:16px;padding:18px;margin:14px 0}.entry{max-width:540px;margin:25px auto}input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #35516d;background:#07111f;color:#fff;font-size:18px;text-align:center;text-transform:uppercase}button{border:0;border-radius:10px;padding:12px 16px;font-weight:900;cursor:pointer;background:#38bdf8;color:#04111d}.primary{width:100%;margin-top:12px}.error{background:#3a1720;border:1px solid #713040;color:#fecdd3;padding:12px;border-radius:10px;margin-top:12px}.hidden{display:none}.leagueHead{display:flex;justify-content:space-between}.code{color:#38bdf8;font-weight:900;font-size:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#12243b;border:1px solid #20344d;border-radius:11px;padding:12px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:#91a4bb}.team{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #20344d}.teamInfo{flex:1}.teamName{font-weight:900}.teamMeta{font-size:11px;color:#91a4bb}.open{color:#34d399;font-size:11px;font-weight:900}.joined{color:#38bdf8;font-size:11px;font-weight:900}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.action{display:block;background:#12243b;border:1px solid #20344d;border-radius:12px;padding:15px;color:#fff;text-decoration:none;font-weight:900}.action span{display:block;color:#91a4bb;font-size:11px;font-weight:400;margin-top:3px}.notice{background:#102b27;border:1px solid #21584d;color:#b7f7e8;padding:12px;border-radius:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#06101d;border-top:1px solid #20344d;display:flex;justify-content:center;gap:4px;padding:7px}.nav a{color:#91a4bb;text-decoration:none;padding:10px 13px;font-size:11px}.nav a.active{color:#fff;background:#132a42;border-radius:8px}@media(max-width:600px){.leagueHead{flex-direction:column}.stats{grid-template-columns:1fr 1fr 1fr}.actions{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand"><div style="font-size:42px">🏈</div><h1>Manager Portal</h1><div class="muted">Fantasy Guillotine League</div></div><section id="entry" class="card entry"><div style="color:#38bdf8;font-size:11px;font-weight:900">JOIN OR RETURN TO YOUR LEAGUE</div><h2>Enter your league code</h2><p class="muted">Use the code from your commissioner. You can bookmark this manager portal and return anytime.</p><input id="leagueCode" maxlength="8" placeholder="HO441Q" autocomplete="off"><button id="enterBtn" class="primary">Enter League</button><div id="entryError" class="error hidden"></div></section><section id="league" class="hidden"></section></main><nav class="nav"><a class="active" href="manager-lobby.html">⌂ Lobby</a><a href="manager-home.html">🏠 Home</a><a href="draft-room.html">🏈 Draft</a><a href="manager-waivers.html">💰 Waivers</a><a href="manager-scores.html">📈 Scores</a></nav><script>
const SUPABASE_URL='https://unmahnndjtljktvrupkh.supabase.co';const SUPABASE_KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const LEAGUE_KEY='guillotine-live-league-id';let league=null,teams=[],draft=null,userId=null,channel=null;const esc=x=>String(x??'').replace(/[&<>"']/g=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[g]));async function auth(){let r=await supabaseClient.auth.getSession();if(r.error)throw r.error;if(!r.data?.session){let s=await supabaseClient.auth.signInAnonymously();if(s.error)throw s.error}let u=await supabaseClient.auth.getUser();if(u.error)throw u.error;userId=u.data.user.id}async function enterLeague(){let code=document.getElementById('leagueCode').value.trim().toUpperCase(),err=document.getElementById('entryError');err.classList.add('hidden');if(!code){err.textContent='Enter your league code first.';err.classList.remove('hidden');return}let b=document.getElementById('enterBtn');b.disabled=true;b.textContent='Opening League…';try{await auth();let r=await supabaseClient.from('leagues').select('*').eq('code',code).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('We could not find a league with that code.');localStorage.setItem(LEAGUE_KEY,r.data.id);history.replaceState(null,'',location.pathname+'?code='+encodeURIComponent(code));await load()}catch(e){err.textContent=e.message||'Unable to open league.';err.classList.remove('hidden')}finally{b.disabled=false;b.textContent='Enter League'}}async function load(){try{await auth();let id=localStorage.getItem(LEAGUE_KEY);if(!id)return;let [l,t,d]=await Promise.all([supabaseClient.from('leagues').select('*').eq('id',id).single(),supabaseClient.from('teams').select('*').eq('league_id',id).order('team_number'),supabaseClient.from('draft_state').select('*').eq('league_id',id).maybeSingle()]);if(l.error)throw l.error;if(t.error)throw t.error;if(d.error)throw d.error;league=l.data;teams=t.data||[];draft=d.data||null;render();subscribe()}catch(e){localStorage.removeItem(LEAGUE_KEY);document.getElementById('entry').classList.remove('hidden');let x=document.getElementById('entryError');x.textContent=e.message||'Unable to load the league.';x.classList.remove('hidden')}}function render(){let mine=teams.find(t=>t.owner_user_id===userId),joined=teams.filter(t=>t.owner_user_id).length,open=teams.filter(t=>!t.owner_user_id&&t.alive),ready=teams.filter(t=>t.ready).length,status=draft?.status||'setup';let rows=teams.map(t=>{let mine=t.owner_user_id===userId,can=!t.owner_user_id&&t.alive;return `<div class="team"><div class="teamInfo"><div class="teamName">Team ${t.team_number}${mine?' · YOU':''}</div><div class="teamMeta">${esc(t.name||('Team '+t.team_number))}${t.manager_name?' · '+esc(t.manager_name):''}</div></div><div>${mine?'<div class="joined">YOUR TEAM</div>':t.owner_user_id?'<div class="joined">JOINED</div>':can?'<div class="open">OPEN</div>':'<div class="muted">UNAVAILABLE</div>'}</div>${can?`<button onclick="claim(${t.team_number})">Join</button>`:''}</div>`}).join('');document.getElementById('entry').classList.add('hidden');let c=document.getElementById('league');c.innerHTML=`<section class="card"><div class="leagueHead"><div><div style="color:#38bdf8;font-size:11px;font-weight:900">MANAGER PORTAL</div><h2>${esc(league.name)}</h2><div class="muted">Season ${league.season||2026} · Week ${league.current_week||1} of 17</div></div><div><div class="muted" style="font-size:10px">LEAGUE CODE</div><div class="code">${esc(league.code)}</div></div></div><div class="stats"><div class="stat"><b>${joined}/18</b><span>Managers Joined</span></div><div class="stat"><b>${ready}/18</b><span>Ready</span></div><div class="stat"><b>${esc(status).toUpperCase()}</b><span>Draft Status</span></div></div></section>${mine?`<section class="card"><div style="color:#38bdf8;font-size:11px;font-weight:900">YOUR TEAM</div><h2>${esc(mine.name||('Team '+mine.team_number))}</h2><div class="muted">Manager: ${esc(mine.manager_name||'Manager')} · ${mine.alive?'Active':'Eliminated'} · $${Number(mine.faab||0).toFixed(0)} FAAB</div><div class="notice" style="margin-top:12px">You are connected to this league. Use the manager tools below.</div></section>`:`<section class="card"><h2>Choose your team</h2><p class="muted">${open.length} open team${open.length===1?'':'s'} available. Select Join beside an open team.</p></section>`}<section class="card"><div style="color:#38bdf8;font-size:11px;font-weight:900">LEAGUE TEAMS</div><h2>18-Team Live Lobby</h2>${rows}</section><section class="card"><div style="color:#38bdf8;font-size:11px;font-weight:900">MANAGER TOOLS</div><div class="actions"><a class="action" href="manager-home.html">🏠 Manager Home<span>Your dashboard</span></a><a class="action" href="draft-room.html">🏈 Draft Room<span>Join when the draft starts</span></a><a class="action" href="manager-lineup.html">📋 Lineup<span>Set starters</span></a><a class="action" href="manager-waivers.html">💰 Waivers<span>Submit blind FAAB bids</span></a><a class="action" href="manager-scores.html">📈 Live Scores<span>Track scoring</span></a><a class="action" href="manager-game.html">🏈 Game Day<span>See the danger zone</span></a></div></section>`;c.classList.remove('hidden')}function claim(n){location.href='join.html?code='+encodeURIComponent(league.code)+'&team='+n}function subscribe(){if(channel)supabaseClient.removeChannel(channel);channel=supabaseClient.channel('manager-lobby-'+league.id).on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'leagues',filter:'id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'draft_state',filter:'league_id=eq.'+league.id},load).subscribe()}function init(){let q=new URLSearchParams(location.search),code=(q.get('code')||'').trim().toUpperCase();if(code)document.getElementById('leagueCode').value=code;let id=localStorage.getItem(LEAGUE_KEY);if(code&&!id)enterLeague();else if(id)load()}document.getElementById('enterBtn').addEventListener('click',enterLeague);document.getElementById('leagueCode').addEventListener('keydown',e=>{if(e.key==='Enter')enterLeague()});init();
</script></body></html>
