<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — Draft Settings</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050b13;--line:#29425a;--text:#f8fafc;--muted:#91a4b9;--blue:#38bdf8;--green:#34d399;--gold:#fbbf24;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123653,#050b13 62%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 14px 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.brand{font-weight:900;font-size:21px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.back{color:var(--muted);text-decoration:none}.hero{border:1px solid var(--line);border-radius:20px;padding:22px;background:linear-gradient(135deg,#163f5d,#0b1725);margin-bottom:12px}.eyebrow{font-size:11px;font-weight:900;text-transform:uppercase;color:#86efac}.hero h1{font-size:32px;margin:4px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.card{background:#0d1826ee;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:12px}.card h2{margin:0 0 13px;font-size:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:900;margin-bottom:6px;text-transform:uppercase}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#07121e;color:#fff;font:inherit}.field input:focus{outline:2px solid #38bdf866;border-color:var(--blue)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button{border:0;border-radius:9px;padding:12px 16px;font-weight:900;cursor:pointer;background:#2563eb;color:#fff}button.alt{background:#253449}button:disabled{opacity:.45;cursor:not-allowed}.notice{padding:12px;border-radius:10px;background:#14253a;color:#b9c9d8;line-height:1.45}.good{color:var(--green)}.warn{color:var(--gold)}.error{color:var(--red)}.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.rule:last-child{border:0}.icon{font-size:21px;width:30px;text-align:center}.rule b{display:block}.rule span{display:block;color:var(--muted);font-size:13px;margin-top:2px}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#123b2f;color:var(--green);font-size:11px;font-weight:900;text-transform:uppercase}.bottom{margin-top:8px;color:var(--muted);font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.hero h1{font-size:27px}} </style></head><body><main class="wrap"><div id="app"><div class="card">Loading Draft Settings…</div></div></main><script>
const SUPABASE_URL='https://unmahnndjtljktvrupkh.supabase.co',SUPABASE_KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',LK='guillotine-live-league-id';let db=null,user=null,league=null,state=null,picks=0,joined=0;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showError(message){document.getElementById('app').innerHTML='<div class="card"><h2>Draft Settings unavailable</h2><div class="notice"><span class="error"><b>'+esc(message||'Unknown error')+'</b></span><br><br>Check that you opened the main league app first and that the commissioner account is still active.</div><div class="actions"><button onclick="location.reload()">↻ Try Again</button><a class="back" href="commissioner-control.html">← Commissioner Center</a></div></div>'}
async function auth(){if(!window.supabase)throw Error('Supabase JavaScript library did not load. Refresh this page and try again.');db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const first=await Promise.race([db.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(Error('Supabase session check timed out after 12 seconds.')),12000))]);if(first.error)throw first.error;if(!first.data.session){const r=await Promise.race([db.auth.signInAnonymously(),new Promise((_,rej)=>setTimeout(()=>rej(Error('Anonymous sign-in timed out after 12 seconds.')),12000))]);if(r.error)throw r.error}const r=await Promise.race([db.auth.getUser(),new Promise((_,rej)=>setTimeout(()=>rej(Error('Supabase user check timed out after 12 seconds.')),12000))]);if(r.error)throw r.error;user=r.data.user;if(!user)throw Error('Unable to establish your commissioner session.')}
function getLeagueId(){const id=localStorage.getItem(LK);if(id)return id;throw Error('No active league is selected. Open the main league app first, select league HO441Q, then return here.')}
function localValue(iso){if(!iso)return '';const d=new Date(iso),off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,16)}
async function load(){const id=getLeagueId();const [l,s,p,t]=await Promise.race([Promise.all([db.from('leagues').select('*').eq('id',id).single(),db.from('draft_state').select('*').eq('league_id',id).maybeSingle(),db.from('draft_picks').select('id',{count:'exact',head:true}).eq('league_id',id),db.from('teams').select('id,owner_user_id').eq('league_id',id)]),new Promise((_,rej)=>setTimeout(()=>rej(Error('League data load timed out after 12 seconds.')),12000))]);if(l.error)throw l.error;if(!l.data)throw Error('League not found.');if(l.data.commissioner_user_id!==user.id)throw Error('Commissioner access required for this league.');if(s.error)throw s.error;if(t.error)throw t.error;league=l.data;state=s.data||null;picks=p.count||0;joined=(t.data||[]).filter(x=>x.owner_user_id).length;render()}
function render(){const status=state?.status||'setup',locked=picks>0||status!=='setup';document.getElementById('app').innerHTML='<div class="top"><div class="brand">⚙️ Draft Settings<small>'+esc(league.name)+' · '+esc(league.season||2026)+'</small></div><a class="back" href="commissioner-control.html">← Commissioner Center</a></div><section class="hero"><div class="eyebrow">Commissioner Configuration</div><h1>Set Up Your Live Draft</h1><div class="muted">Configure the draft before managers enter the live room. Settings become locked once the draft starts.</div><div style="margin-top:12px"><span class="status">'+esc(status)+'</span> <span class="muted" style="margin-left:6px">'+joined+'/18 managers joined · '+picks+' picks made</span></div></section><div class="grid"><div><section class="card"><h2>📝 Draft Configuration</h2><div class="form"><div class="field"><label>Draft Date & Time</label><input id="scheduled" type="datetime-local" value="'+localValue(state?.scheduled_at)+'" '+(locked?'disabled':'')+'></div><div class="field"><label>Rounds</label><input id="rounds" type="number" min="1" max="30" value="'+(state?.rounds||13)+'" '+(locked?'disabled':'')+'></div><div class="field"><label>Seconds Per Pick</label><input id="seconds" type="number" min="10" max="900" value="'+(state?.pick_seconds||90)+'" '+(locked?'disabled':'')+'></div><div class="field"><label>Draft Order</label><select disabled><option>Snake — 1 → 18, then 18 → 1</option></select></div></div><div class="actions"><button onclick="saveSetup()" '+(locked?'disabled':'')+'>💾 Save Draft Settings</button><button class="alt" onclick="location.href=\'draft-control.html\'">🎛️ Draft Control</button></div><div class="notice" style="margin-top:12px">Recommended: <b>13 rounds</b> with <b>90 seconds per pick</b>. Use <b>10 seconds</b> when testing automatic timeout picks.</div></section><section class="card"><h2>🔒 Settings Lock</h2>'+(locked?'<div class="notice"><span class="warn"><b>Settings are locked.</b></span><br>Draft settings cannot be changed after the draft has started or a pick exists.</div>':'<div class="notice"><span class="good"><b>Settings are editable.</b></span><br>Save the configuration, then use Draft Control to start the live draft.</div>')+'</section></div><div><section class="card"><h2>📋 Draft Rules</h2><div class="rule"><div class="icon">🐍</div><div><b>Snake Draft</b><span>Odd rounds run Team 1 → Team 18. Even rounds run Team 18 → Team 1.</span></div></div><div class="rule"><div class="icon">⏱️</div><div><b>Pick Clock</b><span>The configured timer starts for every pick and resets after a successful pick.</span></div></div><div class="rule"><div class="icon">🤖</div><div><b>Automatic Timeout Pick</b><span>When the clock expires, the Draft Room can automatically assign the best available player and advance.</span></div></div><div class="rule"><div class="icon">👥</div><div><b>18 Teams</b><span>The draft order is built around all 18 league teams.</span></div></div><div class="rule"><div class="icon">🔐</div><div><b>Commissioner Override</b><span>The commissioner can manage the draft from Draft Control while managers draft only for their own team.</span></div></div></section><section class="card"><h2>📊 Current Setup</h2><div class="notice">'+(state?'<b>'+state.rounds+'</b> rounds · <b>'+state.pick_seconds+'</b> seconds per pick<br>Scheduled: <b>'+(state.scheduled_at?new Date(state.scheduled_at).toLocaleString():'Not scheduled')+'</b>':'No draft setup saved yet. Defaults: 13 rounds and 90 seconds per pick.')+'</div><div class="actions"><button class="alt" onclick="location.href=\'draft-room.html\'">Open Draft Room</button></div></section></div></div><div class="bottom">Draft settings are stored in Supabase and shared live with every device in the league.</div>'}
async function saveSetup(){const rounds=Number(document.getElementById('rounds').value),seconds=Number(document.getElementById('seconds').value),raw=document.getElementById('scheduled').value;if(!Number.isInteger(rounds)||rounds<1||rounds>30)return alert('Rounds must be between 1 and 30.');if(!Number.isInteger(seconds)||seconds<10||seconds>900)return alert('Pick timer must be between 10 and 900 seconds.');try{const r=await Promise.race([db.rpc('setup_draft',{p_league_id:league.id,p_scheduled_at:raw?new Date(raw).toISOString():null,p_rounds:rounds,p_pick_seconds:seconds}),new Promise((_,rej)=>setTimeout(()=>rej(Error('Saving draft settings timed out after 12 seconds.')),12000))]);if(r.error)throw r.error;await load();alert('Draft settings saved successfully.')}catch(e){alert(e.message||e)}}
async function start(){try{document.getElementById('app').innerHTML='<div class="card">Connecting to Supabase…</div>';await auth();document.getElementById('app').innerHTML='<div class="card">Loading your league…</div>';await load();db.channel('draft-settings-live').on('postgres_changes',{event:'*',schema:'public',table:'draft_state',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'draft_picks',filter:'league_id=eq.'+league.id},load).subscribe()}catch(e){console.error('Draft Settings load failed:',e);showError(e?.message||String(e))}}
setTimeout(()=>{if(document.getElementById('app')?.textContent.includes('Loading Draft Settings'))showError('The page did not initialize. Refresh the page. If this message returns, the browser is blocking the Supabase script.','Page did not initialize')},6000);
start();
</script></body></html>
