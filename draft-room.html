<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — Draft Room</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050b13;--p:#0d1826;--line:#263b51;--text:#f8fafc;--muted:#91a4b9;--blue:#38bdf8;--green:#34d399;--red:#fb7185;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12314a,#050b13 58%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:14px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.brand{font-size:21px;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.turn{text-align:right}.turn b{font-size:20px}.turn small{display:block;color:var(--muted)}.hero{border:1px solid var(--line);border-radius:20px;padding:19px;background:linear-gradient(135deg,#153b58,#0b1725);margin-bottom:12px}.eyebrow{font-size:11px;font-weight:900;text-transform:uppercase;color:#86efac}.hero h1{margin:4px 0;font-size:29px}.muted{color:var(--muted)}.clockbar{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 15px;background:#0a1522;margin-top:13px}.clocknum{font-size:35px;font-weight:1000;letter-spacing:-1px}.clockbar.warning{border-color:#876b1b}.clockbar.danger{border-color:#853246}.clockbar.warning .clocknum{color:var(--gold)}.clockbar.danger .clocknum{color:var(--red)}.you{font-weight:900;color:var(--green)}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}.card{background:#0d1826ee;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}.card h2{margin:0 0 10px;font-size:17px}.controls{display:flex;gap:7px;flex-wrap:wrap}.search{flex:1;min-width:180px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#07121e;color:#fff}.select{padding:11px;border:1px solid var(--line);border-radius:9px;background:#07121e;color:#fff}.player{display:grid;grid-template-columns:40px 1fr auto;gap:9px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}.player:last-child{border-bottom:0}.avatar{width:34px;height:34px;border-radius:9px;background:#182c42;display:grid;place-items:center;font-size:12px;font-weight:900}.pos{display:inline-block;border-radius:999px;padding:2px 6px;background:#193047;color:#a9d8f4;font-size:10px;font-weight:900;margin-left:4px}.player button{padding:8px 10px;font-size:12px}.pick{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}.pick:last-child{border:0}.picknum{font-weight:900;color:var(--blue)}.round{color:var(--muted);font-size:11px}.board{display:grid;grid-template-columns:1fr 1fr;gap:7px}.team{border:1px solid var(--line);border-radius:11px;padding:9px;background:#0b1522}.team.current{border-color:#0ea5e9;background:#10283a}.team.dead{opacity:.55}.teamtop{display:flex;justify-content:space-between;gap:5px}.teamname{font-weight:900}.count{color:var(--muted);font-size:11px}.mini{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;font-weight:900}.green{color:var(--green)}.gold{color:var(--gold)}.red{color:var(--red)}button{border:0;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer;background:#2563eb;color:#fff}button.alt{background:#253449}button:disabled{opacity:.45;cursor:not-allowed}.notice{padding:10px;border-radius:9px;background:#14253a;color:#b7c9dc;margin:7px 0}.empty{padding:20px;text-align:center;color:var(--muted)}.bar{height:7px;border-radius:10px;background:#17283a;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--blue)}.bottom{position:fixed;left:0;right:0;bottom:0;background:#06101eee;border-top:1px solid var(--line);display:flex;justify-content:center;gap:3px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);z-index:4}.bottom a{color:var(--muted);text-decoration:none;font-size:11px;text-align:center;padding:6px 10px}.bottom .active{color:var(--blue);font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}}@media(max-width:480px){.hero h1{font-size:24px}.player{grid-template-columns:34px 1fr auto}.player button{padding:7px}.clocknum{font-size:29px}.bottom a{padding:6px 7px}}</style></head><body><main class="wrap"><div id="app"><div class="card">Loading Draft Room…</div></div></main><nav class="bottom"><a href="manager-center.html">⌂<br>Home</a><a href="game-center.html">🏈<br>Game Day</a><a class="active" href="draft-room.html">📝<br>Draft</a><a href="waiver-center.html">💰<br>Waivers</a><a href="league-history.html">🏆<br>History</a></nav><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let user,league,teams=[],picks=[],players=[],roster=[],state=null,q='',pos='ALL',myTeam=null,timer;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function auth(){let r=await db.auth.getSession();if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}user=(await db.auth.getSession()).data.user}
async function load(){let id=localStorage.getItem(LK);if(!id)throw Error('Open the main league app first.');let a=await db.from('leagues').select('*').eq('id',id).single();if(a.error)throw a.error;league=a.data;let [t,d,p,r,s]=await Promise.all([db.from('teams').select('*').eq('league_id',id).order('team_number'),db.from('draft_picks').select('*').eq('league_id',id).order('pick_number'),db.from('players').select('*').order('name'),db.from('roster_players').select('*').eq('league_id',id),db.from('draft_state').select('*').eq('league_id',id).maybeSingle()]);if(t.error)throw t.error;if(d.error)throw d.error;if(p.error)throw p.error;if(r.error)throw r.error;if(s.error)throw s.error;teams=t.data||[];picks=d.data||[];players=p.data||[];roster=r.data||[];state=s.data||null;myTeam=teams.find(t=>t.owner_user_id===user.id)||null;render()}
function turnTeam(){let n=picks.length+1;let round=Math.floor((n-1)/18)+1;return round%2===1?((n-1)%18)+1:18-((n-1)%18)}
function drafted(){return new Set(picks.map(p=>p.sleeper_id))}
function eligible(){let d=drafted();return players.filter(p=>!d.has(p.sleeper_id)&&(!q||(`${p.name} ${p.nfl_team||''}`.toLowerCase().includes(q.toLowerCase())))&&(pos==='ALL'||p.position===pos)).slice(0,80)}
function remaining(){if(!state)return 0;if(state.status!=='running'||!state.pick_started_at)return Math.max(0,state.remaining_seconds??state.pick_seconds??90);return Math.max(0,(state.remaining_seconds??state.pick_seconds??90)-Math.floor((Date.now()-new Date(state.pick_started_at).getTime())/1000))}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){clearInterval(timer);let n=picks.length+1,round=Math.floor((n-1)/18)+1,expected=turnTeam(),expectedTeam=teams.find(t=>t.team_number===expected),mine=myTeam?.team_number===expected,st=state?.status||'setup',done=state&&picks.length>=18*state.rounds,progress=Math.min(100,(picks.length/(18*(state?.rounds||13)))*100),rem=remaining();document.getElementById('app').innerHTML=`<div class="top"><div class="brand">📝 Guillotine Draft Room<small>${esc(league.name)} · ${esc(league.season||2026)} Season</small></div><div class="turn"><b>${done?'Draft Complete':st==='running'?'Pick '+n:'Draft '+st}</b><small>Round ${round} · ${picks.length}/${state?.rounds?18*state.rounds:234} picks</small></div></div><section class="hero"><div class="eyebrow">${st==='running'?'LIVE DRAFT':st==='paused'?'DRAFT PAUSED':st==='complete'?'DRAFT COMPLETE':'DRAFT ROOM'}</div><h1>${expectedTeam&&!done?esc(expectedTeam.name):'All Picks Complete'}</h1><div class="muted">${st==='running'&&!done?(mine?'<span class="you">🔥 YOU ARE ON THE CLOCK!</span>':`Waiting for ${esc(expectedTeam?.manager_name||expectedTeam?.name||'next manager')}.`):st==='paused'?'The commissioner has paused the draft clock.':st==='setup'?'The commissioner has not started the draft yet.':'The draft is complete.'}</div>${st==='running'&&!done?`<div class="clockbar ${rem<=15?'danger':rem<=30?'warning':''}"><div><div class="muted">TIME REMAINING</div><div class="clocknum" id="clock">${fmt(rem)}</div></div><div style="text-align:right"><b>Pick #${n}</b><br><span class="muted">${mine?'Make your pick now':'On the clock: '+esc(expectedTeam?.name||'')}</span></div></div>`:''}<div class="bar"><div class="fill" style="width:${progress}%"></div></div></section><div class="grid"><div><section class="card"><h2>🔎 Player Pool</h2><div class="controls"><input class="search" placeholder="Search player or NFL team…" value="${esc(q)}" oninput="q=this.value;renderPlayers()"><select class="select" onchange="pos=this.value;renderPlayers()"><option>ALL</option><option ${pos==='QB'?'selected':''}>QB</option><option ${pos==='RB'?'selected':''}>RB</option><option ${pos==='WR'?'selected':''}>WR</option><option ${pos==='TE'?'selected':''}>TE</option><option ${pos==='K'?'selected':''}>K</option><option ${pos==='DEF'?'selected':''}>DEF</option></select></div><div id="players">${playerHTML(eligible(),expectedTeam,mine,st)}</div></section><section class="card"><h2>📜 Pick History</h2><div>${picks.length?picks.slice().reverse().map(p=>`<div class="pick"><div class="picknum">#${p.pick_number}<div class="round">R${p.round}</div></div><div><b>${esc(p.player_name)}</b><br><span class="muted">${esc(p.position)} · ${esc(teams.find(t=>t.id===p.team_id)?.name||'')}</span></div><div class="muted">T${teams.find(t=>t.id===p.team_id)?.team_number||'?'}</div></div>`).join(''):'<div class="empty">No picks yet. The commissioner can start the draft.</div>'}</div></section></div><div><section class="card"><h2>👥 Draft Board</h2><div class="board">${teams.map(t=>{let rr=roster.filter(r=>r.team_id===t.id);return `<div class="team ${t.id===myTeam?.id?'current':''}"><div class="teamtop"><span class="teamname">${t.team_number}. ${esc(t.name)}</span><span class="count">${rr.length} players</span></div><div class="mini">${esc(t.manager_name||'Waiting for manager')}</div><div class="status ${t.owner_user_id?'green':'gold'}">${t.owner_user_id?'● JOINED':'○ OPEN'}</div></div>`}).join('')}</div></section><section class="card"><h2>🏈 My Draft Team</h2>${myTeam?`<b>${esc(myTeam.name)}</b><div class="muted">${esc(myTeam.manager_name||'')}</div><div style="margin-top:8px">${roster.filter(r=>r.team_id===myTeam.id).map(r=>{let p=players.find(x=>x.sleeper_id===r.sleeper_id);return `<div class="notice"><b>${esc(p?.name||r.sleeper_id)}</b> <span class="pos">${esc(p?.position||'')}</span><br><span class="muted">Drafted · Bench</span></div>`}).join('')||'<div class="empty">No players drafted yet.</div>'}</div>`:'<div class="notice">You have not claimed a team yet.</div>'}</section><section class="card"><h2>🎛️ Draft Status</h2><div class="notice">${st==='running'?'<span class="green">LIVE:</span> The clock resets automatically after every pick.':st==='paused'?'<span class="gold">PAUSED:</span> Wait for the commissioner to resume.':st==='complete'?'<span class="green">COMPLETE:</span> All draft picks are finished.':'Waiting for the commissioner to start the draft.'}</div><div class="controls"><button class="alt" onclick="refresh()">↻ Refresh</button><button class="alt" onclick="location.href='draft-control.html'">⚙️ Commissioner</button></div></section></div></div>`;if(st==='running'&&!done)timer=setInterval(updateClock,250)}
function playerHTML(list,expectedTeam,mine,st){if(!list.length)return '<div class="empty">No available players match that search.</div>';return list.map(p=>`<div class="player"><div class="avatar">${esc(p.position||'?')}</div><div><b>${esc(p.name)}</b><br><span class="muted">${esc(p.nfl_team||'FA')}</span><span class="pos">${esc(p.position||'')}</span></div><button onclick="draft('${esc(p.sleeper_id)}')" ${st==='running'&&(mine||league.commissioner_user_id===user.id)?'':'disabled'}>${mine?'DRAFT':'Pick'}</button></div>`).join('')}
function renderPlayers(){let el=document.getElementById('players');if(el)el.innerHTML=playerHTML(eligible(),teams.find(t=>t.team_number===turnTeam()),myTeam?.team_number===turnTeam(),state?.status||'setup')}
function updateClock(){let el=document.getElementById('clock');if(!el)return;let r=remaining();el.textContent=fmt(r);let box=el.closest('.clockbar');box.className='clockbar '+(r<=15?'danger':r<=30?'warning':'');if(r===0){el.textContent='00:00'}}
async function draft(sid){let p=players.find(x=>x.sleeper_id===sid),t=teams.find(x=>x.team_number===turnTeam());if(!p||!t)return;if(!state||state.status!=='running'){alert('The draft is not currently running.');return}if(!confirm(`Draft ${p.name} to ${t.name}?`))return;try{let r=await db.rpc('make_draft_pick',{p_league_id:league.id,p_team_id:t.id,p_sleeper_id:p.sleeper_id,p_player_name:p.name,p_position:p.position});if(r.error)throw r.error;await load()}catch(e){alert(e.message||e);await refresh()}}
async function refresh(){try{await load()}catch(e){alert(e.message||e)}}
async function start(){try{await auth();await load();db.channel('draft-room-live').on('postgres_changes',{event:'*',schema:'public',table:'draft_picks',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'roster_players',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'draft_state',filter:'league_id=eq.'+league.id},load).subscribe();setInterval(refresh,30000)}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Draft Room unavailable</h2><p class="muted">'+esc(e.message||e)+'</p><a href="index.html">Return to League Manager</a></div>'}}start();
</script></body></html>
