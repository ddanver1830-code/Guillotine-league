<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#0b1220;color:#fff}header{padding:16px;background:#020617;position:sticky;top:0;z-index:5}main{max-width:1200px;margin:auto;padding:16px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}button{padding:10px 14px;border:0;border-radius:8px;background:#22c55e;font-weight:bold;cursor:pointer}.alt{background:#263244;color:#fff}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.stat{font-size:30px;font-weight:bold}.muted{color:#94a3b8}.alive{color:#86efac}.out,.err{color:#fca5a5}.ok{color:#86efac}.notice{padding:12px;border-radius:8px;background:#172033;margin-bottom:14px}.linkbox{font-size:12px;word-break:break-all;color:#93c5fd}input,select{width:100%;padding:10px;background:#020617;color:#fff;border:1px solid #334155;border-radius:7px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334155;text-align:left}.scroll{overflow:auto}.player-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #334155}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#263244;font-size:12px;margin-right:5px}.pick{padding:10px;border-left:3px solid #22c55e;background:#0f172a;margin:6px 0}@media(max-width:650px){.player-row{align-items:flex-start;flex-direction:column}}</style></head><body><header><b>🏈 Guillotine League Manager</b><div class="muted">18-team Survivor / Guillotine Fantasy Football • LIVE SHARED LEAGUE</div></header><main><div id="nav" class="nav"></div><div id="app"><div class="card">Loading league…</div></div></main><script>
const SUPABASE_URL='https://unmahnndjtljktvrupkh.supabase.co';const SUPABASE_KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const LEAGUE_KEY='guillotine-live-league-id';let session=null,league=null,teams=[],players=[],roster=[],picks=[],myTeam=null,playerSearch='',posFilter='ALL';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const code=()=>Math.random().toString(36).slice(2,8).toUpperCase();
async function auth(){let r=await db.auth.getSession();if(r.error)throw r.error;if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}session=r.data.session}
async function load(){const id=localStorage.getItem(LEAGUE_KEY);if(id){let r=await db.from('leagues').select('*').eq('id',id).maybeSingle();if(r.error)throw r.error;if(r.data)league=r.data}if(!league){let r=await db.from('leagues').insert({name:'Guillotine League',code:code(),season:2026,current_week:1,status:'setup',commissioner_user_id:session.user.id}).select().single();if(r.error)throw r.error;league=r.data;localStorage.setItem(LEAGUE_KEY,league.id);let rows=Array.from({length:18},(_,i)=>({league_id:league.id,team_number:i+1,name:'Team '+(i+1),faab:100,alive:true}));r=await db.from('teams').insert(rows);if(r.error)throw r.error}let r=await db.from('teams').select('*').eq('league_id',league.id).order('team_number');if(r.error)throw r.error;teams=r.data||[];myTeam=teams.find(t=>t.owner_user_id===session.user.id)||null;let rr=await db.from('roster_players').select('*').eq('league_id',league.id);if(rr.error)throw rr.error;roster=rr.data||[];let dr=await db.from('draft_picks').select('*').eq('league_id',league.id).order('pick_number');if(dr.error)throw dr.error;picks=dr.data||[]}
async function loadPlayers(){let r=await db.from('players').select('*').order('name');if(r.error)throw r.error;players=r.data||[]}
function nav(){document.getElementById('nav').innerHTML=['Dashboard','My Team','Draft Room','Managers','Rules','Commissioner'].map(x=>`<button class="alt" onclick="go('${x}')">${x}</button>`).join('')};async function go(x){location.hash=x;if(x==='Draft Room'){document.getElementById('app').innerHTML='<div class="card"><h2>Draft Room</h2><p class="muted">Loading NFL players…</p></div>';try{await loadPlayers()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2 class="err">Player load failed</h2><p>'+esc(e.message||e)+'</p></div>';return}}render()};function joinUrl(t){return location.href.split('#')[0].replace(/index\.html$/,'')+'join.html?code='+encodeURIComponent(league.code)+'&team='+t.team_number}
function dashboard(){let alive=teams.filter(t=>t.alive).length;let n=picks.length+1,r=Math.floor(picks.length/18)+1,turn=r%2?n%18||18:18-(n%18||18);return `<div class="grid"><div class="card"><div class="muted">Teams Alive</div><div class="stat">${alive}</div></div><div class="card"><div class="muted">Current Week</div><div class="stat">${league.current_week}/17</div></div><div class="card"><div class="muted">Starting FAAB</div><div class="stat">$100</div></div><div class="card"><div class="muted">League Code</div><div class="stat">${esc(league.code)}</div></div></div><div class="card"><h2>Draft Status</h2><p>${picks.length} picks made.</p><p><b>${picks.length<234?'Current pick: Team '+turn:'Draft complete'}</b></p><button onclick="go('Draft Room')">Open Draft Room</button></div><div class="card"><h2>Manager Join Links</h2><div class="notice">Send each manager their specific link. It is locked to that team.</div>${teams.map(t=>`<div style="border-top:1px solid #334155;padding:11px 0"><b>${esc(t.name)}</b> — ${t.manager_name?esc(t.manager_name):'<span class="muted">Open</span>'}<br><span class="linkbox">${esc(joinUrl(t))}</span> <button onclick="copyLink('${t.team_number}')">Copy</button></div>`).join('')}</div>`}
function myTeamPage(){if(!myTeam)return `<div class="card"><h2>My Team</h2><p class="muted">This browser is not attached to a manager team. Use your invitation link.</p></div>`;let r=roster.filter(x=>x.team_id===myTeam.id);return `<div class="grid"><div class="card"><div class="muted">My Team</div><div class="stat">${esc(myTeam.name)}</div><p>${esc(myTeam.manager_name||'')}</p></div><div class="card"><div class="muted">FAAB Remaining</div><div class="stat">$${myTeam.faab}</div></div><div class="card"><div class="muted">Status</div><div class="stat ${myTeam.alive?'alive':'out'}">${myTeam.alive?'ALIVE':'OUT'}</div></div></div><div class="card"><h2>Roster</h2>${r.length?`<table><tr><th>Player</th><th>Acquired</th><th>Method</th><th>Slot</th></tr>${r.map(x=>{let p=players.find(z=>z.sleeper_id===x.sleeper_id);return `<tr><td>${esc(p?.name||x.sleeper_id)}<br><span class="muted">${esc(p?.position||'')} ${esc(p?.nfl_team||'')}</span></td><td>Week ${x.acquired_week||'-'}</td><td>${esc(x.acquired_via)}</td><td>${esc(x.roster_slot||'BENCH')}</td></tr>`}).join('')}</table>`:'<p class="muted">No players yet. Your roster will fill during the draft.</p>'}</div>`}
function draftRoom(){let filtered=players.filter(p=>{let q=playerSearch.toLowerCase();return(!q||(`${p.name} ${p.nfl_team||''} ${p.position||''}`).toLowerCase().includes(q))&&(posFilter==='ALL'||p.position===posFilter)}).slice(0,100);let next=picks.length+1,round=Math.floor(picks.length/18)+1,teamNo=next<=234?(round%2?((next-1)%18)+1:18-((next-1)%18)):null,selected=teams.find(t=>t.team_number===teamNo);return `<div class="grid"><div class="card"><div class="muted">Pick</div><div class="stat">${next<=234?next:'Complete'}</div></div><div class="card"><div class="muted">Round</div><div class="stat">${next<=234?round:'-'}</div></div><div class="card"><div class="muted">On the Clock</div><div class="stat">${selected?esc(selected.name):'-'}</div></div><div class="card"><div class="muted">Players Loaded</div><div class="stat">${players.length}</div></div></div><div class="card"><h2>Draft Room</h2>${!players.length?'<div class="notice">Commissioner: go to Commissioner → Sync NFL Players first.</div>':`<div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:10px"><input placeholder="Search player, team or position" value="${esc(playerSearch)}" oninput="playerSearch=this.value;renderDraftOnly()"><select onchange="posFilter=this.value;renderDraftOnly()"><option>ALL</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option><option>DEF</option></select></div>${filtered.map(p=>{let taken=picks.some(x=>x.sleeper_id===p.sleeper_id);return `<div class="player-row"><div><b>${esc(p.name)}</b><br><span class="pill">${esc(p.position||'')}</span><span class="pill">${esc(p.nfl_team||'FA')}</span>${p.injury_status?`<span class="pill">${esc(p.injury_status)}</span>`:''}</div>${taken?'<span class="muted">DRAFTED</span>':`<button onclick="draftPlayer('${esc(p.sleeper_id)}')">Draft</button>`}</div>`}).join('')}`}</div><div class="card"><h2>Recent Picks</h2>${picks.length?picks.slice().reverse().slice(0,40).map(x=>`<div class="pick"><b>#${x.pick_number} — ${esc(teams.find(t=>t.id===x.team_id)?.name||'Team')}</b><br>${esc(x.player_name||x.sleeper_id)} <span class="pill">${esc(x.position||'')}</span></div>`).join(''):'<p class="muted">No picks yet.</p>'}</div>`}
function renderDraftOnly(){document.getElementById('app').innerHTML=draftRoom()}
async function draftPlayer(id){let p=players.find(x=>x.sleeper_id===id);let team=teams.find(t=>t.owner_user_id===session.user.id);if(!team&&league.commissioner_user_id===session.user.id){let n=prompt('Commissioner: team number making this pick (1-18):');team=teams.find(t=>t.team_number===Number(n))}if(!team)return alert('This browser is not assigned to a team.');let r=await db.rpc('make_draft_pick',{p_league_id:league.id,p_team_id:team.id,p_sleeper_id:p.sleeper_id,p_player_name:p.name,p_position:p.position||''});if(r.error)alert(r.error.message);else{await load();render()}}
function managers(){return `<div class="card"><h2>Managers & Teams</h2><div class="scroll"><table><tr><th>#</th><th>Team</th><th>Manager</th><th>FAAB</th><th>Status</th><th>Roster</th></tr>${teams.map(t=>`<tr><td>${t.team_number}</td><td><input value="${esc(t.name)}" onchange="saveTeam('${t.id}',this.value)"></td><td>${t.manager_name?esc(t.manager_name):'<span class="muted">Not claimed</span>'}</td><td>$${t.faab}</td><td class="${t.alive?'alive':'out'}">${t.alive?'ALIVE':'OUT'}</td><td>${roster.filter(x=>x.team_id===t.id).length}</td></tr>`).join('')}</table></div></div>`}
function rules(){return `<div class="grid"><div class="card"><h2>League Rules</h2><p>18 teams • 17 weeks</p><p>Lowest weekly score is eliminated.</p><p>Eliminated roster enters blind FAAB waivers.</p><p>$100 starting FAAB.</p><p>No trades • No playoffs.</p><p>Tiebreaker: lower season-long points.</p></div><div class="card"><h2>Roster Settings</h2><p><b>Weeks 1–6:</b> QB 1, RB 1, WR 2, TE 1, FLEX 1, K 1, DST 1, Bench 4, IR 1.</p><p><b>Weeks 7–12:</b> QB 1, RB 2, WR 3, TE 1, FLEX 1, K 1, DST 1, Bench 5, IR 1.</p><p><b>Weeks 13–17:</b> QB 2, RB 2, WR 3, TE 1, FLEX 2, K 1, DST 1, Bench 6, IR 1.</p></div><div class="card"><h2>Scoring Defaults</h2><p>Pass TD 4 • Pass yards 0.04 • INT -2</p><p>Rush yards 0.1 • Rush TD 6</p><p>Reception 0.5 • Receiving yards 0.1 • Receiving TD 6</p><p>Fumble -2</p></div></div>`}
function commissioner(){return `<div class="card"><h2>Commissioner</h2><p>League: <b>${esc(league.name)}</b></p><label>League name</label><input id="lname" value="${esc(league.name)}"><br><br><button onclick="saveLeagueName()">Save League Name</button><h3>Current Week</h3><input id="wk" type="number" min="1" max="17" value="${league.current_week}"><br><br><button onclick="saveWeek()">Save Week</button><hr><h2>NFL Player Database</h2><p class="muted">Syncs the current NFL player list from Sleeper into the shared database.</p><button id="syncbtn" onclick="syncPlayers()">Sync NFL Players</button> <span id="syncmsg" class="ok"></span><hr><div class="notice">Draft database setup is complete. Sync NFL Players before opening the Draft Room.</div></div>`}
async function saveTeam(id,name){let r=await db.from('teams').update({name:name.trim()}).eq('id',id).eq('league_id',league.id);if(r.error)alert(r.error.message);else{await load();render()}}async function saveLeagueName(){let name=document.getElementById('lname').value.trim();if(!name)return;let r=await db.from('leagues').update({name}).eq('id',league.id);if(r.error)alert(r.error.message);else{league.name=name;render()}}async function saveWeek(){let w=Math.max(1,Math.min(17,+document.getElementById('wk').value||1));let r=await db.from('leagues').update({current_week:w}).eq('id',league.id);if(r.error)alert(r.error.message);else{league.current_week=w;render()}}async function copyLink(n){let u=joinUrl(teams.find(x=>x.team_number==n));try{await navigator.clipboard.writeText(u);alert('Join link copied')}catch(e){prompt('Copy this link:',u)}}
async function syncPlayers(){let el=document.getElementById('syncmsg'),btn=document.getElementById('syncbtn');if(!el||!btn)return;btn.disabled=true;btn.textContent='Syncing…';el.className='ok';el.textContent=' Connecting to NFL player feed…';try{let resp=await fetch('https://api.sleeper.app/v1/players/nfl',{cache:'no-store'});if(!resp.ok)throw Error('Sleeper returned HTTP '+resp.status);let all=await resp.json();if(!all||typeof all!=='object')throw Error('Sleeper returned invalid player data.');let rows=Object.entries(all).map(([id,p])=>({sleeper_id:id,name:p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||id,first_name:p.first_name||null,last_name:p.last_name||null,position:p.position||null,nfl_team:p.team||null,status:p.status||null,injury_status:p.injury_status||null,metadata:{active:p.active??null}})).filter(p=>['QB','RB','WR','TE','K','DEF'].includes(p.position));if(!rows.length)throw Error('No NFL players were returned by Sleeper.');for(let i=0;i<rows.length;i+=200){el.textContent=` Saving players ${Math.min(i+200,rows.length)} of ${rows.length}…`;let r=await db.from('players').upsert(rows.slice(i,i+200),{onConflict:'sleeper_id'});if(r.error)throw Error('Supabase: '+r.error.message)}await loadPlayers();el.className='ok';el.textContent=` ✓ Successfully synced ${players.length} NFL players.`;btn.textContent='Sync Complete';setTimeout(()=>{btn.disabled=false;btn.textContent='Sync NFL Players'},2500);if(location.hash==='#Commissioner')document.getElementById('app').querySelector('#syncmsg').textContent=` ✓ Successfully synced ${players.length} NFL players.`}catch(e){el.className='err';el.textContent=' ✕ Sync failed: '+(e.message||String(e));btn.disabled=false;btn.textContent='Try Again'}}
async function render(){nav();let p=location.hash.slice(1)||'Dashboard';if(p==='Managers'){document.getElementById('app').innerHTML=managers();return}document.getElementById('app').innerHTML=({Dashboard:dashboard,'My Team':myTeamPage,'Draft Room':draftRoom,Rules:rules,Commissioner:commissioner}[p]||dashboard)()}
async function start(){try{await auth();await load();try{await loadPlayers()}catch(e){players=[]}await render();db.channel('league-live').on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'roster_players',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'draft_picks',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'leagues',filter:'id=eq.'+league.id},async()=>{await load();render()}).subscribe()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2 class="err">Unable to connect</h2><p>'+esc(e.message||e)+'</p></div>'}}start();
</script></body></html>
