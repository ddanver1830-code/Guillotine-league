<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#0b1220;color:#fff}header{padding:18px;background:#020617;position:sticky;top:0;z-index:2}main{max-width:1150px;margin:auto;padding:18px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}button{padding:10px 14px;border:0;border-radius:8px;background:#22c55e;font-weight:bold;cursor:pointer}.alt{background:#263244;color:#fff}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #334155;text-align:left;vertical-align:middle}input{width:100%;box-sizing:border-box;padding:9px;background:#020617;color:#fff;border:1px solid #334155;border-radius:7px}.muted{color:#94a3b8}.stat{font-size:30px;font-weight:bold}.alive{color:#86efac}.out{color:#fca5a5}.linkbox{font-size:12px;word-break:break-all;color:#93c5fd}.smallbtn{padding:6px 9px;font-size:12px}.notice{padding:12px;border-radius:8px;background:#172033;margin-bottom:14px}.ok{color:#86efac}.err{color:#fca5a5}</style></head><body><header><b>🏈 Guillotine League Manager</b><div class="muted">18-team Survivor / Guillotine Fantasy Football • LIVE SHARED LEAGUE</div></header><main><div id="nav" class="nav"></div><div id="app"><div class="card">Loading league…</div></div></main><script>
const SUPABASE_URL='https://unmahnndjtljktvrupkh.supabase.co';
const SUPABASE_KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const LEAGUE_KEY='guillotine-live-league-id';let session=null,league=null,teams=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
async function auth(){let r=await db.auth.getSession();if(r.error)throw r.error;if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}session=r.data.session}
async function load(){const id=localStorage.getItem(LEAGUE_KEY);if(id){let r=await db.from('leagues').select('*').eq('id',id).maybeSingle();if(r.error)throw r.error;if(r.data)league=r.data}if(!league){const c=code();let r=await db.from('leagues').insert({name:'Guillotine League',code:c,season:2026,current_week:1,status:'setup',commissioner_user_id:session.user.id}).select().single();if(r.error)throw r.error;league=r.data;localStorage.setItem(LEAGUE_KEY,league.id);let rows=Array.from({length:18},(_,i)=>({league_id:league.id,team_number:i+1,name:'Team '+(i+1),faab:100,alive:true}));r=await db.from('teams').insert(rows);if(r.error)throw r.error}let r=await db.from('teams').select('*').eq('league_id',league.id).order('team_number');if(r.error)throw r.error;teams=r.data||[]}
function nav(){const a=['Dashboard','Managers','Rules','Commissioner'];navEl=document.getElementById('nav');navEl.innerHTML=a.map(x=>`<button class="alt" onclick="go('${x}')">${x}</button>`).join('')}
function go(x){location.hash=x;render()}
function joinUrl(t){return location.href.split('#')[0].replace(/index\.html$/,'')+'join.html?code='+encodeURIComponent(league.code)+'&team='+t.team_number}
function dashboard(){let alive=teams.filter(t=>t.alive).length;return `<div class="grid"><div class="card"><div class="muted">Teams Alive</div><div class="stat">${alive}</div></div><div class="card"><div class="muted">Current Week</div><div class="stat">${league.current_week}/17</div></div><div class="card"><div class="muted">Starting FAAB</div><div class="stat">$100</div></div><div class="card"><div class="muted">League Code</div><div class="stat">${esc(league.code)}</div></div></div><div class="card"><h2>Manager Join Links</h2><div class="notice">Each link is locked to one team. Send the manager their specific link. They enter their name and claim the team.</div>${teams.map(t=>`<div style="border-top:1px solid #334155;padding:12px 0"><b>${esc(t.name)}</b> — ${t.manager_name?esc(t.manager_name):'<span class="muted">Open</span>'}<br><span class="linkbox">${esc(joinUrl(t))}</span> <button class="smallbtn" onclick="copyLink('${t.team_number}')">Copy</button></div>`).join('')}</div>`}
function managers(){return `<div class="card"><h2>Managers & Teams</h2><p class="muted">Changes here are shared with everyone in the league.</p><table><tr><th>#</th><th>Team Name</th><th>Manager</th><th>FAAB</th><th>Status</th></tr>${teams.map(t=>`<tr><td>${t.team_number}</td><td><input value="${esc(t.name)}" onchange="saveTeam('${t.id}',this.value)"></td><td>${t.manager_name?esc(t.manager_name):'<span class="muted">Not claimed</span>'}</td><td>$${t.faab}</td><td class="${t.alive?'alive':'out'}">${t.alive?'ALIVE':'OUT'}</td></tr>`).join('')}</table></div>`}
function rules(){return `<div class="grid"><div class="card"><h2>League Rules</h2><p>18 teams • 17 weeks</p><p>Lowest weekly score is eliminated.</p><p>Eliminated roster enters blind FAAB waivers.</p><p>$100 starting FAAB.</p><p>No trades • No playoffs.</p><p>Tiebreaker: lower season-long points.</p></div><div class="card"><h2>Roster Settings</h2><p><b>Weeks 1–6:</b> QB 1, RB 1, WR 2, TE 1, FLEX 1, K 1, DST 1, Bench 4, IR 1.</p><p><b>Weeks 7–12:</b> QB 1, RB 2, WR 3, TE 1, FLEX 1, K 1, DST 1, Bench 5, IR 1.</p><p><b>Weeks 13–17:</b> QB 2, RB 2, WR 3, TE 1, FLEX 2, K 1, DST 1, Bench 6, IR 1.</p></div><div class="card"><h2>Scoring Defaults</h2><p>Pass TD 4 • Pass yards 0.04 • INT -2</p><p>Rush yards 0.1 • Rush TD 6</p><p>Reception 0.5 • Receiving yards 0.1 • Receiving TD 6</p><p>Fumble -2</p></div></div>`}
function commissioner(){return `<div class="card"><h2>Commissioner</h2><p>League: <b>${esc(league.name)}</b></p><label>League name</label><input id="lname" value="${esc(league.name)}"><br><br><button onclick="saveLeagueName()">Save League Name</button><h3>Current Week</h3><input id="wk" type="number" min="1" max="17" value="${league.current_week}"><br><br><button onclick="saveWeek()">Save Week</button><div class="notice" style="margin-top:18px">Next build step: live NFL player data, draft, rosters, lineups, scoring, automatic elimination and blind FAAB processing.</div></div>`}
async function saveTeam(id,name){name=name.trim();if(!name)return;let r=await db.from('teams').update({name}).eq('id',id).eq('league_id',league.id);if(r.error)alert(r.error.message);else await load();render()}
async function saveLeagueName(){let name=document.getElementById('lname').value.trim();if(!name)return;let r=await db.from('leagues').update({name}).eq('id',league.id);if(r.error)alert(r.error.message);else{league.name=name;alert('Saved.')}}
async function saveWeek(){let w=Math.max(1,Math.min(17,+document.getElementById('wk').value||1));let r=await db.from('leagues').update({current_week:w}).eq('id',league.id);if(r.error)alert(r.error.message);else{league.current_week=w;render()}}
async function copyLink(n){let t=teams.find(x=>x.team_number==n);let u=joinUrl(t);try{await navigator.clipboard.writeText(u);alert('Join link copied for '+t.name)}catch(e){prompt('Copy this link:',u)}}
async function render(){nav();let p=location.hash.slice(1)||'Dashboard';let fn={Dashboard:dashboard,Managers:managers,Rules:rules,Commissioner:commissioner}[p]||dashboard;document.getElementById('app').innerHTML=fn()}
async function start(){try{await auth();await load();await render();db.channel('league-live').on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'leagues',filter:'id=eq.'+league.id},async()=>{await load();render()}).subscribe()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2 class="err">Unable to connect</h2><p>'+esc(e.message||e)+'</p><p class="muted">Check that Anonymous Sign-Ins are enabled and the SQL installer and join.sql have been run.</p></div>'}}
start();
</script></body></html>
