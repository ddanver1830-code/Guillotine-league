<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#0b1220;color:#fff}header{padding:16px;background:#020617;position:sticky;top:0;z-index:5}main{max-width:1200px;margin:auto;padding:16px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}button{padding:10px 14px;border:0;border-radius:8px;background:#22c55e;font-weight:bold;cursor:pointer}.alt{background:#263244;color:#fff}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.stat{font-size:28px;font-weight:bold}.muted{color:#94a3b8}.alive{color:#86efac}.out,.err{color:#fca5a5}.ok{color:#86efac}.notice{padding:12px;border-radius:8px;background:#172033;margin:10px 0}.linkbox{font-size:12px;word-break:break-all;color:#93c5fd}input,select{width:100%;padding:10px;background:#020617;color:#fff;border:1px solid #334155;border-radius:7px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334155;text-align:left}.scroll{overflow:auto}.player-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #334155}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#263244;font-size:12px;margin:2px}.pick{padding:10px;border-left:3px solid #22c55e;background:#0f172a;margin:6px 0}.slot{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin:7px 0}@media(max-width:650px){.player-row{align-items:flex-start;flex-direction:column}.slot{grid-template-columns:1fr}}</style></head><body><header><b>🏈 Guillotine League Manager</b><div class="muted">18-team Survivor / Guillotine Fantasy Football • LIVE SHARED LEAGUE</div></header><main><div id="nav" class="nav"></div><div id="app"><div class="card">Loading league…</div></div></main><script>
const SUPABASE_URL='https://unmahnndjtljktvrupkh.supabase.co',SUPABASE_KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),LEAGUE_KEY='guillotine-live-league-id';let session=null,league=null,teams=[],players=[],roster=[],picks=[],myTeam=null,scores=[],waivers=[],elims=[],playerSearch='',posFilter='ALL';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const code=()=>Math.random().toString(36).slice(2,8).toUpperCase();
async function auth(){let r=await db.auth.getSession();if(r.error)throw r.error;if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}session=r.data.session}
async function load(){let id=localStorage.getItem(LEAGUE_KEY);if(id){let r=await db.from('leagues').select('*').eq('id',id).maybeSingle();if(r.error)throw r.error;if(r.data)league=r.data}if(!league){let r=await db.from('leagues').insert({name:'Guillotine League',code:code(),season:2026,current_week:1,status:'setup',commissioner_user_id:session.user.id}).select().single();if(r.error)throw r.error;league=r.data;localStorage.setItem(LEAGUE_KEY,league.id);r=await db.from('teams').insert(Array.from({length:18},(_,i)=>({league_id:league.id,team_number:i+1,name:'Team '+(i+1),faab:100,alive:true})));if(r.error)throw r.error}let r=await db.from('teams').select('*').eq('league_id',league.id).order('team_number');if(r.error)throw r.error;teams=r.data||[];myTeam=teams.find(t=>t.owner_user_id===session.user.id)||null;let rr=await db.from('roster_players').select('*').eq('league_id',league.id);if(rr.error)throw rr.error;roster=rr.data||[];let dr=await db.from('draft_picks').select('*').eq('league_id',league.id).order('pick_number');if(dr.error)throw dr.error;picks=dr.data||[];let sr=await db.from('weekly_scores').select('*').eq('league_id',league.id).order('week').order('points');scores=sr.error?[]:sr.data||[];let wr=await db.from('waiver_pool').select('*').eq('league_id',league.id);waivers=wr.error?[]:wr.data||[];let er=await db.from('eliminations').select('*').eq('league_id',league.id).order('week');elims=er.error?[]:er.data||[]}
async function loadPlayers(){let r=await db.from('players').select('*').order('name');if(r.error)throw r.error;players=r.data||[]}
function nav(){document.getElementById('nav').innerHTML=['Dashboard','My Team','Draft Room','Managers','Standings','Waivers','Rules','Commissioner'].map(x=>`<button class="alt" onclick="go('${x}')">${x}</button>`).join('')};async function go(x){location.hash=x;if(x==='Draft Room'){document.getElementById('app').innerHTML='<div class="card"><h2>Draft Room</h2><p class="muted">Loading NFL players…</p></div>';try{await loadPlayers()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2 class="err">Player load failed</h2><p>'+esc(e.message||e)+'</p></div>';return}}render()};function joinUrl(t){return location.href.split('#')[0].replace(/index\.html$/,'')+'join.html?code='+encodeURIComponent(league.code)+'&team='+t.team_number}
function dashboard(){let alive=teams.filter(t=>t.alive).length,w=league.current_week;let last=scores.filter(s=>s.week===w).sort((a,b)=>a.points-b.points)[0];return `<div class="grid"><div class="card"><div class="muted">Teams Alive</div><div class="stat">${alive}</div></div><div class="card"><div class="muted">Current Week</div><div class="stat">${w}/17</div></div><div class="card"><div class="muted">FAAB Starting</div><div class="stat">$100</div></div><div class="card"><div class="muted">League Code</div><div class="stat">${esc(league.code)}</div></div></div><div class="card"><h2>Week ${w} Status</h2><p>${last?`Current lowest score: <b>${last.points}</b> — ${esc(teams.find(t=>t.id===last.team_id)?.name||'Team')}`:'No scores calculated yet.'}</p><button onclick="go('My Team')">Set My Lineup</button> <button onclick="go('Standings')">View Standings</button></div><div class="card"><h2>Elimination History</h2>${elims.length?elims.map(e=>`<p>Week ${e.week}: <b>${esc(teams.find(t=>t.id===e.team_id)?.name||'Team')}</b> eliminated with ${e.score} points.</p>`).join(''):'<p class="muted">No teams eliminated yet.</p>'}</div><div class="card"><h2>Manager Join Links</h2>${teams.map(t=>`<div style="border-top:1px solid #334155;padding:10px 0"><b>${esc(t.name)}</b> — ${t.manager_name?esc(t.manager_name):'<span class="muted">Open</span>'}<br><span class="linkbox">${esc(joinUrl(t))}</span> <button onclick="copyLink('${t.team_number}')">Copy</button></div>`).join('')}</div>`}
function rosterByTeam(id){return roster.filter(x=>x.team_id===id)}function player(id){return players.find(p=>p.sleeper_id===id)}
function myTeamPage(){if(!myTeam)return `<div class="card"><h2>My Team</h2><p class="muted">Use your manager invitation link to claim a team.</p></div>`;let r=rosterByTeam(myTeam.id),w=league.current_week;return `<div class="grid"><div class="card"><div class="muted">My Team</div><div class="stat">${esc(myTeam.name)}</div><p>${esc(myTeam.manager_name||'')}</p></div><div class="card"><div class="muted">FAAB</div><div class="stat">$${myTeam.faab}</div></div><div class="card"><div class="muted">Status</div><div class="stat ${myTeam.alive?'alive':'out'}">${myTeam.alive?'ALIVE':'OUT'}</div></div></div><div class="card"><h2>Week ${w} Lineup</h2>${lineupForm(r,w)}</div><div class="card"><h2>Roster</h2>${r.length?`<table><tr><th>Player</th><th>Position</th><th>Acquired</th><th>Slot</th></tr>${r.map(x=>{let p=player(x.sleeper_id);return `<tr><td>${esc(p?.name||x.sleeper_id)}</td><td>${esc(p?.position||'')} ${esc(p?.nfl_team||'')}</td><td>Week ${x.acquired_week||'-'} (${esc(x.acquired_via)})</td><td>${esc(x.roster_slot||'BENCH')}</td></tr>`}).join('')}</table>`:'<p class="muted">No players on roster.</p>'}</div>`}
function slotsFor(w){return w<=6?['QB','RB','WR1','WR2','TE','FLEX','K','DEF']:w<=12?['QB','RB1','RB2','WR1','WR2','WR3','TE','FLEX','K','DEF']:['QB1','QB2','RB1','RB2','WR1','WR2','WR3','TE','FLEX1','FLEX2','K','DEF']}
function eligible(p,slot){if(!p)return false;if(slot.startsWith('QB'))return p.position==='QB';if(slot.startsWith('RB'))return p.position==='RB';if(slot.startsWith('WR'))return p.position==='WR';if(slot==='TE')return p.position==='TE';if(slot.startsWith('FLEX'))return ['RB','WR','TE'].includes(p.position);if(slot==='K')return p.position==='K';if(slot==='DEF')return p.position==='DEF';return false}
function lineupForm(r,w){let slots=slotsFor(w),existing={};let ls=window._lineups||[];ls.filter(x=>x.team_id===myTeam?.id&&x.week===w).forEach(x=>existing[x.slot]=x.sleeper_id);return slots.map(s=>`<div class="slot"><b>${s}</b><select id="slot_${s}"><option value="">Select player</option>${r.map(x=>{let p=player(x.sleeper_id);return eligible(p,s)?`<option value="${esc(x.sleeper_id)}" ${existing[s]===x.sleeper_id?'selected':''}>${esc(p.name)} (${p.position})</option>`:''}).join('')}</select></div>`).join('')+`<button onclick="saveLineup()">Save Week ${w} Lineup</button>`}
async function loadLineups(){if(!myTeam)return;let r=await db.from('lineups').select('*').eq('league_id',league.id).eq('team_id',myTeam.id).eq('week',league.current_week);window._lineups=r.error?[]:r.data||[]}
async function saveLineup(){let w=league.current_week,slots=slotsFor(w).map(s=>({slot:s,sleeper_id:document.getElementById('slot_'+s)?.value||''})).filter(x=>x.sleeper_id);let r=await db.rpc('set_lineup',{p_league_id:league.id,p_team_id:myTeam.id,p_week:w,p_slots:slots});if(r.error)alert(r.error.message);else{alert('Lineup saved!');await load();await loadLineups();render()}}
function draftRoom(){let f=players.filter(p=>{let q=playerSearch.toLowerCase();return(!q||(`${p.name} ${p.nfl_team||''} ${p.position||''}`).toLowerCase().includes(q))&&(posFilter==='ALL'||p.position===posFilter)}).slice(0,100),next=picks.length+1,r=Math.floor(picks.length/18)+1,teamNo=next<=234?(r%2?((next-1)%18)+1:18-((next-1)%18)):null;return `<div class="grid"><div class="card"><div class="muted">Pick</div><div class="stat">${next<=234?next:'Complete'}</div></div><div class="card"><div class="muted">Round</div><div class="stat">${next<=234?r:'-'}</div></div><div class="card"><div class="muted">On Clock</div><div class="stat">${esc(teams.find(t=>t.team_number===teamNo)?.name||'-')}</div></div><div class="card"><div class="muted">Players Loaded</div><div class="stat">${players.length}</div></div></div><div class="card"><h2>Draft Room</h2><div style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><input placeholder="Search player" value="${esc(playerSearch)}" oninput="playerSearch=this.value;renderDraftOnly()"><select onchange="posFilter=this.value;renderDraftOnly()"><option>ALL</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option><option>DEF</option></select></div>${f.map(p=>{let taken=picks.some(x=>x.sleeper_id===p.sleeper_id);return `<div class="player-row"><div><b>${esc(p.name)}</b><br><span class="pill">${esc(p.position||'')}</span><span class="pill">${esc(p.nfl_team||'FA')}</span></div>${taken?'<span class="muted">DRAFTED</span>':`<button onclick="draftPlayer('${esc(p.sleeper_id)}')">Draft</button>`}</div>`}).join('')}</div><div class="card"><h2>Recent Picks</h2>${picks.slice().reverse().slice(0,30).map(x=>`<div class="pick"><b>#${x.pick_number} — ${esc(teams.find(t=>t.id===x.team_id)?.name||'Team')}</b><br>${esc(x.player_name||x.sleeper_id)}</div>`).join('')||'<p class="muted">No picks yet.</p>'}</div>`}
function renderDraftOnly(){document.getElementById('app').innerHTML=draftRoom()}async function draftPlayer(id){let p=player(id),team=teams.find(t=>t.owner_user_id===session.user.id);if(!team&&league.commissioner_user_id===session.user.id){let n=prompt('Commissioner: team number (1-18)');team=teams.find(t=>t.team_number===+n)}if(!team)return alert('This browser is not assigned to a team.');let r=await db.rpc('make_draft_pick',{p_league_id:league.id,p_team_id:team.id,p_sleeper_id:id,p_player_name:p.name,p_position:p.position||''});if(r.error)alert(r.error.message);else{await load();render()}}
function standings(){let w=league.current_week,rows=teams.map(t=>({t,week:scores.find(s=>s.team_id===t.id&&s.week===w)?.points??null,total:scores.filter(s=>s.team_id===t.id&&s.week<=w).reduce((a,s)=>a+Number(s.points),0)})).sort((a,b)=>Number(b.total)-Number(a.total));return `<div class="card"><h2>Standings — Week ${w}</h2><div class="scroll"><table><tr><th>Rank</th><th>Team</th><th>Week ${w}</th><th>Season Points</th><th>Status</th></tr>${rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.t.name)}</td><td>${x.week===null?'—':x.week}</td><td>${x.total.toFixed(2)}</td><td class="${x.t.alive?'alive':'out'}">${x.t.alive?'ALIVE':`OUT W${x.t.elimination_week}`}</td></tr>`).join('')}</table></div></div>`}
function waivers(){let w=league.current_week,r=waivers.map(x=>player(x.sleeper_id)).filter(Boolean);return `<div class="card"><h2>Waiver Pool — Week ${w}</h2>${r.length?r.map(p=>`<div class="player-row"><div><b>${esc(p.name)}</b><br><span class="pill">${p.position}</span><span class="pill">${p.nfl_team||'FA'}</span></div>${myTeam?.alive?`<div style="display:flex;gap:6px;min-width:220px"><input id="bid_${p.sleeper_id}" type="number" min="0" max="${myTeam.faab}" placeholder="FAAB"><input id="pri_${p.sleeper_id}" type="number" min="1" value="1" style="max-width:65px"><button onclick="bid('${esc(p.sleeper_id)}')">Bid</button></div>`:''}</div>`).join(''):'<p class="muted">No players are currently in the waiver pool. Eliminated rosters will appear here.</p>'}</div><div class="card"><h3>How blind FAAB works</h3><p>Enter your bid and priority. Other managers cannot see your bids. The highest valid bid wins; ties go to lower priority number, then earlier submission.</p></div>`}
async function bid(id){let a=+document.getElementById('bid_'+id).value,p=+document.getElementById('pri_'+id).value||1;if(!Number.isInteger(a)||a<0||a>myTeam.faab)return alert('Enter a valid FAAB amount.');let r=await db.rpc('submit_waiver_bid',{p_league_id:league.id,p_team_id:myTeam.id,p_sleeper_id:id,p_bid_amount:a,p_priority:p,p_week:league.current_week});if(r.error)alert(r.error.message);else alert('Blind bid submitted.')}
function managers(){return `<div class="card"><h2>Managers & Teams</h2><div class="scroll"><table><tr><th>#</th><th>Team</th><th>Manager</th><th>FAAB</th><th>Status</th><th>Roster</th></tr>${teams.map(t=>`<tr><td>${t.team_number}</td><td><input value="${esc(t.name)}" onchange="saveTeam('${t.id}',this.value)"></td><td>${t.manager_name?esc(t.manager_name):'<span class="muted">Not claimed</span>'}</td><td>$${t.faab}</td><td class="${t.alive?'alive':'out'}">${t.alive?'ALIVE':'OUT'}</td><td>${rosterByTeam(t.id).length}</td></tr>`).join('')}</table></div></div>`}
function rules(){return `<div class="grid"><div class="card"><h2>League Rules</h2><p>18 teams • 17 weeks</p><p>Lowest weekly score is eliminated.</p><p>Eliminated roster enters blind FAAB waivers.</p><p>$100 starting FAAB.</p><p>No trades • No playoffs.</p><p>Tiebreaker: lower season-long points.</p></div><div class="card"><h2>Roster Settings</h2><p><b>Weeks 1–6:</b> QB 1, RB 1, WR 2, TE 1, FLEX 1, K 1, DST 1, Bench 4, IR 1.</p><p><b>Weeks 7–12:</b> QB 1, RB 2, WR 3, TE 1, FLEX 1, K 1, DST 1, Bench 5, IR 1.</p><p><b>Weeks 13–17:</b> QB 2, RB 2, WR 3, TE 1, FLEX 2, K 1, DST 1, Bench 6, IR 1.</p></div><div class="card"><h2>Scoring</h2><p>Pass TD 4 • Pass yards 0.04 • INT -2</p><p>Rush yards 0.1 • Rush TD 6</p><p>Reception 0.5 • Receiving yards 0.1 • Receiving TD 6 • Fumble -2</p></div></div>`}
function commissioner(){let w=league.current_week;return `<div class="card"><h2>Commissioner Controls</h2><p>League: <b>${esc(league.name)}</b> • Week ${w} • ${teams.filter(t=>t.alive).length} teams alive</p><label>League name</label><input id="lname" value="${esc(league.name)}"><br><br><button onclick="saveLeagueName()">Save Name</button><h3>Current Week</h3><input id="wk" type="number" min="1" max="17" value="${w}"><br><br><button onclick="saveWeek()">Save Week</button><hr><h3>1. Sync NFL Player Database</h3><button id="syncbtn" onclick="syncPlayers()">Sync NFL Players</button> <span id="syncmsg"></span><h3>2. Sync Week ${w} NFL Stats</h3><button onclick="syncStats()">Sync Week ${w} Stats</button> <span id="statmsg"></span><h3>3. Calculate Week ${w} Scores</h3><button onclick="calcScores()">Calculate Scores</button><h3>4. Eliminate Lowest Team</h3><button onclick="eliminate()">Process Elimination</button><h3>5. Process Blind FAAB Waivers</h3><button onclick="processWaivers()">Process Waivers</button><h3>6. Advance League</h3><button onclick="advanceWeek()">Advance to Next Week</button><hr><p class="muted">Recommended weekly order: sync stats → calculate scores → eliminate lowest → managers submit bids → process waivers → advance week.</p></div>`}
async function syncPlayers(){let m=document.getElementById('syncmsg');try{m.textContent=' Syncing…';let r=await fetch('https://api.sleeper.app/v1/players/nfl',{cache:'no-store'});if(!r.ok)throw Error('Sleeper HTTP '+r.status);let a=await r.json(),rows=Object.entries(a).map(([id,p])=>({sleeper_id:id,name:p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||id,first_name:p.first_name||null,last_name:p.last_name||null,position:p.position||null,nfl_team:p.team||null,status:p.status||null,injury_status:p.injury_status||null,metadata:{active:p.active??null}})).filter(p=>['QB','RB','WR','TE','K','DEF'].includes(p.position));for(let i=0;i<rows.length;i+=200){let x=await db.from('players').upsert(rows.slice(i,i+200),{onConflict:'sleeper_id'});if(x.error)throw x.error}await loadPlayers();m.textContent=' ✓ '+players.length+' players synced.'}catch(e){m.textContent=' ✕ '+(e.message||e)}}
async function syncStats(){let m=document.getElementById('statmsg'),w=league.current_week;try{m.textContent=' Syncing…';let u=`https://api.sleeper.app/v1/stats/nfl/regular/${league.season}/${w}`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('Sleeper HTTP '+r.status);let a=await r.json(),rows=Object.entries(a||{}).map(([id,s])=>({sleeper_id:id,week:w,season:league.season,stats:s||{}}));for(let i=0;i<rows.length;i+=200){let x=await db.from('nfl_stats').upsert(rows.slice(i,i+200),{onConflict:'sleeper_id,season,week'});if(x.error)throw x.error}m.textContent=' ✓ '+rows.length+' player stat lines saved.'}catch(e){m.textContent=' ✕ '+(e.message||e)}}
async function calcScores(){let r=await db.rpc('calculate_week_scores',{p_league_id:league.id,p_week:league.current_week});if(r.error)alert(r.error.message);else{alert('Scores calculated for '+r.data+' teams.');await load();render()}}
async function eliminate(){if(!confirm('Eliminate the lowest-scoring team for Week '+league.current_week+'? This releases their entire roster to waivers.'))return;let r=await db.rpc('eliminate_lowest_team',{p_league_id:league.id,p_week:league.current_week});if(r.error)alert(r.error.message);else{alert('Eliminated: '+(teams.find(t=>t.id===r.data.team_id)?.name||'Team')+' with '+r.data.score+' points.');await load();render()}}
async function processWaivers(){let r=await db.rpc('process_waivers',{p_league_id:league.id,p_week:league.current_week});if(r.error)alert(r.error.message);else{alert('Waivers processed. '+r.data+' players awarded.');await load();render()}}
async function advanceWeek(){if(league.current_week>=17)return alert('Week 17 is the final week.');if(teams.filter(t=>t.alive).length<=1)return alert('Only one team remains.');let r=await db.from('leagues').update({current_week:league.current_week+1,status:'active'}).eq('id',league.id);if(r.error)alert(r.error.message);else{await load();render()}}
async function saveTeam(id,name){let r=await db.from('teams').update({name:name.trim()}).eq('id',id).eq('league_id',league.id);if(r.error)alert(r.error.message);else{await load();render()}}async function saveLeagueName(){let name=document.getElementById('lname').value.trim();if(!name)return;let r=await db.from('leagues').update({name}).eq('id',league.id);if(r.error)alert(r.error.message);else{league.name=name;render()}}async function saveWeek(){let w=Math.max(1,Math.min(17,+document.getElementById('wk').value||1));let r=await db.from('leagues').update({current_week:w}).eq('id',league.id);if(r.error)alert(r.error.message);else{await load();render()}}async function copyLink(n){let u=joinUrl(teams.find(x=>x.team_number==n));try{await navigator.clipboard.writeText(u);alert('Join link copied')}catch(e){prompt('Copy this link:',u)}}
async function render(){nav();let p=decodeURIComponent(location.hash.slice(1))||'Dashboard';if(p==='My Team')await loadLineups();let views={Dashboard:dashboard,'My Team':myTeamPage,'Draft Room':draftRoom,Managers:managers,Standings:standings,Waivers:waivers,Rules:rules,Commissioner:commissioner};document.getElementById('app').innerHTML=(views[p]||dashboard)()}
async function start(){try{await auth();await load();try{await loadPlayers()}catch(e){players=[]}await render();db.channel('league-live').on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'roster_players',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'draft_picks',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'weekly_scores',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'waiver_pool',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'eliminations',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).subscribe()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2 class="err">Unable to connect</h2><p>'+esc(e.message||e)+'</p></div>'}}start();</script></body></html>
