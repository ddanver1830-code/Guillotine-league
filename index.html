<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#0b1220;color:#fff}header{padding:16px;background:#020617;position:sticky;top:0;z-index:5}main{max-width:1200px;margin:auto;padding:16px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}button{padding:10px 14px;border:0;border-radius:8px;background:#22c55e;font-weight:bold;cursor:pointer}.alt{background:#263244;color:#fff}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.stat{font-size:30px;font-weight:bold}.muted{color:#94a3b8}.alive{color:#86efac}.out,.err{color:#fca5a5}.ok{color:#86efac}.notice{padding:12px;border-radius:8px;background:#172033;margin-bottom:14px}.linkbox{font-size:12px;word-break:break-all;color:#93c5fd}input,select{width:100%;padding:10px;background:#020617;color:#fff;border:1px solid #334155;border-radius:7px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334155;text-align:left}.scroll{overflow:auto}.player-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #334155}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#263244;font-size:12px;margin-right:5px}.pick{padding:10px;border-left:3px solid #22c55e;background:#0f172a;margin:6px 0}.slot{min-height:54px;padding:10px;border:1px solid #334155;border-radius:8px;margin:6px 0;background:#0f172a}.slot select{width:auto;min-width:220px}.lineup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.lineup-slot{padding:12px;border:1px solid #334155;border-radius:10px;background:#0b1322}.slot-name{font-size:12px;color:#94a3b8;text-transform:uppercase;font-weight:bold;margin-bottom:6px}.starter-name{font-weight:bold;margin-top:5px}.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.bench-player{padding:10px;border:1px solid #334155;border-radius:8px;background:#0f172a}.bid-box{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;min-width:330px}.bid-box label{font-size:12px;color:#94a3b8;display:block;margin-bottom:4px}.waiver-player{padding:14px 0;border-bottom:1px solid #334155}.bid-card{padding:12px;border:1px solid #334155;border-radius:9px;background:#0f172a;margin:7px 0}@media(max-width:650px){.player-row{align-items:flex-start;flex-direction:column}.slot select{width:100%;min-width:0}.lineup-grid{grid-template-columns:1fr}.bid-box{grid-template-columns:1fr;min-width:0;width:100%}}</style></head><body><header><b>🏈 Guillotine League Manager</b><div class="muted">18-team Survivor / Guillotine Fantasy Football • LIVE SHARED LEAGUE</div></header><main><div id="nav" class="nav"></div><div id="app"><div class="card">Loading league…</div></div></main><script>
const SUPABASE_URL='https://unmahnndjtljktvrupkh.supabase.co';const SUPABASE_KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const LEAGUE_KEY='guillotine-live-league-id';let session=null,league=null,teams=[],players=[],roster=[],picks=[],scores=[],waiverPool=[],waiverBids=[],eliminations=[],lineups=[],myTeam=null,playerSearch='',posFilter='ALL';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const code=()=>Math.random().toString(36).slice(2,8).toUpperCase();
async function auth(){let r=await db.auth.getSession();if(r.error)throw r.error;if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}session=r.data.session}
async function load(){const id=localStorage.getItem(LEAGUE_KEY);if(id){let r=await db.from('leagues').select('*').eq('id',id).maybeSingle();if(r.error)throw r.error;if(r.data)league=r.data}if(!league){let r=await db.from('leagues').insert({name:'Guillotine League',code:code(),season:2026,current_week:1,status:'setup',commissioner_user_id:session.user.id}).select().single();if(r.error)throw r.error;league=r.data;localStorage.setItem(LEAGUE_KEY,league.id);let rows=Array.from({length:18},(_,i)=>({league_id:league.id,team_number:i+1,name:'Team '+(i+1),faab:100,alive:true}));r=await db.from('teams').insert(rows);if(r.error)throw r.error}let r=await db.from('teams').select('*').eq('league_id',league.id).order('team_number');if(r.error)throw r.error;teams=r.data||[];myTeam=teams.find(t=>t.owner_user_id===session.user.id)||null;let rr=await db.from('roster_players').select('*').eq('league_id',league.id);if(rr.error)throw rr.error;roster=rr.data||[];let dr=await db.from('draft_picks').select('*').eq('league_id',league.id).order('pick_number');if(dr.error)throw dr.error;picks=dr.data||[];let ws=await db.from('weekly_scores').select('*').eq('league_id',league.id).order('week').order('points',{ascending:false});if(ws.error)throw ws.error;scores=ws.data||[];let wp=await db.from('waiver_pool').select('*').eq('league_id',league.id).order('released_week');if(wp.error)throw wp.error;waiverPool=wp.data||[];let wb=await db.from('waiver_bids').select('*').eq('league_id',league.id).order('week').order('priority');if(wb.error)throw wb.error;waiverBids=wb.data||[];let el=await db.from('eliminations').select('*').eq('league_id',league.id).order('week');if(el.error)throw el.error;eliminations=el.data||[];let li=await db.from('lineups').select('*').eq('league_id',league.id).order('week');if(li.error)throw li.error;lineups=li.data||[]}
async function loadPlayers(){let r=await db.from('players').select('*').order('name');if(r.error)throw r.error;players=r.data||[]}
function nav(){document.getElementById('nav').innerHTML=['Dashboard','My Team','Weekly','Waivers','Draft Room','Managers','Rules','Commissioner'].map(x=>`<button class="alt" onclick="go('${x}')">${x}</button>`).join('')};function go(x){location.hash=x;render()};function joinUrl(t){return location.href.split('#')[0].replace(/index\.html$/,'')+'join.html?code='+encodeURIComponent(league.code)+'&team='+t.team_number}
function dashboard(){let alive=teams.filter(t=>t.alive).length;let n=picks.length+1,r=Math.floor(picks.length/18)+1,turn=r%2?((n-1)%18)+1:18-((n-1)%18);return `<div class="grid"><div class="card"><div class="muted">Teams Alive</div><div class="stat">${alive}</div></div><div class="card"><div class="muted">Current Week</div><div class="stat">${league.current_week}/17</div></div><div class="card"><div class="muted">Starting FAAB</div><div class="stat">$100</div></div><div class="card"><div class="muted">League Code</div><div class="stat">${esc(league.code)}</div></div></div><div class="card"><h2>Draft Status</h2><p>${picks.length} picks made.</p><p><b>${picks.length<234?'Current pick: Team '+turn:'Draft complete'}</b></p><button onclick="go('Draft Room')">Open Draft Room</button></div><div class="card"><h2>Manager Join Links</h2><div class="notice">Send each manager their specific link. It is locked to that team.</div>${teams.map(t=>`<div style="border-top:1px solid #334155;padding:11px 0"><b>${esc(t.name)}</b> — ${t.manager_name?esc(t.manager_name):'<span class="muted">Open</span>'}<br><span class="linkbox">${esc(joinUrl(t))}</span> <button onclick="copyLink('${t.team_number}')">Copy</button></div>`).join('')}</div>`}
function myTeamPage(){if(!myTeam)return `<div class="card"><h2>My Team</h2><p class="muted">This browser is not attached to a manager team. Use your invitation link.</p></div>`;let r=roster.filter(x=>x.team_id===myTeam.id);return `<div class="grid"><div class="card"><div class="muted">My Team</div><div class="stat">${esc(myTeam.name)}</div><p>${esc(myTeam.manager_name||'')}</p></div><div class="card"><div class="muted">FAAB Remaining</div><div class="stat">$${myTeam.faab}</div></div><div class="card"><div class="muted">Status</div><div class="stat ${myTeam.alive?'alive':'out'}">${myTeam.alive?'ALIVE':'OUT'}</div></div></div><div class="card"><h2>Roster</h2>${r.length?`<table><tr><th>Player</th><th>Acquired</th><th>Method</th><th>Slot</th></tr>${r.map(x=>{let p=players.find(z=>z.sleeper_id===x.sleeper_id);return `<tr><td>${esc(p?.name||x.sleeper_id)}<br><span class="muted">${esc(p?.position||'')} ${esc(p?.nfl_team||'')}</span></td><td>Week ${x.acquired_week||'-'}</td><td>${esc(x.acquired_via)}</td><td>${esc(x.roster_slot||'BENCH')}</td></tr>`}).join('')}</table>`:'<p class="muted">No players yet. Your roster will fill during the draft.</p>'}</div>`}
function rosterRequirements(w){return w<=6?['QB','RB','WR1','WR2','TE','FLEX','K','DEF']:w<=12?['QB','RB1','RB2','WR1','WR2','WR3','TE','FLEX','K','DEF']:['QB1','QB2','RB1','RB2','WR1','WR2','WR3','TE','FLEX1','FLEX2','K','DEF']}
function eligible(p,slot){let pos=p?.position;if(slot==='QB'||slot.startsWith('QB'))return pos==='QB';if(slot==='RB'||slot.startsWith('RB'))return pos==='RB';if(slot==='WR'||slot.startsWith('WR'))return pos==='WR';if(slot==='TE')return pos==='TE';if(slot==='K')return pos==='K';if(slot==='DEF')return pos==='DEF'||pos==='DST';if(slot.startsWith('FLEX'))return ['RB','WR','TE'].includes(pos);return false}
function lineupPlayer(id){return players.find(p=>p.sleeper_id===id)}
function lineupStatus(req,saved){return saved.length===req.length?'READY':'INCOMPLETE'}
function weekly(){let w=league.current_week,req=rosterRequirements(w),alive=teams.filter(t=>t.alive),mine=myTeam?roster.filter(x=>x.team_id===myTeam.id):[],minePlayers=mine.map(x=>players.find(p=>p.sleeper_id===x.sleeper_id)).filter(Boolean),saved=lineups.filter(x=>x.team_id===myTeam?.id&&x.week===w),scoreMap={};scores.filter(s=>s.week===w).forEach(s=>scoreMap[s.team_id]=s.points);let rows=alive.slice().sort((a,b)=>(scoreMap[b.id]??-999)-(scoreMap[a.id]??-999));let sel={};saved.forEach(x=>sel[x.slot]=x.sleeper_id);let options=(slot,current)=>`<option value="">— Select —</option>`+minePlayers.filter(p=>eligible(p,slot)).map(p=>`<option value="${esc(p.sleeper_id)}" ${current===p.sleeper_id?'selected':''}>${esc(p.name)} (${esc(p.position)})</option>`).join('');let selectedIds=Object.values(sel).filter(Boolean),status=lineupStatus(req,saved);let starters=req.map(slot=>{let p=lineupPlayer(sel[slot]);return `<div class="lineup-slot"><div class="slot-name">${slot}</div><div class="starter-name">${p?esc(p.name):'<span class="muted">Not selected</span>'}</div>${p?`<span class="pill">${esc(p.position)}</span><span class="pill">${esc(p.nfl_team||'FA')}</span>`:''}</div>`}).join('');let bench=minePlayers.filter(p=>!selectedIds.includes(p.sleeper_id)).map(p=>`<div class="bench-player"><b>${esc(p.name)}</b><br><span class="pill">${esc(p.position)}</span><span class="pill">${esc(p.nfl_team||'FA')}</span></div>`).join('');let rowsHtml=rows.map(t=>{let season=scores.filter(s=>s.team_id===t.id&&s.week<=w).reduce((a,s)=>a+Number(s.points||0),0);return `<tr><td>${esc(t.name)}${t.manager_name?' — '+esc(t.manager_name):''}</td><td>${scoreMap[t.id]===undefined?'—':Number(scoreMap[t.id]).toFixed(2)}</td><td>${season.toFixed(2)}</td><td class="alive">ALIVE</td></tr>`}).join('');return `<div class="grid"><div class="card"><div class="muted">Current Week</div><div class="stat">Week ${w}</div></div><div class="card"><div class="muted">Teams Alive</div><div class="stat">${teams.filter(t=>t.alive).length}</div></div><div class="card"><div class="muted">My FAAB</div><div class="stat">$${myTeam?.faab??'—'}</div></div><div class="card"><div class="muted">Lineup</div><div class="stat ${status==='READY'?'alive':'out'}">${status}</div></div></div><div class="card"><h2>Weekly Standings</h2><div class="scroll"><table><tr><th>Team</th><th>Week ${w}</th><th>Season Points</th><th>Status</th></tr>${rowsHtml}</table></div></div>${myTeam?`<div class="card"><h2>Week ${w} Lineup</h2><div class="notice"><b>${req.length} starters required.</b> FLEX accepts RB, WR or TE. Each player can only be used once. Save your lineup before the NFL games begin.</div><div class="lineup-grid">${req.map(slot=>`<div class="lineup-slot"><div class="slot-name">${slot}</div><select id="slot_${slot}" onchange="lineupChanged()">${options(slot,sel[slot])}</select></div>`).join('')}</div><br><button onclick="saveLineup()">Save Week ${w} Lineup</button><div id="lineupmsg" class="ok"></div><hr><h3>Current Starters</h3><div class="lineup-grid">${starters}</div><h3>Bench / Available</h3><div class="bench">${bench||'<span class="muted">No bench players.</span>'}</div></div>`:'<div class="card"><h2>Lineup</h2><p class="muted">Join a team to set a lineup.</p></div>'}<div class="card"><h2>Eliminations</h2>${eliminations.length?`<table><tr><th>Week</th><th>Team</th><th>Score</th><th>Season Points</th></tr>${eliminations.map(e=>`<tr><td>${e.week}</td><td>${esc(teams.find(t=>t.id===e.team_id)?.name||'Team')}</td><td>${Number(e.score).toFixed(2)}</td><td>${Number(e.tiebreak_points||0).toFixed(2)}</td></tr>`).join('')}</table>`:'<p class="muted">No teams eliminated yet.</p>'}</div><div class="card"><h2>Waiver Pool</h2>${waiverPool.length?`<p>${waiverPool.length} player(s) available from eliminated teams.</p><button onclick="go('Waivers')">Open Waivers</button>`:'<p class="muted">No players currently in the waiver pool.</p>'}</div>`}
function lineupChanged(){let req=rosterRequirements(league.current_week),seen={},dup=false;req.forEach(slot=>{let v=document.getElementById('slot_'+slot)?.value;if(v){if(seen[v])dup=true;seen[v]=slot}});let e=document.getElementById('lineupmsg');if(e)e.textContent=dup?' A player is selected in more than one slot.':''}
function waivers(){let w=league.current_week,avail=waiverPool.map(x=>players.find(p=>p.sleeper_id===x.sleeper_id)).filter(Boolean),mineBids=waiverBids.filter(b=>b.team_id===myTeam?.id&&b.week===w),isComm=league.commissioner_user_id===session.user.id;return `<div class="grid"><div class="card"><div class="muted">Waiver Week</div><div class="stat">Week ${w}</div></div><div class="card"><div class="muted">My FAAB</div><div class="stat">$${myTeam?.faab??'—'}</div></div><div class="card"><div class="muted">Players Available</div><div class="stat">${avail.length}</div></div><div class="card"><div class="muted">Your Bids</div><div class="stat">${mineBids.length}</div></div></div><div class="card"><h2>Blind FAAB Waivers</h2><div class="notice"><b>Blind bidding:</b> Other managers cannot see your bid amounts. Higher bids win. If bids tie, lower priority number wins, then earlier submission time. You can bid $0 through your available FAAB.</div>${!myTeam?'<p class="muted">Join a team to submit bids.</p>':!myTeam.alive?'<p class="out">Your team has been eliminated and cannot submit waiver bids.</p>':avail.length?avail.map(p=>{let existing=mineBids.find(b=>b.sleeper_id===p.sleeper_id);return `<div class="waiver-player"><div class="player-row"><div><b>${esc(p.name)}</b><br><span class="pill">${esc(p.position||'')}</span><span class="pill">${esc(p.nfl_team||'FA')}</span></div><div class="bid-box"><div><label>FAAB Bid</label><input id="bid_${esc(p.sleeper_id)}" type="number" min="0" max="${myTeam.faab}" value="${existing?.bid_amount??''}" placeholder="$0"></div><div><label>Priority</label><input id="pri_${esc(p.sleeper_id)}" type="number" min="1" value="${existing?.priority??(mineBids.length+1)}"></div><button onclick="submitBid('${esc(p.sleeper_id)}')">${existing?'Update Bid':'Submit Bid'}</button></div></div></div>`}).join(''):'<p class="muted">No players are currently in the waiver pool. A team elimination creates the waiver pool.</p>'}</div>${myTeam?`<div class="card"><h2>My Submitted Bids — Week ${w}</h2>${mineBids.length?mineBids.slice().sort((a,b)=>Number(a.priority)-Number(b.priority)).map(b=>{let p=players.find(x=>x.sleeper_id===b.sleeper_id);return `<div class="bid-card"><b>Priority ${b.priority}</b> — ${esc(p?.name||b.sleeper_id)} <span class="pill">${esc(p?.position||'')}</span><br><span class="muted">Bid: $${b.bid_amount} • Submitted ${b.processed_at?'Processed':'Pending'}</span></div>`}).join(''):'<p class="muted">No bids submitted for this week.</p>'}</div>`:''}${isComm?`<div class="card"><h2>Commissioner Waiver Status</h2><p>Pending bids this week: <b>${waiverBids.filter(b=>b.week===w&&!b.processed_at).length}</b></p><p class="muted">Use Commissioner → Process Waivers after the weekly elimination and bidding period closes.</p><button onclick="go('Commissioner')">Open Commissioner Controls</button></div>`:''}`}
function draftRoom(){let filtered=players.filter(p=>{let q=playerSearch.toLowerCase();return(!q||(`${p.name} ${p.nfl_team||''} ${p.position||''}`).toLowerCase().includes(q))&&(posFilter==='ALL'||p.position===posFilter)}).slice(0,100);let next=picks.length+1,round=Math.floor(picks.length/18)+1,teamNo=next<=234?(round%2?((next-1)%18)+1:18-((next-1)%18)):null,selected=teams.find(t=>t.team_number===teamNo);return `<div class="grid"><div class="card"><div class="muted">Pick</div><div class="stat">${next<=234?next:'Complete'}</div></div><div class="card"><div class="muted">Round</div><div class="stat">${next<=234?round:'-'}</div></div><div class="card"><div class="muted">On the Clock</div><div class="stat">${selected?esc(selected.name):'-'}</div></div><div class="card"><div class="muted">Players Loaded</div><div class="stat">${players.length}</div></div></div><div class="card"><h2>Draft Room</h2>${!players.length?'<div class="notice">Commissioner: go to Commissioner → Sync NFL Players first.</div>':`<div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:10px"><input placeholder="Search player, team or position" value="${esc(playerSearch)}" oninput="playerSearch=this.value;renderDraftOnly()"><select onchange="posFilter=this.value;renderDraftOnly()"><option>ALL</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option><option>DEF</option></select></div>${filtered.map(p=>{let taken=picks.some(x=>x.sleeper_id===p.sleeper_id);return `<div class="player-row"><div><b>${esc(p.name)}</b><br><span class="pill">${esc(p.position||'')}</span><span class="pill">${esc(p.nfl_team||'FA')}</span>${p.injury_status?`<span class="pill">${esc(p.injury_status)}</span>`:''}</div>${taken?'<span class="muted">DRAFTED</span>':`<button onclick="draftPlayer('${esc(p.sleeper_id)}')">Draft</button>`}</div>`}).join('')}`}</div><div class="card"><h2>Recent Picks</h2>${picks.length?picks.slice().reverse().slice(0,40).map(x=>`<div class="pick"><b>#${x.pick_number} — ${esc(teams.find(t=>t.id===x.team_id)?.name||'Team')}</b><br>${esc(x.player_name||x.sleeper_id)} <span class="pill">${esc(x.position||'')}</span></div>`).join(''):'<p class="muted">No picks yet.</p>'}</div>`}
function renderDraftOnly(){document.getElementById('app').innerHTML=draftRoom()}
async function draftPlayer(id){let p=players.find(x=>x.sleeper_id===id);let team=teams.find(t=>t.owner_user_id===session.user.id);if(!team&&league.commissioner_user_id===session.user.id){let n=prompt('Commissioner: team number making this pick (1-18):');team=teams.find(t=>t.team_number===Number(n))}if(!team)return alert('This browser is not assigned to a team.');let r=await db.rpc('make_draft_pick',{p_league_id:league.id,p_team_id:team.id,p_sleeper_id:p.sleeper_id,p_player_name:p.name,p_position:p.position||''});if(r.error)alert(r.error.message);else{await load();render()}}
function managers(){return `<div class="card"><h2>Managers & Teams</h2><div class="scroll"><table><tr><th>#</th><th>Team</th><th>Manager</th><th>FAAB</th><th>Status</th><th>Roster</th></tr>${teams.map(t=>`<tr><td>${t.team_number}</td><td><input value="${esc(t.name)}" onchange="saveTeam('${t.id}',this.value)"></td><td>${t.manager_name?esc(t.manager_name):'<span class="muted">Not claimed</span>'}</td><td>$${t.faab}</td><td class="${t.alive?'alive':'out'}">${t.alive?'ALIVE':'OUT'}</td><td>${roster.filter(x=>x.team_id===t.id).length}</td></tr>`).join('')}</table></div></div>`}
function rules(){return `<div class="grid"><div class="card"><h2>League Rules</h2><p>18 teams • 17 weeks</p><p>Lowest weekly score is eliminated.</p><p>Eliminated roster enters blind FAAB waivers.</p><p>$100 starting FAAB.</p><p>No trades • No playoffs.</p><p>Tiebreaker: lower season-long points.</p></div><div class="card"><h2>Roster Settings</h2><p><b>Weeks 1–6:</b> QB 1, RB 1, WR 2, TE 1, FLEX 1, K 1, DST 1, Bench 4, IR 1.</p><p><b>Weeks 7–12:</b> QB 1, RB 2, WR 3, TE 1, FLEX 1, K 1, DST 1, Bench 5, IR 1.</p><p><b>Weeks 13–17:</b> QB 2, RB 2, WR 3, TE 1, FLEX 2, K 1, DST 1, Bench 6, IR 1.</p></div><div class="card"><h2>Scoring Defaults</h2><p>Pass TD 4 • Pass yards 0.04 • INT -2</p><p>Rush yards 0.1 • Rush TD 6</p><p>Reception 0.5 • Receiving yards 0.1 • Receiving TD 6</p><p>Fumble -2</p></div></div>`}
function commissioner(){let isComm=league.commissioner_user_id===session.user.id;return `<div class="card"><h2>Commissioner</h2>${!isComm?'<div class="notice">Commissioner controls are only available to the league commissioner.</div>':''}<p>League: <b>${esc(league.name)}</b></p><label>League name</label><input id="lname" value="${esc(league.name)}"><br><br><button onclick="saveLeagueName()">Save League Name</button><h3>Current Week</h3><input id="wk" type="number" min="1" max="17" value="${league.current_week}"><br><br><button onclick="saveWeek()">Save Week</button><hr><h2>Weekly Guillotine Controls</h2><p class="muted">Run these in order after the NFL week is complete: sync stats → calculate scores → eliminate lowest → process waivers → advance week.</p><button onclick="syncWeeklyStats()">Sync Week ${league.current_week} Stats</button> <button onclick="calculateScores()">Calculate Scores</button> <button onclick="eliminateLowest()">Eliminate Lowest</button> <button onclick="processWaivers()">Process Waivers</button> <button onclick="advanceWeek()">Advance Week</button><div id="commmsg" class="ok"></div><hr><h2>NFL Player Database</h2><p class="muted">Syncs the current NFL player list from Sleeper into the shared database.</p><button id="syncbtn" onclick="syncPlayers()">Sync NFL Players</button> <span id="syncmsg" class="ok"></span><hr><div class="notice">Draft database setup is complete. Weekly lineup, blind FAAB waivers, and Guillotine controls are connected.</div></div>`}
async function saveTeam(id,name){let r=await db.from('teams').update({name:name.trim()}).eq('id',id).eq('league_id',league.id);if(r.error)alert(r.error.message);else{await load();render()}}async function saveLeagueName(){let name=document.getElementById('lname').value.trim();if(!name)return;let r=await db.from('leagues').update({name}).eq('id',league.id);if(r.error)alert(r.error.message);else{league.name=name;render()}}async function saveWeek(){let w=Math.max(1,Math.min(17,+document.getElementById('wk').value||1));let r=await db.from('leagues').update({current_week:w}).eq('id',league.id);if(r.error)alert(r.error.message);else{league.current_week=w;await load();render()}}async function copyLink(n){let u=joinUrl(teams.find(x=>x.team_number==n));try{await navigator.clipboard.writeText(u);alert('Join link copied')}catch(e){prompt('Copy this link:',u)}}
async function syncPlayers(){let b=document.getElementById('syncbtn'),m=document.getElementById('syncmsg');if(b)b.disabled=true;if(m)m.textContent=' Loading…';try{let r=await fetch('https://api.sleeper.app/v1/players/nfl');if(!r.ok)throw Error('Sleeper player sync failed.');let data=await r.json(),rows=Object.values(data).filter(p=>p&&p.player_id).map(p=>({sleeper_id:String(p.player_id),name:p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Unknown',first_name:p.first_name||'',last_name:p.last_name||'',position:p.position||'',nfl_team:p.team||'',status:p.status||'',injury_status:p.injury_status||'',metadata:p,updated_at:new Date().toISOString()}));for(let i=0;i<rows.length;i+=200){let r=await db.from('players').upsert(rows.slice(i,i+200),{onConflict:'sleeper_id'});if(r.error)throw r.error}await loadPlayers();if(m)m.textContent=' Synced '+rows.length+' players.';render()}catch(e){if(m)m.textContent=' '+(e.message||e);alert(e.message||e)}finally{if(b)b.disabled=false}}
async function saveLineup(){if(!myTeam)return;let req=rosterRequirements(league.current_week),slots=req.map(slot=>({slot,sleeper_id:document.getElementById('slot_'+slot)?.value||''}));if(slots.some(x=>!x.sleeper_id))return alert('Please fill every starting lineup slot.');let ids=slots.map(x=>x.sleeper_id);if(new Set(ids).size!==ids.length)return alert('A player can only occupy one lineup slot. Please remove the duplicate.');for(const x of slots){let p=players.find(z=>z.sleeper_id===x.sleeper_id);if(!p||!eligible(p,x.slot))return alert('Invalid player for '+x.slot+'.')}let r=await db.rpc('set_lineup',{p_league_id:league.id,p_team_id:myTeam.id,p_week:league.current_week,p_slots:slots});if(r.error)alert(r.error.message);else{await load();render()}}
async function submitBid(id){if(!myTeam||!myTeam.alive)return;let bid=Number(document.getElementById('bid_'+id).value),priority=Number(document.getElementById('pri_'+id).value);if(!Number.isInteger(bid)||bid<0||bid>Number(myTeam.faab))return alert('Enter a valid FAAB bid from $0 to $'+myTeam.faab+'.');if(!Number.isInteger(priority)||priority<1)return alert('Priority must be 1 or higher.');let w=league.current_week,existing=waiverBids.find(b=>b.team_id===myTeam.id&&b.sleeper_id===id&&b.week===w&&!b.processed_at);let r;if(existing){r=await db.from('waiver_bids').update({bid_amount:bid,priority,submitted_at:new Date().toISOString()}).eq('id',existing.id).eq('team_id',myTeam.id)}else{r=await db.rpc('submit_waiver_bid',{p_league_id:league.id,p_team_id:myTeam.id,p_sleeper_id:id,p_bid_amount:bid,p_priority:priority,p_week:w})}if(r.error)alert(r.error.message);else{await load();render()}}
async function syncWeeklyStats(){await runComm(async()=>{let season=league.season,w=league.current_week,r=await fetch('https://api.sleeper.app/v1/stats/nfl/regular/'+season+'?week='+w);if(!r.ok)throw Error('Sleeper weekly stats sync failed.');let data=await r.json(),rows=Object.entries(data).map(([id,s])=>({sleeper_id:String(id),season,week:w,stats:s,updated_at:new Date().toISOString()}));for(let i=0;i<rows.length;i+=200){let x=await db.from('nfl_stats').upsert(rows.slice(i,i+200),{onConflict:'sleeper_id,season,week'});if(x.error)throw x.error}setMsg('Synced '+rows.length+' player stat lines for Week '+w+'.')})}
async function calculateScores(){await runComm(async()=>{let r=await db.rpc('calculate_week_scores',{p_league_id:league.id,p_week:league.current_week});if(r.error)throw r.error;setMsg('Calculated weekly scores for '+r.data+' teams.')})}
async function eliminateLowest(){if(!confirm('Eliminate the lowest-scoring surviving team for Week '+league.current_week+'?'))return;await runComm(async()=>{let r=await db.rpc('eliminate_lowest_team',{p_league_id:league.id,p_week:league.current_week});if(r.error)throw r.error;setMsg('Eliminated '+(teams.find(t=>t.id===r.data.team_id)?.name||'the lowest-scoring team')+'.')})}
async function processWaivers(){await runComm(async()=>{let r=await db.rpc('process_waivers',{p_league_id:league.id,p_week:league.current_week});if(r.error)throw r.error;setMsg('Processed '+r.data+' winning waiver bids.')})}
async function advanceWeek(){if(league.current_week>=17)return alert('Week 17 is the final week.');let alive=teams.filter(t=>t.alive);if(alive.length<=1)return alert('The league is complete.');let r=await db.from('leagues').update({current_week:league.current_week+1,status:'active'}).eq('id',league.id);if(r.error)alert(r.error.message);else{await load();setMsg('Advanced to Week '+league.current_week+'.');render()}}
async function runComm(fn){if(league.commissioner_user_id!==session.user.id)return alert('Commissioner access required.');try{await fn();await load();render()}catch(e){alert(e.message||e)}}function setMsg(x){let e=document.getElementById('commmsg');if(e)e.textContent=' '+x}
async function render(){nav();let p=decodeURIComponent(location.hash.slice(1))||'Dashboard';if(p==='Managers'){document.getElementById('app').innerHTML=managers();return}if(p==='Waivers'){document.getElementById('app').innerHTML=waivers();return}document.getElementById('app').innerHTML=({Dashboard:dashboard,'My Team':myTeamPage,Weekly:weekly,'Draft Room':draftRoom,Rules:rules,Commissioner:commissioner}[p]||dashboard)()}
async function start(){try{await auth();await load();try{await loadPlayers()}catch(e){players=[]}await render();db.channel('league-live').on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'roster_players',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'draft_picks',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'leagues',filter:'id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'weekly_scores',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'waiver_pool',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'waiver_bids',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'eliminations',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'lineups',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).subscribe()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2 class="err">Unable to connect</h2><p>'+esc(e.message||e)+'</p></div>'}}
window.addEventListener('hashchange',render);start();
</script></body></html>
