<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League Manager</title><style>body{font-family:Arial,sans-serif;margin:0;background:#0b1220;color:#fff}header{padding:16px;background:#020617}main{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}button{padding:10px 14px;border:0;border-radius:8px;background:#22c55e;font-weight:bold;cursor:pointer}.alt{background:#263244;color:#fff}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.stat{font-size:30px;font-weight:bold}.muted{color:#94a3b8}.alive{color:#86efac}.out,.err{color:#fca5a5}.ok{color:#86efac}.notice{padding:12px;border-radius:8px;background:#172033;margin-bottom:14px}.linkbox{font-size:12px;word-break:break-all;color:#93c5fd}input,select{width:100%;padding:10px;background:#020617;color:#fff;border:1px solid #334155;border-radius:7px;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334155;text-align:left}.scroll{overflow:auto}.player-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #334155}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#263244;font-size:12px;margin-right:5px}@media(max-width:650px){.player-row{align-items:flex-start;flex-direction:column}}</style></head><body><header><b>🏈 Guillotine League Manager</b><div class="muted">18-team Survivor / Guillotine Fantasy Football • LIVE SHARED LEAGUE</div></header><main><div id="nav" class="nav"></div><div id="app"><div class="card">Starting…</div></div></main><script>function loadSupabase(){return new Promise((resolve,reject)=>{if(window.supabase)return resolve();let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=()=>resolve();s.onerror=()=>{let f=document.createElement('script');f.src='https://unpkg.com/@supabase/supabase-js@2';f.onload=()=>resolve();f.onerror=()=>reject(new Error('Unable to load the Supabase library. Check your internet connection or GitHub Pages.'));document.head.appendChild(f)};document.head.appendChild(s)})}</script><script>(async()=>{const app=document.getElementById('app');const status=t=>app.innerHTML='<div class="card"><h2>'+t+'</h2></div>';try{status('Connecting…');await Promise.race([loadSupabase(),new Promise((_,r)=>setTimeout(()=>r(new Error('Supabase library timed out after 15 seconds.')),15000))]);const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),KEYID='guillotine-live-league-id';let session,league,teams=[],players=[],roster=[],picks=[],myTeam;const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const wait=async(p,label)=>{let t=setTimeout(()=>{},0);try{return await Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(label+' timed out after 15 seconds.')),15000))])}finally{clearTimeout(t)}};async function auth(){status('Signing in…');let r=await wait(db.auth.getSession(),'Supabase sign-in');if(r.error)throw r.error;if(!r.data.session){r=await wait(db.auth.signInAnonymously(),'Anonymous sign-in');if(r.error)throw r.error}session=r.data.session}async function load(){status('Loading league data…');let id=localStorage.getItem(KEYID);if(id){let r=await wait(db.from('leagues').select('*').eq('id',id).maybeSingle(),'League lookup');if(r.error)throw r.error;if(r.data)league=r.data;else localStorage.removeItem(KEYID)}if(!league){let r=await wait(db.from('leagues').insert({name:'Guillotine League',code:Math.random().toString(36).slice(2,8).toUpperCase(),season:2026,current_week:1,status:'setup',commissioner_user_id:session.user.id}).select().single(),'League creation');if(r.error)throw r.error;league=r.data;localStorage.setItem(KEYID,league.id);r=await wait(db.from('teams').insert(Array.from({length:18},(_,i)=>({league_id:league.id,team_number:i+1,name:'Team '+(i+1),faab:100,alive:true}))),'Team creation');if(r.error)throw r.error}let r=await wait(db.from('teams').select('*').eq('league_id',league.id).order('team_number'),'Teams');if(r.error)throw r.error;teams=r.data||[];myTeam=teams.find(t=>t.owner_user_id===session.user.id)||null;r=await wait(db.from('roster_players').select('*').eq('league_id',league.id),'Roster');if(r.error)throw r.error;roster=r.data||[];r=await wait(db.from('draft_picks').select('*').eq('league_id',league.id).order('pick_number'),'Draft picks');if(r.error)throw r.error;picks=r.data||[]}async function loadPlayers(){let r=await wait(db.from('players').select('*').order('name'),'Players');if(r.error)throw r.error;players=r.data||[]}function go(x){location.hash=x;render()}function nav(){document.getElementById('nav').innerHTML=['Dashboard','My Team','Draft Room','Managers','Rules','Commissioner'].map(x=>`<button class="alt" onclick="go('${x}')">${x}</button>`).join('')}function joinUrl(t){return location.href.split('#')[0].replace(/index\.html$/,'')+'join.html?code='+encodeURIComponent(league.code)+'&team='+t.team_number}function dashboard(){let alive=teams.filter(t=>t.alive).length;return `<div class="grid"><div class="card"><div class="muted">Teams Alive</div><div class="stat">${alive}</div></div><div class="card"><div class="muted">Current Week</div><div class="stat">${league.current_week}/17</div></div><div class="card"><div class="muted">Starting FAAB</div><div class="stat">$100</div></div><div class="card"><div class="muted">League Code</div><div class="stat">${esc(league.code)}</div></div></div><div class="card"><h2>Draft Status</h2><p>${picks.length} picks made.</p><p><b>${picks.length<234?'Current pick: Team '+((((Math.floor(picks.length/18)+1)%2)?(picks.length%18)+1:18-(picks.length%18))):'Draft complete'}</b></p><button onclick="go('Draft Room')">Open Draft Room</button></div><div class="card"><h2>Manager Join Links</h2>${teams.map(t=>`<div style="border-top:1px solid #334155;padding:11px 0"><b>${esc(t.name)}</b> — ${t.manager_name?esc(t.manager_name):'<span class="muted">Open</span>'}<br><span class="linkbox">${esc(joinUrl(t))}</span> <button onclick="copyLink(${t.team_number})">Copy</button></div>`).join('')}</div>`}function myTeamPage(){if(!myTeam)return `<div class="card"><h2>My Team</h2><p class="muted">This browser is not attached to a manager team. Use your invitation link.</p></div>`;let r=roster.filter(x=>x.team_id===myTeam.id);return `<div class="grid"><div class="card"><div class="muted">My Team</div><div class="stat">${esc(myTeam.name)}</div><p>${esc(myTeam.manager_name||'')}</p></div><div class="card"><div class="muted">FAAB</div><div class="stat">$${myTeam.faab}</div></div><div class="card"><div class="muted">Status</div><div class="stat ${myTeam.alive?'alive':'out'}">${myTeam.alive?'ALIVE':'OUT'}</div></div></div><div class="card"><h2>Roster</h2>${r.length?`<table><tr><th>Player</th><th>Method</th><th>Slot</th></tr>${r.map(x=>{let p=players.find(z=>z.sleeper_id===x.sleeper_id);return `<tr><td>${esc(p?.name||x.sleeper_id)}<br><span class="muted">${esc(p?.position||'')} ${esc(p?.nfl_team||'')}</span></td><td>${esc(x.acquired_via)}</td><td>${esc(x.roster_slot||'BENCH')}</td></tr>`}).join('')}</table>`:'<p class="muted">No players yet.</p>'}</div>`}function draftRoom(){let f=players.filter(p=>{let q=(window.ps||'').toLowerCase();return(!q||(`${p.name} ${p.nfl_team||''} ${p.position||''}`).toLowerCase().includes(q))&&(window.pf==='ALL'||p.position===window.pf)}).slice(0,100),next=picks.length+1,round=Math.floor(picks.length/18)+1,teamNo=next<=234?(round%2?((next-1)%18)+1:18-((next-1)%18)):null,team=teams.find(t=>t.team_number===teamNo);return `<div class="grid"><div class="card"><div class="muted">Pick</div><div class="stat">${next<=234?next:'Complete'}</div></div><div class="card"><div class="muted">Round</div><div class="stat">${next<=234?round:'-'}</div></div><div class="card"><div class="muted">On Clock</div><div class="stat">${team?esc(team.name):'-'}</div></div><div class="card"><div class="muted">Players</div><div class="stat">${players.length}</div></div></div><div class="card"><h2>Draft Room</h2>${!players.length?'<div class="notice">Commissioner: Sync NFL Players first.</div>':`<div style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><input placeholder="Search player" value="${esc(window.ps||'')}" oninput="window.ps=this.value;renderDraft()"><select onchange="window.pf=this.value;renderDraft()"><option>ALL</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option><option>DEF</option></select></div>${f.map(p=>{let taken=picks.some(x=>x.sleeper_id===p.sleeper_id);return `<div class="player-row"><div><b>${esc(p.name)}</b><br><span class="pill">${esc(p.position||'')}</span><span class="pill">${esc(p.nfl_team||'FA')}</span></div>${taken?'<span class="muted">DRAFTED</span>':`<button onclick="draft('${esc(p.sleeper_id)}')">Draft</button>`}</div>`}).join('')}`}</div>`}function renderDraft(){document.getElementById('app').innerHTML=draftRoom()}function managers(){return `<div class="card"><h2>Managers & Teams</h2><div class="scroll"><table><tr><th>#</th><th>Team</th><th>Manager</th><th>FAAB</th><th>Status</th></tr>${teams.map(t=>`<tr><td>${t.team_number}</td><td>${esc(t.name)}</td><td>${t.manager_name?esc(t.manager_name):'<span class="muted">Not claimed</span>'}</td><td>$${t.faab}</td><td class="${t.alive?'alive':'out'}">${t.alive?'ALIVE':'OUT'}</td></tr>`).join('')}</table></div></div>`}function rules(){return `<div class="grid"><div class="card"><h2>League Rules</h2><p>18 teams • 17 weeks</p><p>Lowest weekly score is eliminated.</p><p>Eliminated roster enters blind FAAB waivers.</p><p>$100 starting FAAB • No trades • No playoffs.</p><p>Tiebreaker: lower season-long points.</p></div><div class="card"><h2>Roster Settings</h2><p><b>Weeks 1–6:</b> QB 1, RB 1, WR 2, TE 1, FLEX 1, K 1, DST 1, Bench 4, IR 1.</p><p><b>Weeks 7–12:</b> QB 1, RB 2, WR 3, TE 1, FLEX 1, K 1, DST 1, Bench 5, IR 1.</p><p><b>Weeks 13–17:</b> QB 2, RB 2, WR 3, TE 1, FLEX 2, K 1, DST 1, Bench 6, IR 1.</p></div></div>`}function commissioner(){return `<div class="card"><h2>Commissioner</h2><p>League: <b>${esc(league.name)}</b></p><button onclick="syncPlayers()">Sync NFL Players</button><span id="syncmsg" class="ok"></span><hr><p>Current week: <b>${league.current_week}</b></p></div>`}async function draft(id){let p=players.find(x=>x.sleeper_id===id),team=teams.find(t=>t.owner_user_id===session.user.id);if(!team&&league.commissioner_user_id===session.user.id){let n=prompt('Team number (1-18):');team=teams.find(t=>t.team_number===Number(n))}if(!team)return alert('This browser is not assigned to a team.');let r=await wait(db.rpc('make_draft_pick',{p_league_id:league.id,p_team_id:team.id,p_sleeper_id:p.sleeper_id,p_player_name:p.name,p_position:p.position||''}),'Draft pick');if(r.error)alert(r.error.message);else{await load();render()}}async function syncPlayers(){let m=document.getElementById('syncmsg');if(m)m.textContent=' Syncing…';try{let r=await wait(fetch('https://api.sleeper.app/v1/players/nfl'),'Sleeper player feed');if(!r.ok)throw Error('Sleeper HTTP '+r.status);let all=await r.json(),rows=Object.entries(all).map(([id,p])=>({sleeper_id:id,name:p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||id,first_name:p.first_name||null,last_name:p.last_name||null,position:p.position||null,nfl_team:p.team||null,status:p.status||null,injury_status:p.injury_status||null,metadata:{active:p.active??null}})).filter(p=>['QB','RB','WR','TE','K','DEF'].includes(p.position));for(let i=0;i<rows.length;i+=200){let x=await wait(db.from('players').upsert(rows.slice(i,i+200),{onConflict:'sleeper_id'}),'Player save');if(x.error)throw x.error}await loadPlayers();if(m)m.textContent=' ✓ Synced '+players.length+' players.';render()}catch(e){if(m)m.textContent=' ✕ '+e.message}}async function copyLink(n){let t=teams.find(x=>x.team_number===n),u=joinUrl(t);try{await navigator.clipboard.writeText(u);alert('Join link copied')}catch(e){prompt('Copy this link:',u)}}function render(){nav();let p=decodeURIComponent(location.hash.slice(1))||'Dashboard';document.getElementById('app').innerHTML=p==='Managers'?managers():({Dashboard:dashboard,'My Team':myTeamPage,'Draft Room':draftRoom,Rules:rules,Commissioner:commissioner}[p]||dashboard)}await auth();await load();try{await loadPlayers()}catch(e){players=[]}render();window.addEventListener('hashchange',render);db.channel('league-live').on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'roster_players',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'draft_picks',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'leagues',filter:'id=eq.'+league.id},async()=>{await load();render()}).subscribe()}catch(e){app.innerHTML='<div class="card"><h2 class="err">Startup error</h2><p>'+String(e.message||e)+'</p><p class="muted">If this message appears, the app is now reporting the actual connection problem instead of staying on Loading.</p></div>'}})();</script></body></html>
