<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League Manager</title><style>body{font-family:Arial;margin:0;background:#0b1220;color:#fff}header{padding:18px;background:#020617;position:sticky;top:0}main{max-width:1100px;margin:auto;padding:18px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}button{padding:9px 13px;border:0;border-radius:8px;background:#22c55e;font-weight:bold;cursor:pointer}button.alt{background:#263244;color:#fff}button.red{background:#ef4444;color:#fff}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:15px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #334155;text-align:left}input,select{width:100%;padding:9px;box-sizing:border-box;background:#020617;color:white;border:1px solid #334155;border-radius:7px;margin:4px 0 9px}.muted{color:#94a3b8}.badge{padding:4px 8px;border-radius:99px;background:#263244}.alive{color:#86efac}.out{color:#fca5a5}.stat{font-size:30px;font-weight:bold}</style></head><body><header><b>🏈 Guillotine League Manager</b><div class="muted">18-team Survivor / Guillotine Fantasy Football</div></header><main><div class="nav" id="nav"></div><div id="app"></div></main><script>
const KEY='guillotine-v1';let s=JSON.parse(localStorage.getItem(KEY)||'null')||{week:1,code:Math.random().toString(36).slice(2,8).toUpperCase(),teams:Array.from({length:18},(_,i)=>({id:i+1,name:'Team '+(i+1),owner:'',faab:100,alive:true,scores:{},roster:[]})),draft:[],waivers:[],elim:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function team(id){return s.teams.find(t=>t.id==id)}
function nav(){let a=['Dashboard','Managers','Draft','Rosters','Waivers','Scores','Rules','Commissioner'];nav.innerHTML=a.map(x=>`<button class="alt" onclick="go('${x}')">${x}</button>`).join('')}function go(x){location.hash=x;render()}
function dashboard(){let alive=s.teams.filter(t=>t.alive);return `<div class="grid"><div class="card"><div class="muted">Teams Alive</div><div class="stat">${alive.length}</div></div><div class="card"><div class="muted">Week</div><div class="stat">${s.week}/17</div></div><div class="card"><div class="muted">Starting FAAB</div><div class="stat">$100</div></div><div class="card"><div class="muted">Join Code</div><div class="stat">${s.code}</div><button onclick="joinLink()">Copy Join Link</button></div></div><div class="card"><h2>Week ${s.week} Leaderboard</h2><table><tr><th>Team</th><th>Manager</th><th>Points</th><th>Status</th></tr>${s.teams.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.owner)}</td><td>${t.alive?(t.scores[s.week]??'—'):'—'}</td><td><span class="badge ${t.alive?'alive':'out'}">${t.alive?'ALIVE':'OUT'}</span></td></tr>`).join('')}</table></div>`}
function managers(){return `<div class="card"><h2>Managers</h2><p class="muted">League join code: ${s.code}</p><table><tr><th>Team</th><th>Manager</th><th>FAAB</th><th>Status</th></tr>${s.teams.map(t=>`<tr><td><input value="${esc(t.name)}" onchange="team(${t.id}).name=this.value;save()"></td><td><input value="${esc(t.owner)}" placeholder="Manager name" onchange="team(${t.id}).owner=this.value;save()"></td><td>$${t.faab}</td><td>${t.alive?'ALIVE':'OUT'}</td></tr>`).join('')}</table></div>`}
function draft(){return `<div class="grid"><div class="card"><h2>Snake Draft</h2><label>Team</label><select id="dt">${s.teams.filter(t=>t.alive).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><label>Player</label><input id="dp" placeholder="Player name"><label>Position</label><select id="pos"><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option><option>DST</option></select><button onclick="pick()">Record Pick</button></div><div class="card"><h2>Draft Board</h2><table><tr><th>#</th><th>Team</th><th>Player</th><th>Pos</th></tr>${s.draft.slice().reverse().map((p,i)=>`<tr><td>${s.draft.length-i}</td><td>${esc(p.team)}</td><td>${esc(p.player)}</td><td>${p.pos}</td></tr>`).join('')}</table></div></div>`}function pick(){let t=team(+dt.value),p=dp.value.trim();if(!p)return;let x={team:t.name,teamId:t.id,player:p,pos:pos.value};s.draft.push(x);t.roster.push(x);save();render()}
function rosters(){return `<div class="grid">${s.teams.map(t=>`<div class="card"><h3>${esc(t.name)}</h3><div class="muted">${esc(t.owner)} • $${t.faab}</div>${t.roster.map(p=>`<div>${esc(p.player)} <span class="badge">${p.pos}</span></div>`).join('')||'<div class="muted">No players</div>'}</div>`).join('')}</div>`}
function waivers(){return `<div class="card"><h2>Waiver Bids</h2><p class="muted">Eliminated rosters enter the waiver pool. Highest blind FAAB bid wins.</p><label>Team</label><select id="wt">${s.teams.filter(t=>t.alive).map(t=>`<option value="${t.id}">${esc(t.name)} — $${t.faab}</option>`).join('')}</select><label>Player</label><select id="wp">${s.waivers.map((p,i)=>`<option value="${i}">${esc(p.player)} (${p.pos})</option>`).join('')}</select><label>Bid</label><input id="bid" type="number" min="0" value="1"><button onclick="claim()">Submit Bid</button></div><div class="card"><h2>Pending</h2>${s.teams.flatMap(t=>(t.claims||[]).map(c=>`<p>${esc(t.name)} — ${esc(c.player)} — $${c.bid}</p>`)).join('')||'<div class="muted">No bids.</div>'}<button onclick="processWaivers()">Process Waivers</button></div>`}
function claim(){let t=team(+wt.value),p=s.waivers[+wp.value],b=+bid.value;if(!p||b<0||b>t.faab)return;t.claims=t.claims||[];t.claims.push({player:p.player,pos:p.pos,bid:b});save();render()}function processWaivers(){let all=s.teams.filter(t=>t.alive).flatMap(t=>(t.claims||[]).map(c=>({t,c}))).sort((a,b)=>b.c.bid-a.c.bid||a.t.id-b.t.id),won=new Set();for(let x of all){if(won.has(x.c.player)||x.c.bid>x.t.faab)continue;x.t.faab-=x.c.bid;x.t.roster.push({player:x.c.player,pos:x.c.pos});s.waivers=s.waivers.filter(p=>p.player!==x.c.player);won.add(x.c.player)}s.teams.forEach(t=>t.claims=[]);save();render()}
function scores(){return `<div class="card"><h2>Week ${s.week} Scores</h2><table><tr><th>Team</th><th>Manager</th><th>Score</th><th>Season</th></tr>${s.teams.filter(t=>t.alive).map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.owner)}</td><td><input type="number" step=".01" value="${t.scores[s.week]??''}" onchange="team(${t.id}).scores[s.week]=+this.value;save()"></td><td>${Object.values(t.scores).reduce((a,b)=>a+(+b||0),0).toFixed(2)}</td></tr>`).join('')}</table><button class="red" onclick="eliminate()">Eliminate Lowest Team</button></div>`}function eliminate(){let a=s.teams.filter(t=>t.alive);if(a.some(t=>t.scores[s.week]===undefined))return alert('Enter a score for every surviving team.');a.sort((x,y)=>(+x.scores[s.week])-(+y.scores[s.week])||Object.values(x.scores).reduce((a,b)=>a+(+b||0),0)-Object.values(y.scores).reduce((a,b)=>a+(+b||0),0)||x.id-y.id);let t=a[0];t.alive=false;s.waivers.push(...t.roster);s.elim.push({week:s.week,team:t.name});if(s.week<17)s.week++;save();render();alert(t.name+' has been eliminated. Their roster is now on waivers.')}
function rules(){return `<div class="grid"><div class="card"><h2>League Rules</h2><p>18 teams • 17 weeks</p><p>Lowest weekly score is eliminated.</p><p>Tiebreaker: lower season-long points.</p><p>$100 starting FAAB.</p><p>No trades / no playoffs.</p></div><div class="card"><h2>Roster Settings</h2><p>Weeks 1–6: QB 1, RB 1, WR 2, TE 1, FLEX 1, K 1, DST 1, Bench 4, IR 1.</p><p>Weeks 7–12: QB 1, RB 2, WR 3, TE 1, FLEX 1, K 1, DST 1, Bench 5, IR 1.</p><p>Weeks 13–17: QB 2, RB 2, WR 3, TE 1, FLEX 2, K 1, DST 1, Bench 6, IR 1.</p></div></div>`}
function commish(){return `<div class="card"><h2>Commissioner Controls</h2><label>Set Week</label><input id="cw" type="number" min="1" max="17" value="${s.week}"><button onclick="s.week=Math.max(1,Math.min(17,+cw.value));save();render()">Save Week</button><h3>Eliminations</h3>${s.elim.map(e=>`<p>Week ${e.week}: ${esc(e.team)}</p>`).join('')||'<p class="muted">None</p>'}<button class="alt" onclick="exportData()">Export League Backup</button><button class="red" onclick="resetLeague()">Reset</button></div>`}
function joinLink(){let u=location.href.split('#')[0]+'#Join-'+s.code;navigator.clipboard?.writeText(u);alert('Join link copied: '+u)}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='guillotine-league-backup.json';a.click()}function resetLeague(){if(confirm('Reset this league?')){localStorage.removeItem(KEY);location.reload()}}
function render(){nav();let p=location.hash.slice(1)||'Dashboard';if(p.startsWith('Join-')){app.innerHTML=`<div class="card"><h2>Join League</h2><p>League code: ${s.code}</p><input id="jn" placeholder="Your name"><select id="jt">${s.teams.filter(t=>!t.owner).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button onclick="team(+jt.value).owner=jn.value.trim();save();go('Dashboard')">Join</button></div>`;return}app.innerHTML=({Dashboard:dashboard,Managers:managers,Draft:draft,Rosters:rosters,Waivers:waivers,Scores:scores,Rules:rules,Commissioner:commish}[p]||dashboard)()}render();
</script></body></html>
