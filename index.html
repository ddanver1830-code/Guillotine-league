ync function draftPlayer(id){let p=players.find(x=>x.sleeper_id===id),team=teams.find(t=>t.owner_user_id===session.user.id);if(!team&&league.commissioner_user_id===session.user.id){let n=prompt('Team number making this pick (1-18):');team=teams.find(t=>t.team_number===Number(n))}if(!team)return alert('This browser is not assigned to a team.');let r=await db.rpc('make_draft_pick',{p_league_id:league.id,p_team_id:team.id,p_sleeper_id:p.sleeper_id,p_player_name:p.name,p_position:p.position||''});if(r.error)alert(r.error.message);else{await load();render()}}

function workflow(){let w=league.current_week,isComm=league.commissioner_user_id===session.user.id,statRows=players.length&&false?1:0,hasStats=!!scores.some(s=>s.week===w),hasElim=!!eliminations.some(e=>e.week===w),pending=waiverBids.filter(b=>b.week===w&&!b.processed_at).length,processed=hasElim&&pending===0&&waiverPool.filter(x=>x.released_week===w).length>=0;let min=teams.filter(t=>t.alive).map(t=>({t,score:scores.find(s=>s.team_id===t.id&&s.week===w)?.points})).filter(x=>x.score!==undefined).sort((a,b)=>a.score-b.score)[0];let statsSynced=!!scores.some(s=>s.week===w);let lockedCount=teams.filter(t=>t.alive).filter(t=>lineups.some(l=>l.team_id===t.id&&l.week===w&&l.locked)).length;let elimDone=hasElim,waiverDone=elimDone&&pending===0;return `<div class="card"><h2>⚔️ Week ${w} Guillotine Control Center</h2><p class="muted">The league is processed in this order. Each step becomes available only when the previous step is complete.</p>${[['Stats','Sync NFL stats for the current week.',statsSynced],['Scores','Calculate each surviving team’s weekly score.',hasStats],['Elimination',min?`Lowest currently: <b>${esc(min.t.name)}</b> at <b>${Number(min.score).toFixed(2)}</b> points.`:'Calculate scores first.',elimDone],['Waivers','Managers submit blind FAAB bids for the eliminated roster.',waiverDone],['Advance','Move to the next week, or finish the league.',league.current_week> w]].map((x,i)=>`<div class="step ${x[2]?'done':'active'}"><div class="num">${x[2]?'✓':i+1}</div><div><b>${x[0]}</b><br><span class="muted">${x[1]}</span></div></div>`).join('')}<div class="workflow-actions">${isComm?`<button onclick="syncWeeklyStats()" ${hasElim?'disabled':''}>1. Sync Week ${w} Stats</button><button onclick="calculateScores()" ${!statsSynced||hasElim?'disabled':''}>2. Calculate Scores</button><button class="danger" onclick="eliminateLowest()" ${!hasStats||hasElim?'disabled':''}>3. Eliminate Lowest</button><button onclick="processWaivers()" ${!hasElim||pending>0?'disabled':''}>4. Process Waivers</button><button onclick="advanceWeek()" ${!hasElim||pending>0?'disabled':''}>5. ${w===17?'Finish League':'Advance to Week '+(w+1)}</button>`:'<span class="muted">Commissioner controls are only available to the commissioner.</span>'}</div>${min&&!hasElim?`<div class="notice warn" style="margin-top:12px"><b>Elimination preview:</b> ${esc(min.t.name)} is currently last at ${Number(min.score).toFixed(2)} points. Season-long points are used as the tiebreaker.</div>`:''}${hasElim&&w<17?`<div class="notice" style="margin-top:12px">Week ${w} elimination is complete. Managers can now bid on the released roster. Advance is enabled after waiver processing.</div>`:''}${league.status==='complete'?`<div class="notice"><b>🏆 Champion:</b> ${esc(teams.find(t=>t.alive)?.name||'Final surviving team')}</div>`:''}</div><div class="card"><h3>Commissioner Settings</h3><p>League: <b>${esc(league.name)}</b></p><label>League name</label><input id="lname" value="${esc(league.name)}"><br><br><button onclick="saveLeagueName()">Save League Name</button><br><br><label>Current week</label><input id="wk" type="number" min="1" max="17" value="${w}"><br><br><button onclick="saveWeek()">Save Week</button><hr><h3>NFL Player Database</h3><button id="syncbtn" onclick="syncPlayers()">Sync NFL Players</button> <span id="syncmsg" class="ok"></span></div>`}
async function syncWeeklyStats(){await runComm(async()=>{let w=league.current_week,r=await fetch('https://api.sleeper.app/v1/stats/nfl/regular/'+league.season+'?week='+w);if(!r.ok)throw Error('Sleeper weekly stats sync failed.');let data=await r.json(),rows=Object.entries(data).map(([id,s])=>({sleeper_id:String(id),season:league.season,week:w,stats:s,updated_at:new Date().toISOString()}));for(let i=0;i<rows.length;i+=200){let x=await db.from('nfl_stats').upsert(rows.slice(i,i+200),{onConflict:'sleeper_id,season,week'});if(x.error)throw x.error}setMsg('Synced '+rows.length+' player stat lines for Week '+w+'.')})}async function calculateScores(){await runComm(async()=>{let r=await db.rpc('calculate_week_scores',{p_league_id:league.id,p_week:league.current_week});if(r.error)throw r.error;setMsg('Calculated weekly scores for '+r.data+' teams.')})}async function eliminateLowest(){let w=league.current_week,arr=teams.filter(t=>t.alive).map(t=>({t,score:scores.find(s=>s.team_id===t.id&&s.week===w)?.points})).filter(x=>x.score!==undefined).sort((a,b)=>a.score-b.score);if(!arr.length)return alert('Calculate scores first.');let x=arr[0];if(!confirm('Eliminate '+x.t.name+' with '+Number(x.score).toFixed(2)+' points for Week '+w+'? This cannot be undone.'))return;await runComm(async()=>{let r=await db.rpc('eliminate_lowest_team',{p_league_id:league.id,p_week:w});if(r.error)throw r.error;setMsg('Eliminated '+x.t.name+'. Their roster is now in the waiver pool.')})}async function processWaivers(){await runComm(async()=>{let r=await db.rpc('process_waivers',{p_league_id:league.id,p_week:league.current_week});if(r.error)throw r.error;setMsg('Processed '+r.data+' winning waiver bids.')})}async function advanceWeek(){if(league.current_week>=17){let alive=teams.filter(t=>t.alive);if(alive.length!==1)return alert('The final week must leave exactly one surviving team.');let r=await db.from('leagues').update({status:'complete'}).eq('id',league.id);if(r.error)return alert(r.error.message);await load();render();return}if(!eliminations.some(e=>e.week===league.current_week))return alert('Complete the elimination first.');if(waiverBids.some(b=>b.week===league.current_week&&!b.processed_at))return alert('Process all waiver bids first.');let r=await db.from('leagues').update({current_week:league.current_week+1,status:'active'}).eq('id',league.id);if(r.error)alert(r.error.message);else{await load();render()}}async function runComm(fn){if(league.commissioner_user_id!==session.user.id)return alert('Commissioner access required.');try{await fn();await load();render()}catch(e){alert(e.message||e)}}function setMsg(x){let e=document.getElementById('commmsg');if(e)e.textContent=' '+x}async function saveTeam(id,name){let r=await db.from('teams').update({name:name.trim()}).eq('id',id).eq('league_id',league.id);if(r.error)alert(r.error.message);else{await load();render()}}async function saveLeagueName(){let name=document.getElementById('lname').value.trim();if(!name)return;let r=await db.from('leagues').update({name}).eq('id',league.id);if(r.error)alert(r.error.message);else{await load();render()}}async function saveWeek(){let w=Math.max(1,Math.min(17,+document.getElementById('wk').value||1));let r=await db.from('leagues').update({current_week:w}).eq('id',league.id);if(r.error)alert(r.error.message);else{await load();render()}}async function syncPlayers(){let b=document.getElementById('syncbtn'),m=document.getElementById('syncmsg');if(b)b.disabled=true;if(m)m.textContent=' Loading…';try{let r=await fetch('https://api.sleeper.app/v1/players/nfl');if(!r.ok)throw Error('Sleeper player sync failed.');let data=await r.json(),rows=Object.values(data).filter(p=>p&&p.player_id).map(p=>({sleeper_id:String(p.player_id),name:p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Unknown',first_name:p.first_name||'',last_name:p.last_name||'',position:p.position||'',nfl_team:p.team||'',status:p.status||'',injury_status:p.injury_status||'',metadata:p,updated_at:new Date().toISOString()}));for(let i=0;i<rows.length;i+=200){let x=await db.from('players').upsert(rows.slice(i,i+200),{onConflict:'sleeper_id'});if(x.error)throw x.error}await loadPlayers();if(m)m.textContent=' Synced '+rows.length+' players.';render()}catch(e){if(m)m.textContent=' '+e.message;alert(e.message)}finally{if(b)b.disabled=false}}
async function render(){nav();let p=decodeURIComponent(location.hash.slice(1))||'Dashboard';document.getElementById('app').innerHTML=({Dashboard:dashboard,'My Team':myTeamPage,Weekly:weekly,Waivers:waivers,'Draft Room':draftRoom,Managers:managers,Rules:rules,Commissioner:workflow}[p]||dashboard)()}async function start(){try{await auth();await load();try{await loadPlayers()}catch(e){players=[]}await render();db.channel('league-live').on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'roster_players',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'draft_picks',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'leagues',filter:'id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'weekly_scores',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'waiver_pool',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'waiver_bids',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'eliminations',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'lineups',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).subscribe()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2 class="err">Unable to connect</h2><p>'+esc(e.message||e)+'</p></div>'}}window.addEventListener('hashchange',render);start();</script></body></html>
