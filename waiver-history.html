<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — Waiver History</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,Segoe UI,sans-serif;background:#07111f;color:#fff}.wrap{max-width:850px;margin:auto;padding:16px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#94a3b8}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin:12px 0}.stat{font-size:28px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{padding:12px 0;border-bottom:1px solid #334155}.item:last-child{border:0}.row{display:flex;justify-content:space-between;gap:10px}.won{color:#4ade80;font-weight:800}.lost{color:#f87171;font-weight:800}.pending{color:#fbbf24;font-weight:800}.btn{display:inline-block;text-decoration:none;background:#263244;color:#fff;border-radius:9px;padding:10px 13px;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:#07111fee;border-top:1px solid #263244;display:flex;justify-content:center;gap:5px;padding:9px 6px calc(9px + env(safe-area-inset-bottom))}.bottom a{color:#94a3b8;text-decoration:none;font-size:11px;text-align:center;padding:5px 9px}.bottom .active{color:#38bdf8;font-weight:900}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.grid .card:last-child{grid-column:span 2}}

const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',sb=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let uid,league,team,bids=[],roster=[],players=[];const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=x=>'$'+Number(x||0).toFixed(0);
async function load(){if(!(await sb.auth.getSession()).data.session)await sb.auth.signInAnonymously();uid=(await sb.auth.getUser()).data.user.id;let id=localStorage.getItem(LK);if(!id)throw Error('Open the main league app first.');let L=await sb.from('leagues').select('*').eq('id',id).single();if(L.error)throw L.error;league=L.data;let [t,b,r,p]=await Promise.all([sb.from('teams').select('*').eq('league_id',id),sb.from('waiver_bids').select('*').eq('league_id',id).order('week',{ascending:false}).order('priority'),sb.from('roster_players').select('*').eq('league_id',id),sb.from('players').select('*')]);team=(t.data||[]).find(x=>x.owner_user_id===uid);bids=team?(b.data||[]).filter(x=>x.team_id===team.id):[];roster=r.data||[];players=p.data||[];render()}
function pname(id){return players.find(x=>x.sleeper_id===id)?.name||id}function status(b){if(!b.processed_at)return ['PENDING','pending'];let won=roster.some(r=>r.team_id===team?.id&&r.sleeper_id===b.sleeper_id&&r.acquired_via==='waiver'&&r.acquired_week===b.week);return won?['WON','won']:['NOT WON','lost']}
function render(){if(!team){document.getElementById('app').innerHTML='<div class="card"><h2>No team found</h2><p class="muted">Join a league team first.</p></div>';return}let processed=bids.filter(x=>x.processed_at),spent=processed.filter(x=>status(x)[0]==='WON').reduce((a,b)=>a+Number(b.bid_amount||0),0);document.getElementById('app').innerHTML=`<div class="top"><div><b style="font-size:21px">📜 Waiver History</b><div class="muted">${esc(league.name)} · ${esc(team.name)}</div></div><a class="btn" href="waiver-center.html">← Waivers</a></div><div class="grid"><div class="card"><div class="muted">Current FAAB</div><div class="stat">${money(team.faab)}</div></div><div class="card"><div class="muted">FAAB Spent</div><div class="stat">${money(spent)}</div></div><div class="card"><div class="muted">Bids Placed</div><div class="stat">${bids.length}</div></div></div><div class="card"><h2>Bid History</h2>${bids.length?bids.map(b=>{let s=status(b);return `<div class="item"><div class="row"><b>${esc(pname(b.sleeper_id))}</b><span class="${s[1]}">${s[0]}</span></div><div class="row muted"><span>Week ${b.week} · Priority ${b.priority}</span><span>${money(b.bid_amount)}${b.processed_at?' · Processed':''}</span></div></div>`}).join(''):'<p class="muted">No waiver bids yet.</p>'}</div><div class="card"><h2>How the ledger works</h2><p class="muted">Only winning waiver bids reduce your FAAB. Losing bids do not cost anything. Pending bids remain conditional until the commissioner processes waivers.</p></div>`}load().catch(e=>document.getElementById('app').innerHTML='<div class="card">Unable to load history: '+esc(e.message)+'</div>');setInterval(load,30000);
</script></body></html>
