<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine — Commissioner Control</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050b13;--p:#0d1826;--line:#24384d;--text:#f8fafc;--muted:#91a4b8;--blue:#38bdf8;--green:#34d399;--red:#fb7185;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12314b,#050b13 58%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:15px 15px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.brand{font-size:21px;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.week{text-align:right}.week b{font-size:19px}.week small{color:var(--muted)}.hero{padding:21px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#143c59,#0b1725);margin-bottom:12px}.eyebrow{color:#86efac;font-size:11px;font-weight:900;text-transform:uppercase}.hero h1{font-size:29px;margin:5px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{background:#0d1826eF;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}.stat{font-size:27px;font-weight:900}.sectiontitle{font-size:18px;font-weight:900;margin:0 0 10px}.notice{padding:11px;border-radius:10px;background:#15263a;color:#b9cbe0;margin:9px 0}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}button,input{font:inherit}button{border:0;border-radius:9px;padding:11px 14px;font-weight:900;cursor:pointer;background:#2563eb;color:white}button.alt{background:#253449}button.danger{background:#dc2626}button.green{background:#059669;color:white}.actions{display:flex;flex-wrap:wrap;gap:8px}.team{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.team:last-child{border-bottom:0}.num{width:34px;height:34px;border-radius:10px;background:#182b40;display:grid;place-items:center;font-weight:900}.open{color:var(--gold);font-weight:800}.alive{color:var(--green);font-weight:800}.dead{color:var(--red);font-weight:800}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dangerbox{border-color:#6b2028;background:#210f15}.bottom{position:fixed;bottom:0;left:0;right:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:3px;background:#06101cea;border-top:1px solid var(--line);backdrop-filter:blur(10px)}.bottom a{color:var(--muted);text-decoration:none;font-size:11px;text-align:center;padding:6px 10px}.bottom a.active{color:var(--blue);font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.settings{grid-template-columns:1fr}.hero h1{font-size:24px}}@media(max-width:430px){.bottom a{padding:6px 7px}}</style></head><body><main class="wrap"><div id="app"><div class="card">Loading Commissioner Control…</div></div></main><nav class="bottom"><a href="manager-center.html">⌂<br>Home</a><a href="game-center.html">🏈<br>Game Day</a><a href="lineup-center.html">📋<br>Lineup</a><a href="waiver-center.html">💰<br>Waivers</a><a class="active" href="commissioner-control.html">⚙️<br>Control</a></nav><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let league,teams=[],user;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function auth(){let r=await db.auth.getSession();if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}user=(await db.auth.getSession()).data.user}
async function load(){let id=localStorage.getItem(LK);if(!id)throw Error('Open the main league app first.');let a=await db.from('leagues').select('*').eq('id',id).single();if(a.error)throw a.error;league=a.data;if(league.commissioner_user_id!==user.id)throw Error('This account is not the commissioner for this league.');let t=await db.from('teams').select('*').eq('league_id',id).order('team_number');if(t.error)throw t.error;teams=t.data;render()}
function render(){let joined=teams.filter(t=>t.owner_user_id).length,alive=teams.filter(t=>t.alive).length;document.getElementById('app').innerHTML=`<div class="top"><div class="brand">⚙️ Commissioner Control<small>${esc(league.name)}</small></div><div class="week"><b>${league.status==='complete'?'COMPLETE':'WEEK '+league.current_week}</b><small>${joined}/18 managers joined</small></div></div><section class="hero"><div class="eyebrow">League Command Center</div><h1>Control the entire ${esc(league.season||2026)} season.</h1><div class="muted">Manage the league before kickoff, monitor every manager, and launch the weekly engine when you're ready.</div></section><div class="grid"><div class="card"><div class="muted">Managers Joined</div><div class="stat">${joined}/18</div></div><div class="card"><div class="muted">Teams Alive</div><div class="stat">${alive}</div></div><div class="card"><div class="muted">Current Week</div><div class="stat">${league.current_week}/17</div></div><div class="card"><div class="muted">Status</div><div class="stat ${league.status==='active'?'green':''}">${esc(league.status).toUpperCase()}</div></div></div><section class="card"><h2 class="sectiontitle">🚀 Season Controls</h2><div class="notice">Starting the season changes the league from <b>SETUP</b> to <b>ACTIVE</b>. Use this only when all managers are ready.</div><div class="actions">${league.status==='setup'?'<button class="green" onclick="startSeason()">🚀 Start 2026 Season</button>':'<button class="alt" onclick="refresh()">↻ Refresh League</button>'}<button class="alt" onclick="copyJoin()">🔗 Copy League Join Code</button><button class="alt" onclick="location.href='commissioner.html'">📋 Weekly Engine</button><button class="alt" onclick="location.href='draft-settings.html'">⚙️ Draft Settings</button><button class="alt" onclick="location.href='draft-control.html'">📝 Draft Control</button><button class="alt" onclick="location.href='draft-room.html'">🏈 Live Draft Room</button><button class="alt" onclick="location.href='league-history.html'">🏆 League History</button></div></section><section class="card"><h2 class="sectiontitle">👥 Manager / Team Board</h2><div class="muted" style="margin-bottom:8px">Team names and manager assignments are shown here. Team claiming remains protected by the join system.</div>${teams.map(t=>`<div class="team"><div class="num">${t.team_number}</div><div><b>${esc(t.name)}</b><br><span class="muted">${esc(t.manager_name||'Waiting for manager')}</span></div><div>${t.alive?'<span class="alive">ALIVE</span>':'<span class="dead">OUT</span>'}<br><span class="muted">$${Number(t.faab||0)} FAAB</span></div></div>`).join('')}</section><section class="card"><h2 class="sectiontitle">📋 League Settings</h2><div class="settings"><div class="notice"><b>Teams</b><br>18</div><div class="notice"><b>Regular Season</b><br>17 weeks</div><div class="notice"><b>Starting FAAB</b><br>$100</div><div class="notice"><b>Trades</b><br>Disabled</div><div class="notice"><b>Elimination</b><br>Lowest surviving score</div><div class="notice"><b>Tiebreaker</b><br>Lower season-long points</div></div></section><section class="card dangerbox"><h2 class="sectiontitle">⚠️ Reset / Destructive Controls</h2><p class="muted">The current database intentionally does not expose a one-click reset. That protects your league from accidentally deleting rosters, scores, waivers, and eliminations.</p><button class="danger" onclick="alert('No destructive reset is enabled. This is intentional for league safety.')">Reset Season — Locked</button></section>`}
async function startSeason(){if(teams.length!==18)return alert('You need all 18 teams created first.');if(teams.filter(t=>t.owner_user_id).length<18){if(!confirm('Not all 18 managers have joined. Start anyway?'))return}if(!confirm('START THE 2026 SEASON? This will activate the league. Continue?'))return;let r=await db.from('leagues').update({status:'active',current_week:1}).eq('id',league.id);if(r.error)alert(r.error.message);else{alert('2026 season started!');await refresh()}}
async function copyJoin(){let text=league.code||'';try{await navigator.clipboard.writeText(text);alert('League code copied: '+text)}catch(e){prompt('Copy this league code:',text)}}
async function refresh(){try{await load()}catch(e){alert(e.message||e)}}
async function start(){try{await auth();await load();setInterval(refresh,30000)}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Commissioner access unavailable</h2><p class="muted">'+esc(e.message||e)+'</p><a href="index.html">Return to League Manager</a></div>'}}start();</script></body></html>
