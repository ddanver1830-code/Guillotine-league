<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine Manager Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07111f;color:#f7fbff;font:15px system-ui;padding:18px 14px 95px}.wrap{max-width:850px;margin:auto}.brand{text-align:center;padding:15px}.brand .ball{font-size:46px}.card{background:#0e1b2d;border:1px solid #20344d;border-radius:16px;padding:18px;margin:14px 0}.muted{color:#91a4bb}.error{background:#3a1720;border:1px solid #713040;color:#fecdd3;padding:12px;border-radius:10px}.hidden{display:none}input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #35516d;background:#07111f;color:#fff;font-size:18px;text-align:center;text-transform:uppercase}button{border:0;border-radius:10px;padding:12px 16px;font-weight:900;cursor:pointer;background:#38bdf8;color:#04111d}.primary{width:100%;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#12243b;border:1px solid #20344d;border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:22px}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool{display:block;text-decoration:none;color:#fff;background:#12243b;border:1px solid #20344d;border-radius:12px;padding:15px;font-weight:900}.tool small{display:block;color:#91a4bb;font-weight:400;margin-top:4px}.team{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #20344d}.team:first-child{border-top:0}.teaminfo{flex:1}.open{color:#34d399;font-size:11px;font-weight:900}.joined{color:#38bdf8;font-size:11px;font-weight:900}.nav{position:fixed;bottom:0;left:0;right:0;background:#06101d;border-top:1px solid #20344d;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.nav a{color:#91a4bb;text-decoration:none;text-align:center;padding:10px 3px;font-size:11px}.nav .active{color:#fff;background:#132a42}@media(max-width:600px){.grid,.tools{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand"><div class="ball">🏈</div><h1>Manager Portal</h1><div class="muted">18-Team Fantasy Guillotine League</div></div><section id="entry" class="card"><div style="color:#38bdf8;font-size:11px;font-weight:900">MANAGER ACCESS</div><h2>Enter League Code</h2><p class="muted">Enter the code provided by your commissioner.</p><input id="code" maxlength="8" placeholder="HO441Q" autocomplete="off"><button id="enter" class="primary">Enter League</button><div id="err" class="error hidden"></div></section><section id="app" class="hidden"></section></main><nav class="nav"><a class="active" href="manager-portal.html">⌂<br>Portal</a><a href="manager-home.html?v=20260903">🏠<br>Home</a><a href="manager-lineup.html?v=20260903">📋<br>Lineup</a><a href="manager-waivers.html?v=20260903">💰<br>Waivers</a><a href="manager-scores.html?v=20260903">📈<br>Scores</a></nav><script>
const MANAGER_SUPABASE_URL='https://unmahnndjtljktvrupkh.supabase.co';
const MANAGER_SUPABASE_KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM';
const managerDbClient=window.supabase.createClient(MANAGER_SUPABASE_URL,MANAGER_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const STORAGE='guillotine-live-league-id';let league=null,teams=[],user=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function ensureAuth(){let r=await managerDbClient.auth.getSession();if(r.error)throw r.error;if(!r.data?.session){r=await managerDbClient.auth.signInAnonymously();if(r.error)throw r.error}let u=await managerDbClient.auth.getUser();if(u.error)throw u.error;user=u.data.user}
async function openLeague(){let code=document.getElementById('code').value.trim().toUpperCase();let err=document.getElementById('err');err.classList.add('hidden');if(!code){err.textContent='Enter your league code.';err.classList.remove('hidden');return}let btn=document.getElementById('enter');btn.disabled=true;btn.textContent='Opening…';try{await ensureAuth();let r=await managerDbClient.from('leagues').select('*').eq('code',code).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('We could not find a league with that code.');league=r.data;localStorage.setItem(STORAGE,league.id);history.replaceState(null,'',location.pathname+'?code='+encodeURIComponent(code)+'&v=20260903');await loadLeague()}catch(e){err.textContent=e.message||'Unable to open league.';err.classList.remove('hidden')}finally{btn.disabled=false;btn.textContent='Enter League'}}
async function loadLeague(){await ensureAuth();if(!league){let id=localStorage.getItem(STORAGE);if(!id)throw Error('Enter your league code first.');let l=await managerDbClient.from('leagues').select('*').eq('id',id).single();if(l.error)throw l.error;league=l.data}let t=await managerDbClient.from('teams').select('*').eq('league_id',league.id).order('team_number');if(t.error)throw t.error;teams=t.data||[];render()}
function render(){let mine=teams.find(t=>t.owner_user_id===user.id),joined=teams.filter(t=>t.owner_user_id).length,ready=teams.filter(t=>t.ready).length;document.getElementById('entry').classList.add('hidden');let app=document.getElementById('app');app.classList.remove('hidden');let teamRows=teams.map(t=>{let mineHere=t.owner_user_id===user.id;let available=!t.owner_user_id&&t.alive;return '<div class="team"><div class="teaminfo"><b>Team '+t.team_number+(mineHere?' · YOU':'')+'</b><div class="muted">'+esc(t.name||('Team '+t.team_number))+(t.manager_name?' · '+esc(t.manager_name):'')+'</div></div>'+(mineHere?'<span class="joined">YOUR TEAM</span>':t.owner_user_id?'<span class="joined">JOINED</span>':available?'<button onclick="claim('+t.team_number+')">Join</button>':'<span class="muted">UNAVAILABLE</span>')+'</div>'}).join('');app.innerHTML='<section class="card"><h2>'+esc(league.name)+'</h2><p class="muted">Season '+(league.season||2026)+' · Week '+(league.current_week||1)+' of 17 · Code <b style="color:#38bdf8">'+esc(league.code)+'</b></p><div class="grid"><div class="stat"><b>'+joined+'/18</b><span class="muted">Managers</span></div><div class="stat"><b>'+ready+'/18</b><span class="muted">Ready</span></div><div class="stat"><b>'+esc(league.status||'setup').toUpperCase()+'</b><span class="muted">League Status</span></div></div></section>'+(mine?'<section class="card"><div style="color:#38bdf8;font-size:11px;font-weight:900">YOUR TEAM</div><h2>'+esc(mine.name||('Team '+mine.team_number))+'</h2><p class="muted">Manager: '+esc(mine.manager_name||'Manager')+' · '+(mine.alive?'Active':'Eliminated')+' · $'+Number(mine.faab||0).toFixed(0)+' FAAB</p></section>':'<section class="card"><h2>Choose Your Team</h2><p class="muted">Select Join beside an open team. Your team will then be connected to this manager account.</p></section>')+'<section class="card"><div style="color:#38bdf8;font-size:11px;font-weight:900">18-TEAM LOBBY</div><h2>Teams</h2>'+teamRows+'</section>'+(mine?'<section class="card"><div style="color:#38bdf8;font-size:11px;font-weight:900">MANAGER TOOLS</div><h2>My League</h2><div class="tools"><a class="tool" href="manager-home.html?v=20260903">🏠 Manager Home<small>Dashboard, team and FAAB</small></a><a class="tool" href="draft-room.html?v=20260903">🏈 Draft Room<small>Follow and make draft picks</small></a><a class="tool" href="manager-lineup.html?v=20260903">📋 Lineup<small>Set weekly starters</small></a><a class="tool" href="manager-waivers.html?v=20260903">💰 Waivers<small>Submit blind FAAB bids</small></a><a class="tool" href="manager-scores.html?v=20260903">📈 Scores<small>View official weekly scores</small></a><a class="tool" href="manager-game.html?v=20260903">🏈 Game Day<small>Watch the danger zone</small></a></div></section>':'');}
function claim(n){location.href='join.html?code='+encodeURIComponent(league.code)+'&team='+n+'&v=20260903'}
async function init(){try{let q=new URLSearchParams(location.search),code=(q.get('code')||'').trim().toUpperCase();if(code){document.getElementById('code').value=code;await openLeague();return}let id=localStorage.getItem(STORAGE);if(id){await loadLeague()}}catch(e){document.getElementById('entry').classList.remove('hidden');document.getElementById('err').textContent=e.message||'Unable to load manager portal.';document.getElementById('err').classList.remove('hidden')}}
document.getElementById('enter').addEventListener('click',openLeague);document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')openLeague()});init();
</script></body></html>
