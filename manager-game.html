<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager Game Day</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07111f;color:#fff;font:15px system-ui;padding:16px 16px 90px}.wrap{max-width:1000px;margin:auto}.card{background:#0e1b2d;border:1px solid #20344d;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #20344d}.row:first-child{border-top:0}.muted{color:#91a4bb}.danger{color:#fb7185}.nav{position:fixed;bottom:0;left:0;right:0;background:#06101d;border-top:1px solid #20344d;display:grid;grid-template-columns:repeat(5,1fr)}.nav a{color:#91a4bb;text-decoration:none;text-align:center;padding:10px 3px;font-size:11px}.nav .active{color:#fff;background:#132a42}</style></head><body><main class="wrap" id="app"><div class="card">Loading Game Day…</div></main><nav class="nav"><a href="manager-home.html">⌂<br>Home</a><a class="active" href="manager-game.html">🏈<br>Game Day</a><a href="manager-lineup.html">📋<br>Lineup</a><a href="manager-waivers.html">💰<br>Waivers</a><a href="manager-scores.html">📈<br>Scores</a></nav><script>const sb=window.supabase.createClient('https://unmahnndjtljktvrupkh.supabase.co','sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',{auth:{persistSession:true,autoRefreshToken:true}}),LK='guillotine-live-league-id';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const n=x=>Number(x||0);const fp=s=>n(s.pass_td)*4+n(s.pass_yd)*.04-n(s.pass_int)*2+n(s.rush_yd)*.1+n(s.rush_td)*6+n(s.rec)*.5+n(s.rec_yd)*.1+n(s.rec_td)*6-n(s.fum_lost)*2;async function start(){try{let s=(await sb.auth.getSession()).data.session;if(!s){let r=await sb.auth.signInAnonymously();if(r.error)throw r.error}s=(await sb.auth.getSession()).data.session;let id=localStorage.getItem(LK);if(!id)throw Error('Enter your league from the Manager Lobby first.');let l=await sb.from('leagues').select('*').eq('id',id).single();if(l.error)throw l.error;let t=await sb.from('teams').select('*').eq('league_id',id).eq('alive',true).order('team_number');if(t.error)throw t.error;let ro=await sb.from('roster_players').select('*').eq('league_id',id);let li=await sb.from('lineups').select('*').eq('league_id',id).eq('week',l.data.current_week);let state=await fetch('https://api.sleeper.app/v1/state/nfl').then(r=>r.json());let stats={};if(state.season_type==='regular'){let r=await fetch('https://api.sleeper.app/v1/stats/nfl/regular/'+l.data.season+'?week='+state.week);if(r.ok)stats=await r.json()}let totals=t.data.map(team=>{let starters=(li.data||[]).filter(x=>x.team_id===team.id),total=starters.reduce((z,x)=>z+fp(stats[x.sleeper_id]),0);return {team,total}}).sort((a,b)=>a.total-b.total);document.getElementById('app').innerHTML='<div class="card"><h1>🏈 Game Day</h1><p class="muted">League Week '+l.data.current_week+' · NFL Week '+(state.week||'—')+' · Live preview</p></div><div class="card"><h2>🚨 Current Danger Zone</h2>'+totals.slice(0,3).map((x,i)=>'<div class="row '+(i===0?'danger':'')+'"><b>'+(i+1)+'. '+esc(x.team.name)+'</b><span>'+x.total.toFixed(2)+' pts</span></div>').join('')+'</div><div class="card"><h2>Live Standings</h2>'+totals.slice().reverse().map((x,i)=>'<div class="row"><span>'+esc(x.team.name)+'</span><b>'+x.total.toFixed(2)+'</b></div>').join('')+'</div>'}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Game Day</h2><p class="danger">'+esc(e.message)+'</p><a href="manager-lobby.html">Return to Manager Lobby</a></div>'}}start();</script></body></html>
