<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine Waiver Center</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff}header{background:#020617;padding:16px;position:sticky;top:0;z-index:5;border-bottom:1px solid #263244}main{max-width:1200px;margin:auto;padding:16px}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{font-size:30px;font-weight:bold}.muted{color:#94a3b8}.green{color:#4ade80}.yellow{color:#fbbf24}.red{color:#f87171}.btn{border:0;border-radius:8px;padding:10px 14px;background:#22c55e;font-weight:bold;cursor:pointer}.btn.alt{background:#263244;color:#fff}.btn.danger{background:#dc2626;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}input,select{width:100%;padding:10px;background:#020617;color:#fff;border:1px solid #334155;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #334155;text-align:left}.right{text-align:right}.scroll{overflow:auto}.player{display:grid;grid-template-columns:1fr 130px 190px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #334155}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#263244;font-size:11px;margin-left:5px}.bidrow{display:grid;grid-template-columns:1fr 110px 100px;gap:8px;align-items:end}.notice{padding:12px;border-radius:9px;background:#172033;margin:10px 0}.success{background:#0d2a1a}.dangerbox{background:#32151a;border:1px solid #7f1d1d}.count{font-size:16px;font-weight:bold}@media(max-width:700px){.player,.bidrow{grid-template-columns:1fr}.right{text-align:left}.stat{font-size:24px}}</style></head><body><header><b>💰 Guillotine League — WAIVER CENTER</b><div class="muted">Blind FAAB bidding • Highest bid wins • No trades</div></header><main><div id="app"><div class="card">Loading waiver center…</div></div></main><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let session,league,teams=[],players=[],roster=[],pool=[],bids=[],myTeam=null,filter='';
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=x=>'$'+Number(x||0).toFixed(0);const player=s=>players.find(p=>p.sleeper_id===s);
async function auth(){let r=await db.auth.getSession();if(r.error)throw r.error;if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}session=r.data.session}
async function load(){let id=localStorage.getItem(LK);if(!id)throw Error('Open the main league app first.');let r=await db.from('leagues').select('*').eq('id',id).single();if(r.error)throw r.error;league=r.data;r=await db.from('teams').select('*').eq('league_id',id).order('team_number');if(r.error)throw r.error;teams=r.data;myTeam=teams.find(t=>t.owner_user_id===session.user.id)||null;r=await db.from('players').select('*').order('name');if(r.error)throw r.error;players=r.data;r=await db.from('roster_players').select('*').eq('league_id',id);if(r.error)throw r.error;roster=r.data;r=await db.from('waiver_pool').select('*').eq('league_id',id).order('released_week',{ascending:false});if(r.error)throw r.error;pool=r.data;r=await db.from('waiver_bids').select('*').eq('league_id',id).eq('week',league.current_week).order('priority');if(r.error)throw r.error;bids=r.data}
function bidFor(s){return bids.find(b=>b.sleeper_id===s&&b.team_id===myTeam?.id&&!b.processed_at)}
async function submit(s){if(!myTeam||!myTeam.alive)return alert('You need an active team to bid.');let el=document.getElementById('bid_'+CSS.escape(s)),pr=document.getElementById('pri_'+CSS.escape(s));let amount=Math.floor(Number(el?.value||0)),priority=Math.max(1,Math.floor(Number(pr?.value||99)));if(!Number.isFinite(amount)||amount<0||amount>myTeam.faab)return alert('Enter a valid bid between $0 and '+myTeam.faab+'.');let old=bidFor(s);if(old){let r=await db.from('waiver_bids').update({bid_amount:amount,priority}).eq('id',old.id);if(r.error)return alert(r.error.message)}else{let r=await db.rpc('submit_waiver_bid',{p_league_id:league.id,p_team_id:myTeam.id,p_sleeper_id:s,p_bid_amount:amount,p_priority:priority,p_week:league.current_week});if(r.error)return alert(r.error.message)}await load();render();alert('Bid saved. Other managers cannot see your amount.')}
async function removeBid(s){let b=bidFor(s);if(!b)return;let r=await db.from('waiver_bids').delete().eq('id',b.id);if(r.error)return alert(r.error.message);await load();render()}
function countdown(){return 'Blind FAAB — deadline controlled by commissioner'}
function render(){let active=pool.map(x=>({x,p:player(x.sleeper_id)})).filter(z=>z.p).filter(z=>{let q=filter.toLowerCase();return !q||z.p.name.toLowerCase().includes(q)||(z.p.position||'').toLowerCase()===q||(z.p.nfl_team||'').toLowerCase().includes(q)});let mineBids=bids.filter(b=>b.team_id===myTeam?.id&&!b.processed_at).sort((a,b)=>a.priority-b.priority);document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="muted">Week</div><div class="stat">${league.current_week}/17</div></div><div class="card"><div class="muted">Your FAAB</div><div class="stat green">${myTeam?money(myTeam.faab):'—'}</div></div><div class="card"><div class="muted">Players Available</div><div class="stat">${pool.length}</div></div><div class="card"><div class="muted">Your Bids</div><div class="stat">${mineBids.length}</div></div></div><div class="card"><h2>💰 Waiver Room</h2><p class="muted">${countdown()}</p><div class="notice">Bids are <b>blind</b>. The highest valid bid wins. Ties are broken by lower priority number, then earlier submission.</div>${!myTeam?'<div class="notice">Join a team to submit bids.</div>':''}${myTeam&&!myTeam.alive?'<div class="notice dangerbox">Your team has been eliminated. You can view the pool, but cannot bid.</div>':''}<input placeholder="Search player, position, or NFL team…" value="${esc(filter)}" oninput="filter=this.value;render()"></div><div class="card"><h2>Available Players</h2>${active.length?active.map(z=>card(z.x,z.p)).join(''):'<p class="muted">No players match your search, or the waiver pool is currently empty.</p>'}</div><div class="card"><h2>My Current Bids</h2>${mineBids.length?`<div class="scroll"><table><tr><th>Priority</th><th>Player</th><th>Bid</th><th>Action</th></tr>${mineBids.map(b=>`<tr><td>${b.priority}</td><td>${esc(player(b.sleeper_id)?.name||b.sleeper_id)}</td><td>${money(b.bid_amount)}</td><td><button class="btn danger" onclick="removeBid('${esc(b.sleeper_id)}')">Cancel</button></td></tr>`).join('')}</table></div>`:'<p class="muted">No pending bids for Week '+league.current_week+'.</p>'}</div><div class="card"><h2>How FAAB Works</h2><ol><li>Choose a player released into the pool.</li><li>Enter your maximum blind bid and priority.</li><li>Submit or update your bid before the commissioner processes waivers.</li><li>Highest bid wins; the bid amount is deducted from your FAAB.</li><li>Winning players are added to your roster as BENCH.</li></ol></div><a class="btn alt" href="index.html">← Back to League Manager</a>`}
function card(x,p){let b=bidFor(x.sleeper_id);return `<div class="player"><div><b>${esc(p.name)}</b><span class="badge">${esc(p.position||'')}</span><span class="badge">${esc(p.nfl_team||'FA')}</span><br><span class="muted">Released Week ${x.released_week||'—'}</span></div><div>${b?`<span class="green">Your bid: ${money(b.bid_amount)}</span>`:'<span class="muted">No bid submitted</span>'}</div><div class="bidrow"><div><label class="muted">Blind bid</label><input id="bid_${esc(x.sleeper_id)}" type="number" min="0" max="${myTeam?.faab||0}" value="${b?.bid_amount??''}" ${!myTeam||!myTeam.alive?'disabled':''}></div><div><label class="muted">Priority</label><input id="pri_${esc(x.sleeper_id)}" type="number" min="1" value="${b?.priority??''}" ${!myTeam||!myTeam.alive?'disabled':''}></div><button class="btn" onclick="submit('${esc(x.sleeper_id)}')" ${!myTeam||!myTeam.alive?'disabled':''}>${b?'Update':'Bid'}</button></div></div>`}
async function start(){try{await auth();await load();render();db.channel('waiver-room').on('postgres_changes',{event:'*',schema:'public',table:'waiver_pool',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'waiver_bids',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},async()=>{await load();render()}).subscribe()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Unable to load waiver center</h2><p>'+esc(e.message||e)+'</p><a class="btn alt" href="index.html">Return to League Manager</a></div>'}}start();
</script></body></html>
