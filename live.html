<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Scoring • Guillotine League</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07101f;color:#f8fafc}header{position:sticky;top:0;z-index:5;background:#020617;border-bottom:1px solid #263244;padding:15px}main{max-width:1200px;margin:auto;padding:16px}.muted{color:#94a3b8}.green{color:#86efac}.red{color:#fca5a5}.yellow{color:#fde68a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:15px;margin-bottom:14px}.big{font-size:34px;font-weight:800}.score{font-size:28px;font-weight:800}.bar{height:8px;background:#263244;border-radius:10px;overflow:hidden}.fill{height:100%;background:#22c55e}.team{border:1px solid #334155;border-radius:12px;background:#0f172a;padding:14px;margin:10px 0}.danger{border-color:#dc2626;background:#251016}.you{border-color:#2563eb}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:#263244;border-radius:999px;padding:4px 8px;font-size:12px;margin-right:5px}.players{margin-top:10px;border-top:1px solid #263244}.player{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #263244}.statline{font-size:12px;color:#94a3b8;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;background:#22c55e;cursor:pointer}button.alt{background:#263244;color:#fff}a{color:#93c5fd;text-decoration:none}@media(max-width:650px){.row{align-items:flex-start}.player{grid-template-columns:1fr}.score{font-size:24px}}</style></head><body><header><b>🏈 Guillotine League — LIVE SCORING</b><div class="muted">Live game-day estimates • refreshes every 30 seconds</div></header><main><div class="actions"><button onclick="refresh()">↻ Refresh Now</button><a class="alt" href="index.html" style="padding:10px 14px;background:#263244;border-radius:8px">League Home</a></div><div id="status" class="card">Loading live scores…</div><div id="summary"></div><div id="danger"></div><div id="standings"></div></main><script>const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let league,teams=[],players=[],roster=[],lineups=[],stats={};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fp(n){return Number(n||0).toFixed(2)}function points(s){return Number(s?.pass_td||0)*4+Number(s?.pass_yd||s?.pass_yds||0)*.04+Number(s?.pass_int||s?.int||0)*-2+Number(s?.rush_yd||s?.rush_yds||0)*.1+Number(s?.rush_td||0)*6+Number(s?.rec||s?.receptions||0)*.5+Number(s?.rec_yd||s?.rec_yds||0)*.1+Number(s?.rec_td||0)*6+Number(s?.fum_lost||s?.fumbles_lost||0)*-2}function teamScore(t,w){return lineups.filter(l=>l.team_id===t.id&&l.week===w).reduce((sum,l)=>sum+points(stats[l.sleeper_id]),0)}function statText(s,p){if(!s)return 'No live stats yet';let a=[];if(p.position==='QB'){if(s.pass_yd||s.pass_td)a.push(`${s.pass_yd||0} pass yds`,`${s.pass_td||0} TD`);if(s.int||s.pass_int)a.push(`${s.int||s.pass_int||0} INT`)}if(p.position==='RB'){if(s.rush_yd||s.rush_td)a.push(`${s.rush_yd||0} rush yds`,`${s.rush_td||0} TD`);if(s.rec)a.push(`${s.rec} rec`)}if(['WR','TE'].includes(p.position)){if(s.rec_yd||s.rec_td)a.push(`${s.rec||0} rec`,`${s.rec_yd||0} rec yds`,`${s.rec_td||0} TD`)}return a.join(' • ')||'No fantasy stats yet'}async function auth(){let r=await db.auth.getSession();if(!r.data.session)await db.auth.signInAnonymously()}async function refresh(){try{let id=localStorage.getItem(LK);if(!id){status.innerHTML='<b>No league found.</b>';return}let r=await db.from('leagues').select('*').eq('id',id).single();if(r.error)throw r.error;league=r.data;[teams,players,roster,lineups]=await Promise.all([(async()=>{let x=await db.from('teams').select('*').eq('league_id',id);return x.data||[]})(),(async()=>{let x=await db.from('players').select('*');return x.data||[]})(),(async()=>{let x=await db.from('roster_players').select('*').eq('league_id',id);return x.data||[]})(),(async()=>{let x=await db.from('lineups').select('*').eq('league_id',id).eq('week',league.current_week);return x.data||[]})()]);let season=league.season,w=league.current_week;let sr=await fetch(`https://api.sleeper.app/v1/stats/nfl/regular/${season}?week=${w}`);if(!sr.ok)throw Error('Sleeper live stats unavailable');stats=await sr.json();render(w);status.innerHTML=`<b class="green">● LIVE</b> Last updated ${new Date().toLocaleTimeString()} • Week ${w} • ${Object.keys(stats).length} player stat lines loaded`;window.scrollTo({top:0,behavior:'smooth'})}catch(e){status.innerHTML=`<span class="red">Live scoring error:</span> ${esc(e.message)}`}}function render(w){let alive=teams.filter(t=>t.alive),scores=alive.map(t=>({t,score:teamScore(t,w)})).sort((a,b)=>b.score-a.score),max=Math.max(1,...scores.map(x=>x.score));let mine=teams.find(t=>t.owner_user_id===null?false:false);let last=[...scores].sort((a,b)=>a.score-b.score)[0];summary.innerHTML=`<div class="grid"><div class="card"><div class="muted">Teams Alive</div><div class="big">${alive.length}</div></div><div class="card"><div class="muted">Current Week</div><div class="big">${w}/17</div></div><div class="card"><div class="muted">Highest Live Score</div><div class="big">${fp(scores[0]?.score)}</div></div><div class="card"><div class="muted">Current Lowest</div><div class="big red">${fp(last?.score)}</div></div></div>`;danger.innerHTML=last?`<div class="card danger"><h2 style="margin-top:0">☠️ Guillotine Danger Zone</h2><div class="score red">${esc(last.t.name)} — ${fp(last.score)} pts</div><div class="muted">Currently lowest among surviving teams. This is a live estimate, not the final official score.</div></div>`:'';standings.innerHTML=`<div class="card"><h2>📊 Live League Standings</h2>${scores.map((x,i)=>{let r=roster.filter(q=>q.team_id===x.t.id);let starters=lineups.filter(l=>l.team_id===x.t.id);return `<div class="team ${x.t.id===mine?.id?'you':''} ${i===scores.length-1?'danger':''}"><div class="row"><div><b>${i+1}. ${esc(x.t.name)}</b>${x.t.manager_name?`<span class="muted"> — ${esc(x.t.manager_name)}</span>`:''}<br><span class="pill">${i===scores.length-1?'☠️ Danger Zone':'🟢 Alive'}</span></div><div class="score">${fp(x.score)}</div></div><div class="bar" style="margin:9px 0"><div class="fill" style="width:${Math.max(2,x.score/max*100)}%"></div></div><div class="players">${starters.map(l=>{let p=players.find(q=>q.sleeper_id===l.sleeper_id),s=stats[l.sleeper_id];return `<div class="player"><div><b>${esc(p?.name||l.sleeper_id)}</b> <span class="pill">${esc(l.slot)}</span><div class="statline">${esc(p?.position||'')} ${esc(p?.nfl_team||'')} • ${statText(s,p||{})}</div></div><b>${fp(points(s))}</b></div>`}).join('')||'<div class="statline" style="padding:10px 0">No locked starters for this week yet.</div>'}</div></div>`}).join('')}</div>`}auth().then(refresh);setInterval(refresh,30000);</script></body></html>
