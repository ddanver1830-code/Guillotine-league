<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — Draft Control</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050b13;--p:#0d1826;--p2:#112235;--line:#29425a;--text:#f8fafc;--muted:#91a4b9;--blue:#38bdf8;--green:#34d399;--red:#fb7185;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123653,#050b13 62%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1150px;margin:auto;padding:18px 14px 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.brand{font-weight:900;font-size:21px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.back{color:var(--muted);text-decoration:none}.hero{border:1px solid var(--line);border-radius:20px;padding:22px;background:linear-gradient(135deg,#163f5d,#0b1725);margin-bottom:12px}.eyebrow{font-size:11px;font-weight:900;text-transform:uppercase;color:#86efac}.hero h1{font-size:32px;margin:4px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#0d1826ee;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}.card h2{margin:0 0 12px;font-size:17px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:5px;text-transform:uppercase}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#07121e;color:#fff;font:inherit}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:900;cursor:pointer;background:#2563eb;color:#fff}button.alt{background:#253449}button.green{background:#059669}button.red{background:#dc2626}button:disabled{opacity:.45;cursor:not-allowed}.clock{text-align:center;padding:12px 5px}.clock .label{font-size:11px;text-transform:uppercase;font-weight:900;color:var(--muted)}.clock .num{font-size:76px;line-height:1;font-weight:1000;letter-spacing:-4px;margin:5px 0}.clock.warning .num{color:var(--gold)}.clock.danger .num{color:var(--red)}.clock .sub{font-size:13px}.onclock{border:1px solid #0ea5e9;background:#102c40;border-radius:13px;padding:15px;margin-top:10px}.onclock b{font-size:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#0a1420;border:1px solid var(--line);border-radius:11px;padding:10px}.stat b{font-size:21px;display:block}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}.pick{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.pick:last-child{border:0}.picknum{color:var(--blue);font-weight:900}.round{font-size:10px;color:var(--muted)}.notice{padding:11px;border-radius:9px;background:#14253a;color:#b9c9d8}.good{color:var(--green)}.warn{color:var(--gold)}.bad{color:var(--red)}.bottom{margin-top:5px;color:var(--muted);font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.clock .num{font-size:62px}}</style></head><body><main class="wrap"><div id="app"><div class="card">Loading Draft Control…</div></div></main><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let user,league,teams=[],picks=[],state=null,players=[];let timer;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function auth(){let r=await db.auth.getSession();if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}user=(await db.auth.getSession()).data.user}
async function load(){let id=localStorage.getItem(LK);if(!id)throw Error('Open the main league app first.');let a=await db.from('leagues').select('*').eq('id',id).single();if(a.error)throw a.error;league=a.data;if(league.commissioner_user_id!==user.id)throw Error('Commissioner access required.');let [t,d,s,p]=await Promise.all([db.from('teams').select('*').eq('league_id',id).order('team_number'),db.from('draft_picks').select('*').eq('league_id',id).order('pick_number'),db.from('draft_state').select('*').eq('league_id',id).maybeSingle(),db.from('players').select('sleeper_id,name,position,nfl_team').order('name')]);if(t.error)throw t.error;if(d.error)throw d.error;if(s.error)throw s.error;teams=t.data||[];picks=d.data||[];state=s.data||null;players=p.data||[];render()}
function nextTeam(){let n=picks.length+1,r=Math.floor((n-1)/18)+1;return r%2?((n-1)%18)+1:18-((n-1)%18)}
function total(){return (state?.rounds||13)*18}
function remaining(){if(!state)return 90;if(state.status!=='running'||!state.pick_started_at)return Math.max(0,state.remaining_seconds??state.pick_seconds??90);return Math.max(0,(state.remaining_seconds??state.pick_seconds??90)-Math.floor((Date.now()-new Date(state.pick_started_at).getTime())/1000))}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){clearInterval(timer);let n=picks.length+1,r=Math.floor((n-1)/18)+1,tno=nextTeam(),t=teams.find(x=>x.team_number===tno),rem=remaining(),done=picks.length>=total();let sched=state?.scheduled_at?new Date(state.scheduled_at).toLocaleString():'Not scheduled';let status=state?.status||'setup';document.getElementById('app').innerHTML=`<div class="top"><div class="brand">🎛️ Draft Commissioner Console<small>${esc(league.name)} · ${esc(league.season||2026)}</small></div><a class="back" href="commissioner-control.html">← Commissioner Center</a></div><section class="hero"><div class="eyebrow">${status==='running'?'Draft Live':status==='paused'?'Draft Paused':status==='complete'?'Draft Complete':'Draft Setup'}</div><h1>${status==='running'&&t?`Team ${tno} · ${esc(t.name)}`:status==='complete'?'Draft Complete':'Get the Draft Ready'}</h1><div class="muted">${status==='running'&&t?`Round ${r} · Pick ${n} · ${esc(t.manager_name||'Waiting for manager')}`:`${picks.length} of ${total()} picks made · Scheduled: ${esc(sched)}`}</div>${status==='running'?`<div class="onclock"><b>ON THE CLOCK</b><div>${t?esc(t.name):'Draft complete'} · Pick #${n}</div></div>`:''}</section><div class="grid"><div><section class="card"><h2>⏱️ Pick Clock</h2><div class="clock ${rem<=15?'danger':rem<=30?'warning':''}"><div class="label">Time Remaining</div><div class="num" id="clock">${fmt(rem)}</div><div class="sub">${status==='running'?'Clock resets automatically after every pick.':'Clock is stopped.'}</div></div><div class="actions">${status==='setup'?'<button class="green" onclick="startDraft()">▶ Start Draft</button>':status==='running'?'<button class="alt" onclick="pauseDraft()">⏸ Pause Draft</button>':status==='paused'?'<button class="green" onclick="resumeDraft()">▶ Resume Draft</button>':''}${status!=='complete'&&picks.length>=total()?'<button class="green" onclick="completeDraft()">🏆 Complete Draft</button>':''}${status==='running'?'<button class="red" onclick="confirmPause()">⏹ End Draft</button>':''}</div></section><section class="card"><h2>⚙️ Draft Settings</h2><div class="form"><div class="field"><label>Draft Date & Time</label><input id="scheduled" type="datetime-local" value="${state?.scheduled_at?new Date(new Date(state.scheduled_at).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):''}"></div><div class="field"><label>Rounds</label><input id="rounds" type="number" min="1" max="30" value="${state?.rounds||13}"></div><div class="field"><label>Seconds Per Pick</label><input id="seconds" type="number" min="10" max="900" value="${state?.pick_seconds||90}"></div><div class="field"><label>Draft Order</label><select disabled><option>1 → 18 / 18 → 1 (Snake)</option></select></div></div><div class="actions"><button onclick="saveSetup()" ${picks.length?'disabled':''}>💾 Save Draft Setup</button></div><div class="notice" style="margin-top:10px">The timer is <b>configurable</b>; 90 seconds is the default. Draft order is automatically snake and matches the database rules.</div></section></div><div><section class="card"><h2>📊 Draft Status</h2><div class="stats"><div class="stat"><b>${picks.length}</b><span>Picks</span></div><div class="stat"><b>${total()}</b><span>Total</span></div><div class="stat"><b>${r}</b><span>Round</span></div><div class="stat"><b>${teams.filter(x=>x.owner_user_id).length}/18</b><span>Joined</span></div></div><div class="notice" style="margin-top:10px">${status==='setup'?'Ready to configure.':status==='running'?'<span class="good">Live:</span> managers can draft when their team is on the clock.':status==='paused'?'<span class="warn">Paused:</span> resume when ready.':'<span class="good">Complete:</span> all draft picks are locked in.'}</div></section><section class="card"><h2>📜 Recent Picks</h2>${picks.length?picks.slice(-8).reverse().map(p=>{let t=teams.find(x=>x.id===p.team_id);return `<div class="pick"><div class="picknum">#${p.pick_number}<div class="round">R${p.round}</div></div><div><b>${esc(p.player_name)}</b><br><span class="muted">${esc(t?.name||'')} · ${esc(p.position)}</span></div><span class="muted">T${t?.team_number||'?'}</span></div>`}).join(''):'<div class="notice">No picks yet.</div>'}</section><section class="card"><h2>🔗 Draft Room</h2><div class="notice">Send managers to the live Draft Room once the draft is ready.</div><div class="actions"><button class="alt" onclick="location.href='draft-room.html'">Open Draft Room</button></div></section></div></div><div class="bottom">Commissioner controls are protected by Supabase authorization. The database enforces snake order and pick ownership.</div>`;if(status==='running'){timer=setInterval(updateClock,250)}}
function updateClock(){let el=document.getElementById('clock');if(!el||!state)return;let r=remaining();el.textContent=fmt(r);el.parentElement.className='clock '+(r<=15?'danger':r<=30?'warning':'')}
async function call(fn,args){let r=await db.rpc(fn,args);if(r.error)throw r.error;state=r.data;await load()}
async function saveSetup(){let raw=document.getElementById('scheduled').value;let iso=raw?new Date(raw).toISOString():null;let rounds=Number(document.getElementById('rounds').value),seconds=Number(document.getElementById('seconds').value);try{await call('setup_draft',{p_league_id:league.id,p_scheduled_at:iso,p_rounds:rounds,p_pick_seconds:seconds});alert('Draft setup saved.')}catch(e){alert(e.message||e)}}
async function startDraft(){if(!confirm('Start the live draft now?'))return;try{await call('start_draft',{p_league_id:league.id})}catch(e){alert(e.message||e)}}
async function pauseDraft(){if(!confirm('Pause the draft clock?'))return;try{await call('pause_draft',{p_league_id:league.id})}catch(e){alert(e.message||e)}}
async function resumeDraft(){try{await call('resume_draft',{p_league_id:league.id})}catch(e){alert(e.message||e)}}
async function completeDraft(){if(!confirm('Mark the draft complete?'))return;try{await call('complete_draft',{p_league_id:league.id})}catch(e){alert(e.message||e)}}
function confirmPause(){if(confirm('End the live clock and leave the draft paused?'))pauseDraft()}
async function start(){try{await auth();await load();db.channel('draft-control-live').on('postgres_changes',{event:'*',schema:'public',table:'draft_picks',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'draft_state',filter:'league_id=eq.'+league.id},load).subscribe();setInterval(load,30000)}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Draft Control unavailable</h2><p class="muted">'+esc(e.message||e)+'</p><a class="back" href="commissioner-control.html">Return to Commissioner Center</a></div>'}}start();
</script></body></html>
