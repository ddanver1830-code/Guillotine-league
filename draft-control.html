<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — Draft Control</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07111d;color:#f8fafc;font:15px system-ui;padding:18px}.wrap{max-width:900px;margin:auto}.card{background:#0d1b2a;border:1px solid #29425a;border-radius:15px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#091521;padding:12px;border-radius:10px}.stat b{display:block;font-size:22px}.muted{color:#91a4b9}button{border:0;border-radius:9px;padding:11px 14px;font-weight:800;background:#2563eb;color:white;margin:4px;cursor:pointer}.green{background:#059669}.red{background:#dc2626}input{width:100%;box-sizing:border-box;padding:10px;background:#07121e;color:white;border:1px solid #29425a;border-radius:8px}.field{margin:8px 0}.field label{display:block;color:#91a4b9;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:4px}.clock{text-align:center;font-size:64px;font-weight:900}.pick{padding:8px 0;border-bottom:1px solid #29425a}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div id="app"><div class="card">Connecting to Draft Control…</div></div></main><script>
const SUPABASE_URL='https://unmahnndjtljktvrupkh.supabase.co',SUPABASE_KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',LK='guillotine-live-league-id';let db=null,user=null,league=null,teams=[],picks=[],state=null,timer=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function auth(){if(!window.supabase)throw Error('Supabase JavaScript library did not load.');db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let r=await Promise.race([db.auth.getSession(),new Promise((_,j)=>setTimeout(()=>j(Error('Supabase connection timed out.')),12000))]);if(!r.data.session){r=await Promise.race([db.auth.signInAnonymously(),new Promise((_,j)=>setTimeout(()=>j(Error('Anonymous sign-in timed out.')),12000))]);if(r.error)throw r.error}user=(await db.auth.getSession()).data.user}
async function load(){let id=localStorage.getItem(LK);if(!id)throw Error('No league selected. Open the main league app first.');let a=await db.from('leagues').select('*').eq('id',id).single();if(a.error)throw a.error;league=a.data;if(league.commissioner_user_id!==user.id)throw Error('Commissioner access required.');let [t,d,s]=await Promise.all([db.from('teams').select('*').eq('league_id',id).order('team_number'),db.from('draft_picks').select('*').eq('league_id',id).order('pick_number'),db.from('draft_state').select('*').eq('league_id',id).maybeSingle()]);if(t.error)throw t.error;if(d.error)throw d.error;if(s.error)throw s.error;teams=t.data||[];picks=d.data||[];state=s.data||null;render()}
function nextTeam(){let n=picks.length+1,r=Math.floor((n-1)/18)+1;return r%2?((n-1)%18)+1:18-((n-1)%18)}function total(){return (state?.rounds||13)*18}function remaining(){if(!state)return 90;if(state.status!=='running'||!state.pick_started_at)return Math.max(0,state.remaining_seconds??state.pick_seconds??90);return Math.max(0,(state.remaining_seconds??state.pick_seconds??90)-Math.floor((Date.now()-new Date(state.pick_started_at).getTime())/1000))}function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){clearInterval(timer);let n=picks.length+1,r=Math.floor((n-1)/18)+1,tno=nextTeam(),t=teams.find(x=>x.team_number===tno),status=state?.status||'setup';document.getElementById('app').innerHTML=`<div class="card"><a class="muted" href="commissioner-control.html">← Commissioner Center</a><h1>🎛️ Draft Control</h1><div class="muted">${esc(league.name)} · ${esc(league.season||2026)}</div></div><div class="grid"><section class="card"><h2>${status==='running'?'Draft Live':status==='paused'?'Draft Paused':status==='complete'?'Draft Complete':'Draft Setup'}</h2><div class="clock" id="clock">${fmt(remaining())}</div><p class="muted">${status==='running'&&t?'On the clock: Team '+tno+' — '+esc(t.name):picks.length+' of '+total()+' picks made'}</p><div>${status==='setup'?'<button class="green" onclick="act(\'start_draft\',\'Start the live draft now?\')">▶ Start Draft</button>':''}${status==='running'?'<button onclick="act(\'pause_draft\',\'Pause the draft clock?\')">⏸ Pause Draft</button>':''}${status==='paused'?'<button class="green" onclick="act(\'resume_draft\',\'Resume the draft?\')">▶ Resume Draft</button>':''}${status!=='complete'&&picks.length>=total()?'<button class="green" onclick="act(\'complete_draft\',\'Complete the draft?\')">🏆 Complete Draft</button>':''}</div></section><section class="card"><h2>⚙️ Draft Settings</h2><div class="field"><label>Date & Time</label><input id="scheduled" type="datetime-local" value="${state?.scheduled_at?new Date(new Date(state.scheduled_at).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):''}"></div><div class="field"><label>Rounds</label><input id="rounds" type="number" min="1" max="30" value="${state?.rounds||13}" ${picks.length?'disabled':''}></div><div class="field"><label>Seconds Per Pick</label><input id="seconds" type="number" min="10" max="900" value="${state?.pick_seconds||90}" ${picks.length?'disabled':''}></div><button onclick="saveSetup()" ${picks.length?'disabled':''}>💾 Save Setup</button><p class="muted">Snake order: 1 → 18, then 18 → 1.</p></section></div><section class="card"><h2>📊 Status</h2><div class="stats"><div class="stat"><b>${picks.length}</b><span class="muted">Picks</span></div><div class="stat"><b>${total()}</b><span class="muted">Total</span></div><div class="stat"><b>${r}</b><span class="muted">Round</span></div><div class="stat"><b>${teams.filter(x=>x.owner_user_id).length}/18</b><span class="muted">Joined</span></div></div></section><section class="card"><h2>📜 Recent Picks</h2>${picks.length?picks.slice(-10).reverse().map(p=>{let t=teams.find(x=>x.id===p.team_id);return `<div class="pick"><b>#${p.pick_number} — ${esc(p.player_name)}</b><br><span class="muted">${esc(t?.name||'')} · ${esc(p.position)}</span></div>`}).join(''):'<div class="muted">No picks yet.</div>'}</section><section class="card"><button onclick="location.href='draft-room.html'">Open Live Draft Room</button></section>`;if(status==='running')timer=setInterval(()=>{let c=document.getElementById('clock');if(c)c.textContent=fmt(remaining())},250)}
async function call(fn,args){let r=await db.rpc(fn,args);if(r.error)throw r.error;await load()}async function act(fn,msg){if(!confirm(msg))return;try{await call(fn,{p_league_id:league.id})}catch(e){alert(e.message||e)}}async function saveSetup(){try{let raw=document.getElementById('scheduled').value;await call('setup_draft',{p_league_id:league.id,p_scheduled_at:raw?new Date(raw).toISOString():null,p_rounds:Number(document.getElementById('rounds').value),p_pick_seconds:Number(document.getElementById('seconds').value)});alert('Draft setup saved.')}catch(e){alert(e.message||e)}}
async function start(){try{await auth();await load();db.channel('draft-control-live').on('postgres_changes',{event:'*',schema:'public',table:'draft_picks',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'draft_state',filter:'league_id=eq.'+league.id},load).subscribe();setInterval(load,30000)}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Draft Control unavailable</h2><p class="muted">'+esc(e.message||e)+'</p><p><a href="commissioner.html">Commissioner Dashboard</a></p></div>'}}start();
</script></body></html>
