<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — Game Day Center</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#070d18;color:#fff}header{position:sticky;top:0;z-index:10;background:#020617;border-bottom:1px solid #263244;padding:14px 16px}main{max-width:1250px;margin:auto;padding:16px}.muted{color:#94a3b8}.green{color:#4ade80}.yellow{color:#facc15}.red{color:#f87171}.blue{color:#60a5fa}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{font-size:30px;font-weight:800}.small{font-size:12px}.bar{height:8px;background:#1e293b;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#22c55e}.dangerfill{background:#ef4444}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.btn{border:0;border-radius:8px;padding:10px 13px;background:#263244;color:#fff;font-weight:700;text-decoration:none;display:inline-block}.btn.primary{background:#22c55e;color:#052e16}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #334155;text-align:left;white-space:nowrap}.right{text-align:right}.you{outline:2px solid #3b82f6}.danger{background:#2a1518;border-color:#7f1d1d}.team{background:#0c1524;border:1px solid #334155;border-radius:12px;margin:10px 0;overflow:hidden}.teamhead{display:flex;justify-content:space-between;gap:10px;padding:13px;background:#101c2e}.player{display:grid;grid-template-columns:1fr 80px 230px;gap:10px;align-items:center;padding:10px 13px;border-top:1px solid #263244}.starter{border-left:3px solid #22c55e}.bench{opacity:.5}.pts{font-size:19px;font-weight:800;text-align:right}.stats{text-align:right;color:#94a3b8;font-size:12px}.badge{display:inline-block;border-radius:999px;background:#263244;padding:3px 7px;font-size:11px;margin-left:5px}.alert{padding:12px;border-radius:10px;background:#172033;margin:8px 0}.alert.red{background:#35151a}.alert.yellow{background:#34290d}.statusdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;margin-right:6px}.pulse{animation:p 1.4s infinite}@keyframes p{50%{opacity:.35}}@media(max-width:700px){.player{grid-template-columns:1fr 65px}.stats{grid-column:1/-1;text-align:left}.teamhead{align-items:flex-start}.stat{font-size:24px}}
</style></head><body><header><b>🏈 Guillotine League — GAME DAY CENTER</b><div class="muted small"><span class="statusdot pulse"></span>Live NFL scoring • refreshes every 30 seconds</div></header><main><div class="nav"><a class="btn" href="index.html">← League Manager</a><a class="btn primary" href="live-scoring.html">Live Scoring</a></div><div id="app"><div class="card">Loading…</div></div></main><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let league,me,teams=[],players=[],roster=[],lineups=[],live={},state={},last=null,busy=false;const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const n=x=>Number(x||0);function fp(s){return n(s.pass_td)*4+n(s.pass_yd)*.04-n(s.pass_int)*2+n(s.rush_yd)*.1+n(s.rush_td)*6+n(s.rec)*.5+n(s.rec_yd)*.1+n(s.rec_td)*6-n(s.fum_lost)*2}function sl(s){let a=[];if(n(s.pass_yd))a.push('Pass '+n(s.pass_yd));if(n(s.pass_td))a.push('TD '+n(s.pass_td));if(n(s.pass_int))a.push('INT '+n(s.pass_int));if(n(s.rush_yd))a.push('Rush '+n(s.rush_yd));if(n(s.rush_td))a.push('Rush TD '+n(s.rush_td));if(n(s.rec))a.push('Rec '+n(s.rec));if(n(s.rec_yd))a.push('Rec Yds '+n(s.rec_yd));if(n(s.rec_td))a.push('Rec TD '+n(s.rec_td));if(n(s.fum_lost))a.push('FUM '+n(s.fum_lost));return a.join(' • ')||'No recorded stats'}function teamTotal(t){return lineups.filter(l=>l.team_id===t.id&&l.week===league.current_week).reduce((z,l)=>z+fp(live[l.sleeper_id]),0)}function positionRank(arr,id){return arr.findIndex(x=>x.t.id===id)+1}
async function auth(){let r=await db.auth.getSession();if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}}async function load(){let id=localStorage.getItem(LK);if(!id)throw Error('Open the League Manager first.');let r=await db.from('leagues').select('*').eq('id',id).single();if(r.error)throw r.error;league=r.data;r=await db.from('teams').select('*').eq('league_id',id).order('team_number');if(r.error)throw r.error;teams=r.data;me=teams.find(t=>t.owner_user_id);r=await db.from('players').select('*').order('name');players=r.data||[];r=await db.from('roster_players').select('*').eq('league_id',id);roster=r.data||[];r=await db.from('lineups').select('*').eq('league_id',id).eq('week',league.current_week);lineups=r.data||[]}
async function poll(){if(busy)return;busy=true;try{let r=await fetch('https://api.sleeper.app/v1/state/nfl');if(r.ok)state=await r.json();let w=n(state.week)||league.current_week;if(state.season_type==='regular'){r=await fetch('https://api.sleeper.app/v1/stats/nfl/regular/'+league.season+'?week='+w);if(r.ok)live=await r.json()}else live={};last=new Date();render()}catch(e){console.error(e)}finally{busy=false}}function render(){let alive=teams.filter(t=>t.alive),sorted=alive.map(t=>({t,total:teamTotal(t)})).sort((a,b)=>b.total-a.total),low=sorted.at(-1),rank=me?positionRank(sorted,me.id):0,myScore=me?teamTotal(me):0,gap=low&&me&&low.t.id!==me.id?myScore-low.total:null;let season=state.season_type||'unknown';let alerts='';if(me&&me.alive&&rank>=Math.max(1,alive.length-2)&&season==='regular')alerts+=`<div class="alert red">🚨 <b>YOU ARE IN THE GUILLOTINE DANGER ZONE.</b> You are currently ${rank}${rank===1?'st':rank===2?'nd':rank===3?'rd':'th'} of ${alive.length} surviving teams.</div>`;if(me&&me.alive&&gap!==null&&gap<10&&season==='regular')alerts+=`<div class="alert yellow">⚠️ Only <b>${gap.toFixed(2)} points</b> separate your team from the current lowest live score.</div>`;if(!me)alerts+=`<div class="alert">Join a team from your invitation link to get personalized alerts.</div>`;document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="muted">League Week</div><div class="stat">${league.current_week}/17</div></div><div class="card"><div class="muted">NFL Week</div><div class="stat">${state.week||'—'}</div></div><div class="card"><div class="muted">Teams Alive</div><div class="stat">${alive.length}</div></div><div class="card"><div class="muted">NFL Status</div><div class="stat ${season==='regular'?'green':'yellow'}">${esc(season)}</div></div></div>${alerts}<div class="card"><h2>🚨 Guillotine Danger Zone</h2><p class="muted">Live preview only. The official elimination is determined after the scoring period closes.</p>${sorted.slice(-3).reverse().map((x,i)=>`<div class="alert ${i===0?'red':''}"><b>${i===0?'☠️ ':''}${esc(x.t.name)}</b> — ${x.total.toFixed(2)} pts <span class="muted">(${positionRank(sorted,x.t.id)} of ${alive.length})</span></div>`).join('')}</div><div class="card"><h2><span class="statusdot pulse"></span>Live Team Scoreboard</h2><div class="tablewrap"><table><tr><th>Rank</th><th>Team</th><th class="right">Live Score</th><th class="right">Gap to Last</th></tr>${sorted.map((x,i)=>`<tr class="${me&&x.t.id===me.id?'you':''}"><td>${i+1}</td><td><b>${esc(x.t.name)}</b>${me&&x.t.id===me.id?' <span class="badge">YOU</span>':''}<br><span class="muted small">${esc(x.t.manager_name||'')}</span></td><td class="right"><b>${x.total.toFixed(2)}</b></td><td class="right">${low&&x.t.id!==low.t.id?(x.total-low.total).toFixed(2):'—'}</td></tr>`).join('')}</table></div><p class="muted small">Last update: ${last?last.toLocaleTimeString():'—'} • Live scoring uses your league's configured QB/RB/WR/TE/FLEX scoring. K/DST are not invented where scoring is unspecified.</p></div>${me&&me.alive?`<div class="card"><h2>⭐ Your Team</h2><div class="grid"><div><div class="muted">Live Score</div><div class="stat green">${myScore.toFixed(2)}</div></div><div><div class="muted">League Rank</div><div class="stat">${rank}/${alive.length}</div></div><div><div class="muted">FAAB</div><div class="stat">$${me.faab}</div></div></div>${teamCard(me)}</div>`:''}<div class="card"><h2>All Surviving Teams & Players</h2>${sorted.map(x=>teamCard(x.t)).join('')}</div>`}function teamCard(t){let ls=lineups.filter(l=>l.team_id===t.id&&l.week===league.current_week);let starters=new Set(ls.map(l=>l.sleeper_id));let rs=roster.filter(r=>r.team_id===t.id).map(r=>({r,p:players.find(p=>p.sleeper_id===r.sleeper_id)})).filter(x=>x.p).sort((a,b)=>Number(starters.has(b.r.sleeper_id))-Number(starters.has(a.r.sleeper_id)));let total=teamTotal(t);return `<div class="team ${me&&t.id===me.id?'you':''}"><div class="teamhead"><div><b>${esc(t.name)}</b>${me&&t.id===me.id?' <span class="badge">YOU</span>':''}<br><span class="muted small">${esc(t.manager_name||'')} • ${starters.size} starters</span></div><div class="stat">${total.toFixed(2)}</div></div>${rs.map(x=>{let s=live[x.r.sleeper_id]||{},start=starters.has(x.r.sleeper_id),pts=start?fp(s):0,slot=ls.find(l=>l.sleeper_id===x.r.sleeper_id)?.slot;return `<div class="player ${start?'starter':'bench'}"><div><b>${esc(x.p.name)}</b><span class="badge">${esc(x.p.position)}</span><span class="badge">${start?esc(slot):'BENCH'}</span><br><span class="muted small">${esc(x.p.nfl_team||'')}</span></div><div class="pts">${start?pts.toFixed(2):'—'}</div><div class="stats">${sl(s)}</div></div>`}).join('')}</div>`}
async function start(){try{await auth();await load();await poll();setInterval(poll,30000);window.addEventListener('focus',poll);db.channel('game-day').on('postgres_changes',{event:'*',schema:'public',table:'lineups',filter:'league_id=eq.'+league.id},async()=>{let r=await db.from('lineups').select('*').eq('league_id',league.id).eq('week',league.current_week);if(!r.error)lineups=r.data;render()}).on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:'league_id=eq.'+league.id},async()=>{await load();await poll()}).subscribe()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Unable to load</h2><p>'+esc(e.message||e)+'</p></div>'}}start();</script></body></html>
