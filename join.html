<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Guillotine League</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#0b1220;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 32px));background:#111827;border:1px solid #334155;border-radius:16px;padding:24px;box-sizing:border-box}h1{margin-top:0}input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #475569;background:#020617;color:#fff;margin:8px 0 14px}button{padding:12px 16px;border:0;border-radius:8px;background:#22c55e;font-weight:bold;cursor:pointer}.muted{color:#94a3b8}.success{color:#86efac}.error{color:#fca5a5}.team{font-size:24px;font-weight:bold;margin:14px 0}</style></head><body><div class="card"><h1>🏈 Join Your Guillotine Team</h1><div id="status" class="muted">Checking your invitation…</div><div id="form" style="display:none"><div class="team" id="team"></div><label>Your manager name</label><input id="name" placeholder="Enter your name" autocomplete="name"><button onclick="claim()">Claim This Team</button></div></div><script>
const SUPABASE_URL='https://unmahnndjtljktvrupkh.supabase.co';
const SUPABASE_KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const q=new URLSearchParams(location.search);const code=(q.get('code')||'').trim();const teamNumber=Number(q.get('team')||0);
async function init(){try{if(!code||!teamNumber)throw new Error('This invitation link is missing the league code or team number.');const {data:auth,error:ae}=await db.auth.getSession();if(ae)throw ae;if(!auth.session){const {error}=await db.auth.signInAnonymously();if(error)throw error;}const {data:league,error:le}=await db.from('leagues').select('id,name,code').ilike('code',code).maybeSingle();if(le)throw le;if(!league)throw new Error('League code not found.');const {data:t,error:te}=await db.from('teams').select('team_number,name,manager_name,owner_user_id').eq('league_id',league.id).eq('team_number',teamNumber).maybeSingle();if(te)throw te;if(!t)throw new Error('That team could not be found.');if(t.owner_user_id)throw new Error('That team has already been claimed.');document.getElementById('status').textContent='You were invited to join '+league.name+'.';document.getElementById('team').textContent=t.name;document.getElementById('form').style.display='block';}catch(e){document.getElementById('status').className='error';document.getElementById('status').textContent=e.message||'Unable to open this invitation.'}}
async function claim(){const name=document.getElementById('name').value.trim();if(!name)return alert('Please enter your manager name.');const {data,error}=await db.rpc('claim_team',{p_code:code,p_team_number:teamNumber,p_manager_name:name});if(error){document.getElementById('status').className='error';document.getElementById('status').textContent=error.message;return}document.getElementById('form').style.display='none';document.getElementById('status').className='success';document.getElementById('status').innerHTML='Team claimed successfully!<div class="team">'+escapeHtml(data.name)+'</div>Welcome, '+escapeHtml(data.manager_name)+'. You can now return to the league app.'}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init();
</script></body></html>
