<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager Waivers</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07111f;color:#fff;font:15px system-ui;padding:16px 16px 90px}.wrap{max-width:900px;margin:auto}.card{background:#0e1b2d;border:1px solid #20344d;border-radius:16px;padding:16px;margin:12px 0}.player{display:grid;grid-template-columns:1fr 100px 100px 80px;gap:8px;align-items:center;border-top:1px solid #20344d;padding:12px 0}.muted{color:#91a4bb}input,button{padding:10px;border-radius:8px;border:1px solid #35516d;background:#07111f;color:#fff}button{background:#38bdf8;color:#04111d;font-weight:900;cursor:pointer}.nav{position:fixed;bottom:0;left:0;right:0;background:#06101d;border-top:1px solid #20344d;display:grid;grid-template-columns:repeat(5,1fr)}.nav a{color:#91a4bb;text-decoration:none;text-align:center;padding:10px 3px;font-size:11px}.nav .active{color:#fff;background:#132a42}@media(max-width:650px){.player{grid-template-columns:1fr 1fr}.player button{grid-column:1/-1}}</style></head><body><main class="wrap" id="app"><div class="card">Loading Waivers…</div></main><nav class="nav"><a href="manager-home.html">⌂<br>Home</a><a href="manager-game.html">🏈<br>Game Day</a><a href="manager-lineup.html">📋<br>Lineup</a><a class="active" href="manager-waivers.html">💰<br>Waivers</a><a href="manager-scores.html">📈<br>Scores</a></nav><script>const sb=window.supabase.createClient('https://unmahnndjtljktvrupkh.supabase.co','sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',{auth:{persistSession:true,autoRefreshToken:true}}),LK='guillotine-live-league-id';let league,mine=[],pool=[],players=[];const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function start(){try{let s=(await sb.auth.getSession()).data.session;if(!s){let r=await sb.auth.signInAnonymously();if(r.error)throw r.error}s=(await sb.auth.getSession()).data.session;let id=localStorage.getItem(LK);if(!id)throw Error('Enter your league from the Manager Lobby first.');let l=await sb.from('leagues').select('*').eq('id',id).single();if(l.error)throw l.error;league=l.data;let t=await sb.from('teams').select('*').eq('league_id',id);mine=t.data?.find(x=>x.owner_user_id===s.user.id);if(!mine)throw Error('No team is connected to this manager account.');if(!mine.alive)throw Error('Your team has been eliminated and cannot submit waiver bids.');let p=await sb.from('players').select('*');if(p.error)throw p.error;players=p.data||[];let w=await sb.from('waiver_pool').select('*').eq('league_id',id).order('released_week',{ascending:false});if(w.error)throw w.error;pool=w.data||[];render()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Waivers</h2><p class="muted">'+esc(e.message)+'</p><a href="manager-lobby.html">Return to Manager Lobby</a></div>'}}function render(){document.getElementById('app').innerHTML='<div class="card"><h1>💰 Waivers</h1><p class="muted">Week '+league.current_week+' · FAAB remaining: $'+Number(mine.faab||0).toFixed(0)+'</p><p class="muted">Blind bidding. Enter your maximum bid and submit.</p></div><div class="card"><h2>Available Players</h2>'+(pool.length?pool.map(x=>{let p=players.find(y=>y.sleeper_id===x.sleeper_id);if(!p)return '';return '<div class="player"><div><b>'+esc(p.name)+'</b><br><span class="muted">'+esc(p.position||'')+' · '+esc(p.nfl_team||'FA')+' · Released Week '+esc(x.released_week)+'</span></div><input id="b_'+esc(x.sleeper_id)+'" type="number" min="0" max="'+mine.faab+'" placeholder="Bid $"><input id="p_'+esc(x.sleeper_id)+'" type="number" min="1" value="99" placeholder="Priority"><button onclick="bid(\''+esc(x.sleeper_id)+'\')">Bid</button></div>'}).join(''):'<p class="muted">No players are currently in the waiver pool.</p>')+'</div>'}async function bid(id){let amount=Math.floor(Number(document.getElementById('b_'+id).value));let priority=Math.max(1,Math.floor(Number(document.getElementById('p_'+id).value||99)));if(!Number.isFinite(amount)||amount<0||amount>mine.faab)return alert('Enter a valid bid from $0 to $'+mine.faab+'.');let r=await sb.rpc('submit_waiver_bid',{p_league_id:league.id,p_team_id:mine.id,p_sleeper_id:id,p_bid_amount:amount,p_priority:priority,p_week:league.current_week});if(r.error)alert(r.error.message);else alert('Blind bid submitted!')}start();</script></body></html>
