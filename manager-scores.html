<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager Scores</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07111f;color:#fff;font:15px system-ui;padding:16px 16px 90px}.wrap{max-width:900px;margin:auto}.card{background:#0e1b2d;border:1px solid #20344d;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #20344d}.muted{color:#91a4bb}.nav{position:fixed;bottom:0;left:0;right:0;background:#06101d;border-top:1px solid #20344d;display:grid;grid-template-columns:repeat(5,1fr)}.nav a{color:#91a4bb;text-decoration:none;text-align:center;padding:10px 3px;font-size:11px}.nav .active{color:#fff;background:#132a42}</style></head><body><main class="wrap" id="app"><div class="card">Loading Scores…</div></main><nav class="nav"><a href="manager-home.html">⌂<br>Home</a><a href="manager-game.html">🏈<br>Game Day</a><a href="manager-lineup.html">📋<br>Lineup</a><a href="manager-waivers.html">💰<br>Waivers</a><a class="active" href="manager-scores.html">📈<br>Scores</a></nav><script>const sb=window.supabase.createClient('https://unmahnndjtljktvrupkh.supabase.co','sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',{auth:{persistSession:true,autoRefreshToken:true}}),LK='guillotine-live-league-id';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function start(){try{let s=(await sb.auth.getSession()).data.session;if(!s){let r=await sb.auth.signInAnonymously();if(r.error)throw r.error}s=(await sb.auth.getSession()).data.session;let id=localStorage.getItem(LK);if(!id)throw Error('Enter your league from the Manager Lobby first.');let l=await sb.from('leagues').select('*').eq('id',id).single();if(l.error)throw l.error;let t=await sb.from('teams').select('*').eq('league_id',id).eq('alive',true);let w=await sb.from('weekly_scores').select('*').eq('league_id',id).eq('week',l.data.current_week);let rows=t.data.map(x=>({t:x,s:w.data?.find(y=>y.team_id===x.id)?.points??null})).sort((a,b)=>(b.s??-1)-(a.s??-1));document.getElementById('app').innerHTML='<div class="card"><h1>📈 League Scores</h1><p class="muted">Week '+l.data.current_week+' of 17 · Official scores</p></div><div class="card"><h2>Standings</h2>'+rows.map((x,i)=>'<div class="row"><span><b>'+(i+1)+'. '+esc(x.t.name)+'</b><br><small class="muted">'+esc(x.t.manager_name||'')+'</small></span><b>'+(x.s==null?'—':Number(x.s).toFixed(2))+'</b></div>').join('')+'</div>'}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Scores</h2><p class="muted">'+esc(e.message)+'</p><a href="manager-lobby.html">Return to Manager Lobby</a></div>'}}start();</script></body></html>
