<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine Live Scoring</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff}header{background:#020617;padding:16px;position:sticky;top:0;z-index:5;border-bottom:1px solid #263244}main{max-width:1200px;margin:auto;padding:16px}.muted{color:#94a3b8}.live{color:#4ade80}.warn{color:#fbbf24}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{font-size:30px;font-weight:bold}.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;margin-right:7px;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:p 1.5s infinite}@keyframes p{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #334155;text-align:left}.right{text-align:right}.scroll{overflow:auto}.team{margin:10px 0;border:1px solid #334155;border-radius:12px;overflow:hidden;background:#0d1727}.teamhead{padding:14px;display:flex;justify-content:space-between;align-items:center;background:#101c2e}.player{display:grid;grid-template-columns:1fr 70px 110px;gap:10px;padding:10px 14px;border-top:1px solid #263244;align-items:center}.starter{border-left:3px solid #22c55e}.bench{opacity:.65}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#263244;font-size:11px;margin-left:5px}.points{font-size:20px;font-weight:bold;text-align:right}.stats{text-align:right;color:#94a3b8;font-size:12px}.button{display:inline-block;padding:10px 13px;border-radius:8px;background:#263244;color:#fff;text-decoration:none;border:0;cursor:pointer;font-weight:bold}@media(max-width:650px){.player{grid-template-columns:1fr 65px}.stats{grid-column:1/-1;text-align:left}.teamhead{align-items:flex-start;gap:10px}.stat{font-size:24px}}</style></head><body><header><b>🏈 Guillotine League — LIVE SCORING</b><div class="muted">Player and team scores refresh automatically during NFL games.</div></header><main><div id="app"><div class="card">Loading live scores…</div></div></main><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let league,teams=[],players=[],roster=[],lineups=[],liveStats={},nflState={},lastUpdate=null,polling=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function num(v){return Number(v||0)}
function fantasyPoints(s){s=s||{};return num(s.pass_td)*4+num(s.pass_yd)*.04+num(s.pass_int)*-2+num(s.rush_yd)*.1+num(s.rush_td)*6+num(s.rec)*.5+num(s.rec_yd)*.1+num(s.rec_td)*6+num(s.fum_lost)*-2}
function statLine(s,p){let a=[];if(num(s.pass_yd))a.push('P '+num(s.pass_yd));if(num(s.pass_td))a.push('PTD '+num(s.pass_td));if(num(s.pass_int))a.push('INT '+num(s.pass_int));if(num(s.rush_yd))a.push('R '+num(s.rush_yd));if(num(s.rush_td))a.push('RTD '+num(s.rush_td));if(num(s.rec))a.push('REC '+num(s.rec));if(num(s.rec_yd))a.push('RY '+num(s.rec_yd));if(num(s.rec_td))a.push('RTD '+num(s.rec_td));if(num(s.fum_lost))a.push('FUM '+num(s.fum_lost));return a.join(' • ')||'No recorded stats yet'}
async function auth(){let r=await db.auth.getSession();if(r.error)throw r.error;if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}}
async function loadBase(){let id=localStorage.getItem(LK);if(!id)throw Error('Open the main league app first so this browser knows the league.');let r=await db.from('leagues').select('*').eq('id',id).single();if(r.error)throw r.error;league=r.data;r=await db.from('teams').select('*').eq('league_id',id).order('team_number');if(r.error)throw r.error;teams=r.data;r=await db.from('players').select('*').order('name');if(r.error)throw r.error;players=r.data;r=await db.from('roster_players').select('*').eq('league_id',id);if(r.error)throw r.error;roster=r.data;r=await db.from('lineups').select('*').eq('league_id',id).eq('week',league.current_week);if(r.error)throw r.error;lineups=r.data}
async function fetchLive(){if(polling)return;polling=true;try{let state=await fetch('https://api.sleeper.app/v1/state/nfl');if(state.ok)nflState=await state.json();let w=Number(nflState.week||league.current_week);if(nflState.season_type!=='regular'&&league.season===2026){liveStats={};lastUpdate=new Date();render();return}let r=await fetch('https://api.sleeper.app/v1/stats/nfl/regular/'+league.season+'?week='+w);if(!r.ok)throw Error('Sleeper live stats unavailable');liveStats=await r.json();lastUpdate=new Date();render()}catch(e){document.getElementById('error')?.replaceChildren(document.createTextNode(e.message))}finally{polling=false}}
function teamTotal(t,w){let starters=lineups.filter(x=>x.team_id===t.id&&x.week===w),sum=0;for(const l of starters)sum+=fantasyPoints(liveStats[l.sleeper_id]);return sum}
function render(){let w=league.current_week,alive=teams.filter(t=>t.alive),seasonType=nflState.season_type||'unknown',detected=nflState.week||'—';let sorted=alive.map(t=>({t,total:teamTotal(t,w)})).sort((a,b)=>b.total-a.total);let top=sorted[0]?.total||0,low=sorted.length?sorted[sorted.length-1]:null;document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="muted">League Week</div><div class="stat">${w}/17</div></div><div class="card"><div class="muted">NFL Week</div><div class="stat">${detected}</div></div><div class="card"><div class="muted">NFL Status</div><div class="stat ${seasonType==='regular'?'live':'warn'}">${esc(seasonType)}</div></div><div class="card"><div class="muted">Last Update</div><div class="stat" style="font-size:20px">${lastUpdate?lastUpdate.toLocaleTimeString():'—'}</div></div></div><div class="card"><h2><span class="pulse"></span>Live Scores</h2><p class="muted">Sleeper stats are checked every 30 seconds. Scores shown here are live estimates using your league scoring settings; official weekly scores are finalized by the commissioner after the scoring period closes.</p><div id="error" class="warn"></div><a class="button" href="index.html">← League Manager</a></div><div class="card"><h2>Live Standings</h2><div class="scroll"><table><tr><th>Rank</th><th>Team</th><th class="right">Live Points</th><th class="right">Gap</th></tr>${sorted.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.t.name)}${x.t.manager_name?' — '+esc(x.t.manager_name):''}</td><td class="right"><b>${x.total.toFixed(2)}</b></td><td class="right">${i? (x.total-top).toFixed(2):'—'}</td></tr>`).join('')}</table></div>${low?`<p class="muted">Current lowest live score: <b>${esc(low.t.name)}</b> — ${low.total.toFixed(2)} points. This is only a live preview until the week is officially finalized.</p>`:''}</div>${sorted.map(x=>teamCard(x.t,w,x.total)).join('')}</div>`}
function teamCard(t,w,total){let rs=roster.filter(r=>r.team_id===t.id).map(r=>({r,p:players.find(p=>p.sleeper_id===r.sleeper_id)})).filter(x=>x.p),ls=new Set(lineups.filter(l=>l.team_id===t.id&&l.week===w).map(l=>l.sleeper_id));rs.sort((a,b)=>Number(ls.has(b.r.sleeper_id))-Number(ls.has(a.r.sleeper_id)));return `<div class="team"><div class="teamhead"><div><b>${esc(t.name)}</b>${t.manager_name?' <span class="muted">— '+esc(t.manager_name)+'</span>':''}<br><span class="muted">${ls.size} starters</span></div><div class="stat">${total.toFixed(2)}</div></div>${rs.map(x=>{let s=liveStats[x.r.sleeper_id]||{},pts=ls.has(x.r.sleeper_id)?fantasyPoints(s):0,starter=ls.has(x.r.sleeper_id);let slot=lineups.find(l=>l.team_id===t.id&&l.week===w&&l.sleeper_id===x.r.sleeper_id)?.slot;return `<div class="player ${starter?'starter':'bench'}"><div><b>${esc(x.p.name)}</b><span class="badge">${esc(x.p.position)}</span>${starter?`<span class="badge">${esc(slot)}</span>`:'<span class="badge">BENCH</span>'}<br><span class="muted">${esc(x.p.nfl_team||'FA')}</span></div><div class="points">${starter?pts.toFixed(2):'—'}</div><div class="stats">${statLine(s,x.p)}</div></div>`}).join('')}</div>`}
async function start(){try{await auth();await loadBase();await fetchLive();setInterval(fetchLive,30000);window.addEventListener('focus',fetchLive);db.channel('live-score-lineups').on('postgres_changes',{event:'*',schema:'public',table:'lineups',filter:'league_id=eq.'+league.id},async()=>{let r=await db.from('lineups').select('*').eq('league_id',league.id).eq('week',league.current_week);if(!r.error)lineups=r.data;render()}).on('postgres_changes',{event:'*',schema:'public',table:'leagues',filter:'id=eq.'+league.id},async()=>{await loadBase();await fetchLive()}).subscribe()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Unable to load live scoring</h2><p>'+esc(e.message||e)+'</p><a class="button" href="index.html">Return to League Manager</a></div>'}}
start();
</script></body></html>
