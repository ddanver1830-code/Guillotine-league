<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — Game Day</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#06101c;--p:#0d1b2b;--p2:#12263c;--line:#203951;--text:#f8fbff;--muted:#8fa4bb;--blue:#38bdf8;--red:#fb7185;--green:#34d399;--yellow:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#10283f,#050b13 55%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:14px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-size:20px;font-weight:900}.logo small{display:block;font-size:11px;color:var(--muted)}.week{text-align:right}.week b{font-size:17px}.week small{display:block;color:var(--muted)}.hero{border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(135deg,#123552,#0b1726);margin-bottom:12px}.live{display:inline-flex;align-items:center;gap:6px;color:#86efac;font-weight:800;font-size:11px;text-transform:uppercase}.dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green)}h1{margin:5px 0;font-size:28px}.sub{color:var(--muted)}.heroStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.hs{background:#071523aa;border:1px solid #28445f;border-radius:12px;padding:11px}.hs b{font-size:20px}.hs span{display:block;color:var(--muted);font-size:11px}.section{margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.head h2{font-size:17px;margin:0}.head small{color:var(--muted)}.board{display:grid;gap:8px}.team{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:13px;position:relative;overflow:hidden}.team.danger{border-color:#713344;background:linear-gradient(90deg,#25141d,#0d1927)}.team.me{border-color:#2 const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',sb=supabase.createClient(URL,KEY);let uid,league,teams=[],roster=[],lineups=[],scores=[];const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{if(!(await sb.auth.getSession()).data.session)await sb.auth.signInAnonymously();uid=(await sb.auth.getUser()).data.user.id;let lid=localStorage.getItem('guillotine-live-league-id');if(!lid){location.href='index.html';return}let L=await sb.from('leagues').select('*').eq('id',lid).single();if(L.error)throw L.error;league=L.data;let [t,r,s,l]=await Promise.all([sb.from('teams').select('*').eq('league_id',lid).order('team_number'),sb.from('roster_players').select('*,players(*)').eq('league_id',lid),sb.from('weekly_scores').select('*').eq('league_id',lid),sb.from('lineups').select('*').eq('league_id',lid).eq('week',league.current_week)]);teams=t.data||[];roster=r.data||[];scores=s.data||[];lineups=l.data||[];render();setTimeout(load,30000)}catch(e){document.getElementById('app').innerHTML='<div class="note">Unable to load Game Day: '+esc(e.message)+'</div>'}}

s==null?'Waiting for score':(x.s-(low?.s??x.s)>=0?'+':'')+(x.s-(low?.s??x.s)).toFixed(2)+' vs line'}</small></div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></article>`}).join('')}</div></section><section class="section"><div class="head"><h2>🏈 My Starters</h2><small>${myPlayers.length} slots set</small></div>${myPlayers.length?'<div class="players">'+myPlayers.map(x=>`<div class="player"><div><b>${esc(x.p?.name||'Unknown player')}</b><small>${esc(x.slot)} · ${esc(x.p?.position||'')}</small></div><div class="points">—</div></div>`).join('')+'</div>':'<div class="note">No locked lineup is showing for this week. Set your lineup from the Lineup page before the weekly deadline.</div>'}</section><section class="section"><div class="note">Official weekly scores and the elimination are controlled by the commissioner workflow. This screen is the live manager view; it does not change official results.</div></section>`}load();
