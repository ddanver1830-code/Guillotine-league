<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — Live Game Day</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#06101c;--p:#0d1b2b;--p2:#12263c;--line:#203951;--text:#f8fbff;--muted:#8fa4bb;--blue:#38bdf8;--red:#fb7185;--green:#34d399;--yellow:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#10283f,#050b13 55%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:14px 14px 95px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-size:20px;font-weight:900}.logo small{display:block;font-size:11px;color:var(--muted)}.week{text-align:right}.week b{font-size:17px}.week small{display:block;color:var(--muted)}.hero{border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(135deg,#123552,#0b1726);margin-bottom:12px}.live{display:inline-flex;align-items:center;gap:6px;color:#86efac;font-weight:800;font-size:11px;text-transform:uppercase}.dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green);animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.35}}h1{margin:5px 0;font-size:28px}.sub{color:var(--muted)}.heroStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.hs{background:#071523aa;border:1px solid #28445f;border-radius:12px;padding:11px}.hs b{font-size:20px}.hs span{display:block;color:var(--muted);font-size:11px}.refresh{margin-top:12px;background:#16334d;border:1px solid #315574;color:#fff;border-radius:10px;padding:8px 12px;font-weight:800}.section{margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.head h2{font-size:17px;margin:0}.head small{color:var(--muted)}.board{display:grid;gap:8px}.team{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:13px;position:relative;overflow:hidden}.team.danger{border-color:#713344;background:linear-gradient(90deg,#25141d,#0d1927)}.team.me{border-color:#246084}.teamTop{display:flex;justify-content:space-between;gap:10px}.name b{font-size:15px}.name small{display:block;color:var(--muted);margin-top:2px}.score{text-align:right}.score b{font-size:22px}.score small{display:block;color:var(--muted);font-size:10px}.bar{height:5px;background:#182b3e;border-radius:9px;margin-top:10px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:9px}.danger .fill{background:var(--red)}.badge{position:absolute;top:8px;left:8px;background:#4a1d2b;color:#fda4af;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900}.players{display:grid;gap:6px}.player{display:flex;justify-content:space-between;background:var(--p);border:1px solid var(--line);padding:10px;border-radius:11px}.player small{color:var(--muted);display:block}.player b{font-size:14px}.points{font-weight:900;text-align:right}.note{padding:12px;border-radius:12px;background:#111f2f;color:var(--muted);border:1px solid var(--line);font-size:12px}.livebar{padding:10px 12px;border-radius:12px;background:#0b211d;border:1px solid #1e5a48;color:#a7f3d0;font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#07111eeb;border-top:1px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.bottom a{background:transparent;color:var(--muted);font-size:11px;padding:6px 10px;text-decoration:none;text-align:center}.bottom .active{color:var(--blue);font-weight:900}@media(min-width:700px){.board{grid-template-columns:1fr 1fr}.heroStats{max-width:720px}.players{grid-template-columns:1fr 1fr}}@media(max-width:560px){.heroStats{grid-template-columns:1fr 1fr}}@media(max-width:420px){h1{font-size:24px}}

const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',sb=supabase.createClient(URL,KEY);let uid,league,teams=[],roster=[],lineups=[],official=[],stats={},players={},lastUpdate=null,loading=false;

const n=(x)=>Number(x||0);
function fantasy(s){if(!s)return null;return n(s.pass_td)*4+n(s.pass_yd)*.04+n(s.pass_int)*-2+n(s.rush_yd)*.1+n(s.rush_td)*6+n(s.rec)*.5+n(s.rec_yd)*.1+n(s.rec_td)*6+n(s.fum_lost)*-2}

async function load(){if(loading)return;loading=true;try{if(!(await sb.auth.getSession()).data.session)await sb.auth.signInAnonymously();uid=(await sb.auth.getUser()).data.user.id;let lid=localStorage.getItem('guillotine-live-league-id');if(!lid){location.href='index.html';return}let L=await sb.from('leagues').select('*').eq('id',lid).single();if(L.error)throw L.error;league=L.data;let w=league.current_week||1;let [t,r,s,l,p]=await Promise.all([sb.from('teams').select('*').eq('league_id',lid).order('team_number'),sb.from('roster_players').select('*,players(*)').eq('league_id',lid),sb.from('weekly_scores').select('*').eq('league_id',lid),sb.from('lineups').select('*').eq('league_id',lid).eq('week',w),sb.from('players').select('*')]);teams=t.data||[];roster=r.data||[];official=s.data||[];lineups=l.data||[];(p.data||[]).forEach(x=>players[x.sleeper_id]=x);let season=league.season||new Date().getFullYear();try{stats=await sleeper(`https://api.sleeper.app/v1/stats/nfl/regular/${season}?week=${w}`);if(Array.isArray(stats)){let map={};stats.forEach(x=>{map[x.player_id]=x});stats=map}}catch(e){stats={};}lastUpdate=new Date();render()}catch(e){document.getElementById('app').innerHTML='<div class="note">Unable to load Game Day: '+esc(e.message)+'</div>'}finally{loading=false}}
function liveScore(teamId,w){let starters=lineups.filter(l=>l.team_id===teamId&&!l.locked===false||l.team_id===teamId);let total=0,has=false,items=[];starters.forEach(l=>{let r=roster.find(x=>x.team_id===teamId&&x.sleeper_id===l.sleeper_id),p=r?.players||players[l.sleeper_id],st=stats[l.sleeper_id];let pts=fantasy(st);if(pts!=null){total+=pts;has=true}items.push({slot:l.slot,p,pts})});return{total,has,items}}
function render(){let w=league.current_week||1,alive=teams.filter(t=>t.alive),rows=alive.map(t=>{let lv=liveScore(t.id,w);let os=official.find(s=>s.team_id===t.id&&s.week===w);return{t,lv,os}});let anyLive=rows.some(x=>x.lv.has),scored=rows.filter(x=>x.lv.has),rowsSorted=[...rows].sort((a,b)=>{let av=a.lv.has?a.lv.total:(a.os?.points??-1),bv=b.lv.has?b.lv.total:(b.os?.points??-1);return bv-av});let leader=scored.length?Math.max(...scored.map(x=>x.lv.total)):Math.max(0,...rows.map(x=>n(x.os?.points)));let low=rowsSorted[rowsSorted.length-1],mine=teams.find(t=>t.owner_user_id===uid),my=mine?rows.find(x=>x.t.id===mine.id):null;let myPlayers=my?.lv.items||[];document.getElementById('app').innerHTML=`<div class="top"><div class="logo">⚔️ Guillotine League<small>${esc(league.name)}</small></div><div class="week"><b>Week ${w}</b><small>${alive.length} teams alive</small></div></div><section class="hero"><div class="live"><i class="dot"></i> Live Game Day</div><h1>${esc(mine?.name||'League Scoreboard')}</h1><div class="sub">${my?.lv.has?`Your live estimate is <b>${my.lv.total.toFixed(2)} points</b>.`:'Live player scoring is waiting for available stats.'} ${low?`Current elimination line: <b>${(low.lv.has?low.lv.total:n(low.os?.points)).toFixed(2)}</b>.`:''}</div><div class="heroStats"><div class="hs"><b>${my?.lv.has?my.lv.total.toFixed(2):'—'}</b><span>Your live points</span></div><div class="hs"><b>${low?(low.lv.has?low.lv.total:n(low.os?.points)).toFixed(2):'—'}</b><span>Danger line</span></div><div class="hs"><b>${leader.toFixed(2)}</b><span>Current high</span></div><div class="hs"><b>${lastUpdate?lastUpdate.toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'}):'—'}</b><span>Last update</span></div></div><button class="refresh" onclick="load()">↻ Refresh now</button></section>${anyLive?'<div class="livebar">🟢 LIVE ESTIMATE — Player scoring is pulled from Sleeper. Official weekly scores and elimination are still finalized by the commissioner.</div>':'<div class="note">Live stats are not available yet. Official scores will appear here when the commissioner calculates the week.</div>'}<section class="section"><div class="head"><h2>🚨 Guillotine Danger Zone</h2><small>Lowest surviving score is eliminated</small></div><div class="board">${rowsSorted.map((x,i)=>{let value=x.lv.has?x.lv.total:(x.os?.points??null),pct=leader?Math.max(3,n(value)/leader*100):3,d=i<3;return `<article class="team ${d?'danger':''} ${x.t.id===mine?.id?'me':''}">${d?'<span class="badge">DANGER</span>':''}<div class="teamTop"><div class="name"><b>${i+1}. ${esc(x.t.name)}</b><small>${esc(x.t.manager_name||'Open')}${x.t.id===mine?.id?' · YOU':''}</small></div><div class="score"><b>${value==null?'—':value.toFixed(2)}</b><small>${x.lv.has?'LIVE ESTIMATE':x.os?'OFFICIAL':'Waiting'}</small></div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></article>`}).join('')}</div></section><section class="section"><div class="head"><h2>🏈 My Starters</h2><small>${myPlayers.length} slots set</small></div>${myPlayers.length?'<div class="players">'+myPlayers.map(x=>`<div class="player"><div><b>${esc(x.p?.name||'Unknown player')}</b><small>${esc(x.slot)} · ${esc(x.p?.position||'')}</small></div><div class="points">${x.pts==null?'—':x.pts.toFixed(2)}<small>${x.pts==null?'No live stat':'LIVE'}</small></div></div>`).join('')+'</div>':'<div class="note">No lineup is showing for this week. Set your lineup from the Lineup page before the deadline.</div>'}</section><section class="section"><div class="note">⚠️ Live totals are estimates based on currently available player statistics. The commissioner’s official weekly score remains the result used for elimination.</div></section>`}
