<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automatic Weekly Engine</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#0b1220;color:#fff}main{max-width:900px;margin:auto;padding:18px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:28px;font-weight:bold}.muted{color:#94a3b8}.ok{color:#86efac}.err{color:#fca5a5}.warn{background:#3b2510;padding:12px;border-radius:8px}button{padding:11px 15px;border:0;border-radius:8px;background:#22c55e;font-weight:bold;cursor:pointer;margin:4px}button:disabled{opacity:.45;cursor:not-allowed}.danger{background:#dc2626;color:#fff}.alt{background:#263244;color:#fff}.step{padding:12px;border:1px solid #334155;border-radius:9px;margin:8px 0}.done{border-color:#16a34a}.active{border-color:#2563eb}.actions{display:flex;flex-wrap:wrap;gap:5px}</style></head><body><main><div class="card"><h1>⚙️ Automatic Guillotine Weekly Engine</h1><p class="muted">Commissioner-only control center. The engine automates safe weekly processing but always requires confirmation before eliminating a team.</p><a href="index.html" style="color:#93c5fd">← Back to League Manager</a></div><div id="app" class="card">Loading…</div></main><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),KEYID='guillotine-live-league-id';let session,league,teams=[],status={},msg='';
async function auth(){let r=await db.auth.getSession();if(r.error)throw r.error;if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}session=r.data.session}
async function load(){let id=localStorage.getItem(KEYID);if(!id)throw Error('Open the main league app first so this browser has a league ID.');let r=await db.from('leagues').select('*').eq('id',id).single();if(r.error)throw r.error;league=r.data;r=await db.from('teams').select('*').eq('league_id',id).order('team_number');if(r.error)throw r.error;teams=r.data||[];let s=await db.rpc('weekly_engine_status',{p_league_id:id,p_week:league.current_week});if(s.error)throw s.error;status=s.data||{}}
function render(){let comm=league&&league.commissioner_user_id===session.user.id,w=league?.current_week||1,ready=status.ready_for_elimination;document.getElementById('app').innerHTML=!comm?'<h2 class="err">Commissioner access required</h2>':`<div class="grid"><div><span class="muted">Week</span><div class="stat">${w}/17</div></div><div><span class="muted">Teams Alive</span><div class="stat">${status.teams_alive??'-'}</div></div><div><span class="muted">Scores</span><div class="stat">${status.scores_calculated??0}</div></div><div><span class="muted">Pending Bids</span><div class="stat">${status.pending_bids??0}</div></div></div><div class="card"><h2>Weekly Workflow</h2><div class="step ${status.lineups_locked?'done':'active'}"><b>1. Lock completed-week lineups</b><br><span class="muted">${status.lineups_locked||0} surviving-team lineup rows are locked.</span></div><div class="step ${status.scores_calculated?'done':'active'}"><b>2. Sync final NFL stats + calculate scores</b><br><span class="muted">${status.scores_calculated?'Scores calculated.':'Ready to pull final Sleeper stats.'}</span></div><div class="step ${status.eliminated?'done':'active'}"><b>3. Confirm elimination</b><br><span class="muted">${status.lowest_team_id?'Current lowest: '+name(status.lowest_team_id)+' — '+Number(status.lowest_score).toFixed(2)+' points.':'Waiting for scores.'}</span></div><div class="step ${status.ready_for_waivers?'done':'active'}"><b>4. Process FAAB waivers</b><br><span class="muted">${status.pending_bids||0} pending bids.</span></div><div class="step ${status.complete?'done':'active'}"><b>5. Advance / finish</b><br><span class="muted">${status.complete?'League complete.':'Advance after elimination and waiver processing.'}</span></div></div><div class="actions"><button onclick="lockWeek()" ${status.eliminated?'disabled':''}>Lock Lineups</button><button onclick="syncAndScore()" ${status.eliminated?'disabled':''}>Sync Final Stats + Calculate</button><button class="danger" onclick="confirmEliminate()" ${!ready?'disabled':''}>Confirm Elimination</button><button onclick="processWaivers()" ${!status.eliminated||status.pending_bids>0?'disabled':''}>Process Waivers</button><button onclick="advance()" ${!status.eliminated||status.pending_bids>0?'disabled':''}>${w===17?'Finish League':'Advance Week'}</button></div>${msg?'<p class="ok">'+esc(msg)+'</p>':''}${status.lowest_team_id&&!status.eliminated?'<div class="warn"><b>⚠️ Elimination preview:</b> '+esc(name(status.lowest_team_id))+' is currently lowest at '+Number(status.lowest_score).toFixed(2)+'. Season-long points are the tiebreaker. Elimination cannot be undone.</div>':''}`}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function name(id){return teams.find(t=>t.id===id)?.name||'Unknown team'}async function refresh(){await load();render()}async function action(fn){try{msg='';await fn();await refresh()}catch(e){alert(e.message||e);await refresh()}}
async function lockWeek(){await action(async()=>{let r=await db.rpc('lock_week_lineups',{p_league_id:league.id,p_week:league.current_week});if(r.error)throw r.error;msg='Locked '+r.data+' lineup rows for Week '+league.current_week+'.'})}
async function syncAndScore(){await action(async()=>{let w=league.current_week,r=await fetch('https://api.sleeper.app/v1/stats/nfl/regular/'+league.season+'?week='+w);if(!r.ok)throw Error('Sleeper weekly stats request failed.');let data=await r.json(),rows=Object.entries(data).map(([id,s])=>({sleeper_id:String(id),season:league.season,week:w,stats:s,updated_at:new Date().toISOString()}));for(let i=0;i<rows.length;i+=200){let x=await db.from('nfl_stats').upsert(rows.slice(i,i+200),{onConflict:'sleeper_id,season,week'});if(x.error)throw x.error}let c=await db.rpc('calculate_week_scores',{p_league_id:league.id,p_week:w});if(c.error)throw c.error;msg='Synced '+rows.length+' Sleeper stat lines and calculated '+c.data+' team scores.'})}
async function confirmEliminate(){let t=teams.find(x=>x.id===status.lowest_team_id);if(!t)return;if(!confirm('ELIMINATE '+t.name+' with '+Number(status.lowest_score).toFixed(2)+' points for Week '+league.current_week+'? Their entire roster will enter FAAB waivers.'))return;await action(async()=>{let r=await db.rpc('eliminate_lowest_team',{p_league_id:league.id,p_week:league.current_week});if(r.error)throw r.error;msg='Eliminated '+t.name+'. Their roster is now in the waiver pool.'})}
async function processWaivers(){await action(async()=>{let r=await db.rpc('process_waivers',{p_league_id:league.id,p_week:league.current_week});if(r.error)throw r.error;msg='Processed '+r.data+' winning waiver awards.'})}
async function advance(){await action(async()=>{let r=await db.rpc('advance_guillotine_week',{p_league_id:league.id});if(r.error)throw r.error;msg=r.data.complete?'League complete! Champion: '+(r.data.champion||'Final surviving team'):'Advanced to Week '+r.data.week+'.'})}
(async()=>{try{await auth();await refresh()}catch(e){document.getElementById('app').innerHTML='<h2 class="err">Unable to load engine</h2><p>'+esc(e.message||e)+'</p>'}})();</script></body></html>
