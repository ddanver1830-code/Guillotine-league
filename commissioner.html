<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine Commissioner Center</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff}header{background:#020617;padding:16px;position:sticky;top:0;z-index:5;border-bottom:1px solid #263244}main{max-width:1200px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin-bottom:14px}.stat{font-size:30px;font-weight:bold}.muted{color:#94a3b8}.ok{color:#4ade80}.warn{color:#fbbf24}.bad{color:#f87171}.button{padding:11px 14px;border:0;border-radius:8px;background:#22c55e;color:#04100a;font-weight:bold;cursor:pointer}.button.alt{background:#263244;color:#fff}.button.danger{background:#dc2626;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.step{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #334155;border-radius:10px;margin:8px 0}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#263244;font-weight:bold}.done .num{background:#16a34a}.active .num{background:#2563eb}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #334155;text-align:left}.right{text-align:right}.dangerzone{border-color:#7f1d1d;background:#291014}.notice{padding:12px;border-radius:9px;background:#172033;margin:8px 0}.champ{font-size:38px;color:#4ade80}@media(max-width:600px){.stat{font-size:25px}}
</style></head><body><header><b>🏈 Guillotine League — Commissioner Center</b><div class="muted">Run the weekly engine safely. Eliminations always require your confirmation.</div></header><main><div id="app"><div class="card">Loading commissioner center…</div></div></main><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let session,league,teams=[],status={},state={};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function auth(){let r=await db.auth.getSession();if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}session=(await db.auth.getSession()).data.session}
async function load(){let id=localStorage.getItem(LK);if(!id)throw Error('Open the main league app first.');let r=await db.from('leagues').select('*').eq('id',id).single();if(r.error)throw r.error;league=r.data;r=await db.from('teams').select('*').eq('league_id',id).order('team_number');if(r.error)throw r.error;teams=r.data;r=await db.rpc('weekly_engine_status',{p_league_id:id,p_week:league.current_week});if(r.error)throw r.error;status=r.data;let s=await fetch('https://api.sleeper.app/v1/state/nfl');state=s.ok?await s.json():{}}
function steps(){let s=status;return `<div class="card"><h2>Week ${s.week} Workflow</h2><div class="step ${s.lineups_locked>0?'done':'active'}"><div class="num">1</div><div><b>Lineups</b><br><span class="muted">${s.lineups_locked} locked for ${s.teams_alive} surviving teams.</span></div></div><div class="step ${s.scores_calculated>0?'done':'active'}"><div class="num">2</div><div><b>Official Scores</b><br><span class="muted">${s.scores_calculated} teams have finalized weekly scores.</span></div></div><div class="step ${s.eliminated?'done':'active'}"><div class="num">3</div><div><b>Elimination</b><br><span class="muted">${s.eliminated?'Completed.':'Commissioner confirmation required.'}</span></div></div><div class="step ${s.ready_for_waivers?'done':'active'}"><div class="num">4</div><div><b>Waivers</b><br><span class="muted">${s.pending_bids} pending bids.</span></div></div><div class="step ${s.ready_to_advance?'active':'active'}"><div class="num">5</div><div><b>Advance Week</b><br><span class="muted">${s.ready_to_advance?'Ready to advance.':'Waiting for elimination/waivers.'}</span></div></div></div>`}
function render(){let s=status,low=teams.find(t=>t.id===s.lowest_team_id),alive=teams.filter(t=>t.alive);document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="muted">Current Week</div><div class="stat">${s.week}/17</div></div><div class="card"><div class="muted">Teams Alive</div><div class="stat">${s.teams_alive}</div></div><div class="card"><div class="muted">NFL</div><div class="stat ${state.season_type==='regular'?'ok':'warn'}">${esc(state.season_type||'unknown')} · W${esc(state.week||'—')}</div></div><div class="card"><div class="muted">League Status</div><div class="stat">${esc(league.status)}</div></div></div>${league.status==='complete'?`<div class="card"><h2>🏆 Champion</h2><div class="champ">${esc(alive[0]?.manager_name||alive[0]?.name||'Champion')}</div></div>`:''}${steps()}<div class="card"><h2>⚙️ Commissioner Actions</h2><div class="notice">These actions are intentionally staged. The engine will not silently eliminate a team.</div><div class="actions"><button class="button alt" onclick="refresh()">↻ Refresh NFL / Workflow</button><button class="button" onclick="lockLineups()">Lock Surviving Lineups</button><button class="button" onclick="calcScores()">Calculate Official Scores</button>${low&&!s.eliminated?`<button class="button danger" onclick="eliminate()">☠️ Confirm Eliminate ${esc(low.name)}</button>`:''}${s.eliminated&&s.pending_bids>0?`<button class="button" onclick="processWaivers()">💰 Process Waivers (${s.pending_bids})</button>`:''}${s.ready_to_advance?`<button class="button" onclick="advance()">➡️ Advance to Week ${Number(s.week)+1}</button>`:''}</div></div>${low&&!s.eliminated?`<div class="card dangerzone"><h2>🚨 Elimination Candidate</h2><div class="stat bad">${esc(low.name)}</div><p>Live/official weekly score: <b>${Number(s.lowest_score||0).toFixed(2)}</b></p><p class="muted">Season-long tiebreak points: ${Number(s.lowest_season_points||0).toFixed(2)}</p><p class="muted">Nothing happens until you press the confirmation button.</p></div>`:''}<div class="card"><h2>Surviving Teams</h2><div class="scroll"><table><tr><th>#</th><th>Team</th><th>Manager</th><th>FAAB</th><th>Status</th></tr>${teams.map(t=>`<tr><td>${t.team_number}</td><td>${esc(t.name)}</td><td>${esc(t.manager_name||'Open')}</td><td>$${t.faab}</td><td class="${t.alive?'ok':'bad'}">${t.alive?'ALIVE':'ELIMINATED'}</td></tr>`).join('')}</table></div></div><div class="card"><a class="button alt" href="index.html">← League Manager</a> <a class="button alt" href="live-scoring.html">Live Scoring</a></div>`}
async function refresh(){try{await load();render()}catch(e){alert(e.message||e)}}
async function call(name,args){let r=await db.rpc(name,args);if(r.error)throw r.error;return r.data}
async function lockLineups(){try{let n=await call('lock_week_lineups',{p_league_id:league.id,p_week:league.current_week});alert('Locked '+n+' lineup rows.');await refresh()}catch(e){alert(e.message||e)}}
async function calcScores(){try{let n=await call('calculate_week_scores',{p_league_id:league.id,p_week:league.current_week});alert('Calculated official scores for '+n+' teams.');await refresh()}catch(e){alert(e.message||e)}}
async function eliminate(){if(!confirm('CONFIRM ELIMINATION: '+(teams.find(t=>t.id===status.lowest_team_id)?.name||'lowest team')+' will be removed and its entire roster released to waivers. This cannot be undone. Continue?'))return;try{let x=await call('eliminate_lowest_team',{p_league_id:league.id,p_week:league.current_week});alert('Eliminated team. Roster released to waivers.');await refresh()}catch(e){alert(e.message||e)}}
async function processWaivers(){if(!confirm('Process all Week '+league.current_week+' blind FAAB bids now?'))return;try{let n=await call('process_waivers',{p_league_id:league.id,p_week:league.current_week});alert('Waivers processed. '+n+' player awards.');await refresh()}catch(e){alert(e.message||e)}}
async function advance(){if(!confirm('Advance the league to the next week?'))return;try{let x=await call('advance_guillotine_week',{p_league_id:league.id});alert(x.complete?'League complete! Champion: '+(x.champion||''):'Advanced to Week '+x.week);await refresh()}catch(e){alert(e.message||e)}}
async function start(){try{await auth();await load();render();setInterval(refresh,30000)}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Commissioner access unavailable</h2><p>'+esc(e.message||e)+'</p><a class="button" href="index.html">Return to League</a></div>'}}
start();</script></body></html>
