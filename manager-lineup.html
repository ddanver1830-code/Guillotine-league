<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager Lineup</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07111f;color:#fff;font:15px system-ui;padding:16px 16px 90px}.wrap{max-width:850px;margin:auto}.card{background:#0e1b2d;border:1px solid #20344d;border-radius:16px;padding:16px;margin:12px 0}select,button{width:100%;padding:12px;margin:5px 0;background:#12243b;color:#fff;border:1px solid #35516d;border-radius:9px}button{background:#38bdf8;color:#04111d;font-weight:900}.muted{color:#91a4bb}.nav{position:fixed;bottom:0;left:0;right:0;background:#06101d;border-top:1px solid #20344d;display:grid;grid-template-columns:repeat(5,1fr)}.nav a{color:#91a4bb;text-decoration:none;text-align:center;padding:10px 3px;font-size:11px}.nav .active{color:#fff;background:#132a42}</style></head><body><main class="wrap" id="app"><div class="card">Loading Lineup…</div></main><nav class="nav"><a href="manager-home.html">⌂<br>Home</a><a href="manager-game.html">🏈<br>Game Day</a><a class="active" href="manager-lineup.html">📋<br>Lineup</a><a href="manager-waivers.html">💰<br>Waivers</a><a href="manager-scores.html">📈<br>Scores</a></nav><script>const sb=window.supabase.createClient('https://unmahnndjtljktvrupkh.supabase.co','sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',{auth:{persistSession:true,autoRefreshToken:true}}),LK='guillotine-live-league-id';let league,mine,roster=[],saved=[];const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function slots(w){return w<=6?['QB','RB','WR1','WR2','TE','FLEX','K','DEF']:w<=12?['QB1','RB1','RB2','WR1','WR2','WR3','TE','FLEX','K','DEF']:['QB1','QB2','RB1','RB2','WR1','WR2','WR3','TE','FLEX1','FLEX2','K','DEF']}function ok(s,p){if(s.startsWith('QB'))return p==='QB';if(s.startsWith('RB'))return p==='RB';if(s.startsWith('WR'))return p==='WR';if(s==='TE')return p==='TE';if(s.startsWith('FLEX'))return ['RB','WR','TE'].includes(p);if(s==='K')return p==='K';return ['DEF','DST'].includes(p)}async function start(){try{let se=(await sb.auth.getSession()).data.session;if(!se){let r=await sb.auth.signInAnonymously();if(r.error)throw r.error}se=(await sb.auth.getSession()).data.session;let id=localStorage.getItem(LK);if(!id)throw Error('Enter your league from the Manager Lobby first.');let l=await sb.from('leagues').select('*').eq('id',id).single();if(l.error)throw l.error;league=l.data;let t=await sb.from('teams').select('*').eq('league_id',id);mine=t.data?.find(x=>x.owner_user_id===se.user.id);if(!mine)throw Error('No team is connected to this manager account.');let r=await sb.from('roster_players').select('*,players(*)').eq('team_id',mine.id);if(r.error)throw r.error;roster=r.data||[];let q=await sb.from('lineups').select('*').eq('team_id',mine.id).eq('week',league.current_week);if(q.error)throw q.error;saved=q.data||[];render()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Lineup</h2><p class="muted">'+esc(e.message)+'</p><a href="manager-lobby.html">Return to Manager Lobby</a></div>'}}function render(){let ss=slots(league.current_week),map=Object.fromEntries(saved.map(x=>[x.slot,x.sleeper_id]));document.getElementById('app').innerHTML='<div class="card"><h1>📋 Set Lineup</h1><p class="muted">'+esc(mine.name)+' · Week '+league.current_week+'</p></div><div class="card">'+ss.map(s=>'<label><b>'+s+'</b><select id="s_'+s+'"><option value="">Select player</option>'+roster.filter(r=>!r.is_ir&&ok(s,r.players?.position||r.position)).map(r=>'<option value="'+esc(r.sleeper_id)+'" '+(map[s]===r.sleeper_id?'selected':'')+'>'+esc(r.players?.name||r.name||r.sleeper_id)+' · '+esc(r.players?.position||r.position||'')+'</option>').join('')+'</select></label>').join('')+'<button onclick="save()">Save Lineup</button></div>'}async function save(){try{let ss=slots(league.current_week),p={};for(let s of ss){let v=document.getElementById('s_'+s).value;if(!v)throw Error('Select a player for '+s+'.');p[s]=v}if(new Set(Object.values(p)).size!==ss.length)throw Error('A player can only be used once.');let r=await sb.rpc('set_lineup',{p_league_id:league.id,p_team_id:mine.id,p_week:league.current_week,p_slots:p});if(r.error)throw r.error;alert('Lineup saved!');start()}catch(e){alert(e.message)}}start();</script></body></html>
