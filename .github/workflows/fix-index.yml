name: Fix main app commissioner routing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function go(x){location.hash=x;render()}"
          new="function go(x){if(x==='Commissioner'){location.href='commissioner.html?v=20260902';return}location.hash=x;render()}"
          if old not in s:
              raise SystemExit('Target navigation function not found; refusing to modify index.html')
          s=s.replace(old,new,1)
          p.write_text(s)
          print('Commissioner route patched')
          PY
      - name: Commit fix and remove workflow
        run: |
          rm -f .github/workflows/fix-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-index.yml
          git commit -m 'Fix commissioner navigation to stable dashboard' || exit 0
          git push