<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guillotine League — Manager Home</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07111f;--panel:#0e1b2d;--panel2:#12243b;--text:#f7fbff;--muted:#91a4bb;--line:#20344d;--accent:#38bdf8;--good:#34d399;--warn:#fbbf24;--danger:#fb7185;--shadow:0 14px 40px rgba(0,0,0,.24)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#081526,#050b14);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1120px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:900;font-size:21px}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}.week{text-align:right}.week b{font-size:18px}.week span{display:block;color:var(--muted);font-size:12px}.hero{background:linear-gradient(135deg,#102d49,#0c1728);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}.hero .eyebrow{color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.hero h1{margin:5px 0 6px;font-size:30px;line-height:1.05}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.metric{font-size:25px;font-weight:900}.label{color:var(--muted);font-size:12px;margin-top:3px}.danger{border-color:#613040;background:linear-gradient(135deg,#24131d,#111827)}.danger h2{margin:0 0 4px}.danger p{color:var(--muted);margin:0 0 12px}.rank{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.rank:first-child{border-top:0}.rank strong{display:block}.rank small{color:var(--muted)}.pill{border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.red{background:#4b1d2a;color:#fda4af}.green{background:#123c32;color:#86efac}.yellow{background:#4a3511;color:#fde68a}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.action{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:15px;font-weight:800;transition:.15s}.action:hover{transform:translateY(-1px);border-color:#365879}.action span{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.title h2{font-size:17px;margin:0}.title a{color:var(--accent);font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.players{display:flex;flex-wrap:wrap;gap:7px}.player{background:#16273c;border:1px solid #27415e;border-radius:9px;padding:7px 9px;font-size:12px}.status{display:inline-flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}.footer{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}.footer a{padding:9px 12px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px}.loading{text-align:center;padding:45px;color:var(--muted)}.error{background:#3a1720;border:1px solid #713040;padding:14px;border-radius:12px;color:#fecdd3}button{border:0;cursor:pointer;background:var(--accent);color:#04111d;font-weight:900;border-radius:10px;padding:9px 13px}@media(max-width:760px){.wrap{padding:13px 12px 30px}.top{align-items:flex-start}.hero{padding:18px;border-radius:18px}.hero h1{font-size:25px}.grid{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.card{padding:14px}.metric{font-size:22px}}@media(max-width:400px){.grid{gap:8px}.actions{gap:8px}.week b{font-size:15px}}
</style></head>
<body><main class="wrap" id="app"><div class="loading">Loading your league…</div></main>
<script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',sb=supabase.createClient(URL,KEY);let league,teams=[],roster=[],scores=[],lineups=[],waivers=[],uid;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=x=>`$${Number(x||0).toFixed(0)}`;
async function load(){try{let a=await sb.auth.getSession();if(!a.data.session)await sb.auth.signInAnonymously();uid=(await sb.auth.getUser()).data.user.id;let lid=localStorage.getItem('guillotine-live-league-id');if(!lid){location.href='index.html';return}let L=await sb.from('leagues').select('*').eq('id',lid).single();if(L.error)throw L.error;league=L.data;let [t,r,s,l,w]=await Promise.all([sb.from('teams').select('*').eq('league_id',lid).order('team_number'),sb.from('roster_players').select('*,players(*)').eq('league_id',lid),sb.from('weekly_scores').select('*').eq('league_id',lid),sb.from('lineups').select('*').eq('league_id',lid).eq('week',league.current_week),sb.from('waiver_bids').select('*').eq('league_id',lid).eq('week',league.current_week).is('processed_at',null)]);teams=t.data||[];roster=r.data||[];scores=s.data||[];lineups=l.data||[];waivers=w.data||[];render();subscribe();}catch(e){document.getElementById('app').innerHTML=`<div class="error">Unable to load the league: ${esc(e.message)}<br><br><a href="index.html">Back to league</a></div>`}}
function render(){const mine=teams.find(t=>t.owner_user_id===uid)||teams.find(t=>t.owner_user_id);const alive=teams.filter(t=>t.alive);const week=league.current_week||1;const myScore=scores.find(s=>s.team_id===mine?.id&&s.week===week)?.points;const board=alive.map(t=>({t,s:scores.find(x=>x.team_id===t.id&&x.week===week)?.points??null})).sort((a,b)=>(a.s??999999)-(b.s??999999));const danger=board.slice(0,3);const gap=myScore==null?'—':(myScore-(board[0]?.s??myScore)).toFixed(2);const myRoster=roster.filter(r=>r.team_id===mine?.id);const starters=lineups.filter(l=>l.team_id===mine?.id);const pending=waivers.filter(b=>b.team_id===mine?.id).length;document.getElementById('app').innerHTML=`
<div class="top"><div class="brand">⚔️ Guillotine League<small>${esc(league.name)}</small></div><div class="week"><b>Week ${week} / 17</b><span>${alive.length} teams alive</span></div></div>
<section class="hero"><div class="eyebrow">Manager Home</div><h1>${esc(mine?.name||'Your Team')}</h1><p>${esc(mine?.manager_name||'Manager')} · ${mine?.alive?'Still alive 🔥':'Eliminated'} · ${money(mine?.faab)} FAAB remaining</p></section>
<div class="grid"><div class="card"><div class="metric">${myScore==null?'—':myScore.toFixed(2)}</div><div class="label">Week ${week} points</div></div><div class="card"><div class="metric">${gap==='—'?'—':(Number(gap)>=0?'+':'')+gap}</div><div class="label">Points above danger line</div></div><div class="card"><div class="metric">${money(mine?.faab)}</div><div class="label">FAAB available</div></div><div class="card"><div class="metric">${starters.length}</div><div class="label">Lineup slots set</div></div></div>
<div class="actions"><a class="action" href="game-day.html">🏈 Game Day<span>Live scores & danger zone</span></a><a class="action" href="live-scoring.html">📈 Live Scoring<span>Player-by-player points</span></a><a class="action" href="waiver-center.html">💰 Waivers<span>${pending?pending+' pending bid(s)':'Bid on available players'}</span></a><a class="action" href="index.html">📋 Full League<span>Roster, draft & settings</span></a></div>
<div class="two"><section class="card danger"><div class="title"><h2>🚨 Guillotine Danger Zone</h2><span class="pill red">Bottom 3</span></div><p>The lowest surviving team after the week is eliminated.</p>${danger.map((x,i)=>`<div class="rank"><div><strong>${i+1}. ${esc(x.t.name)}</strong><small>${esc(x.t.manager_name||'Open')}</small></div><div>${x.s==null?'—':x.s.toFixed(2)} pts</div></div>`).join('')}</section>
<section class="card"><div class="title"><h2>Your Lineup</h2><a href="index.html">Edit</a></div>${starters.length?`<div class="players">${starters.map(l=>{let r=myRoster.find(x=>x.sleeper_id===l.sleeper_id),p=r?.players;return `<span class="player">${esc(l.slot)} · ${esc(p?.name||l.sleeper_id)}</span>`}).join('')}</div>`:'<p style="color:var(--muted)">No lineup saved yet. Set your lineup before games lock.</p>'}</section></div>
<section class="card" style="margin-top:14px"><div class="title"><h2>League Standings</h2><a href="index.html">Details</a></div>${board.slice(0,8).map((x,i)=>`<div class="row"><div><strong>${i+1}. ${esc(x.t.name)}</strong><div style="color:var(--muted);font-size:11px">${esc(x.t.manager_name||'Open')}</div></div><div>${x.s==null?'—':x.s.toFixed(2)}</div></div>`).join('')}</section>
<div class="footer"><a href="index.html">Home</a><a href="game-day.html">Game Day</a><a href="live-scoring.html">Live Scoring</a><a href="waiver-center.html">Waivers</a><a href="commissioner.html">Commissioner</a><button onclick="load()">Refresh</button></div>`}
function subscribe(){sb.channel('manager-home').on('postgres_changes',{event:'*',schema:'public',table:'teams',filter:`league_id=eq.${league.id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'weekly_scores',filter:`league_id=eq.${league.id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'lineups',filter:`league_id=eq.${league.id}`},load).on('postgres_changes',{event:'*',schema:'public',table:'waiver_bids',filter:`league_id=eq.${league.id}`},load).subscribe();setTimeout(load,30000)}load();
</script></body></html>
