<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — Lineup</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#06101c;--p:#0d1b2b;--p2:#12263c;--line:#203951;--text:#f8fbff;--muted:#8fa4bb;--blue:#38bdf8;--red:#fb7185;--green:#34d399;--yellow:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#10283f,#050b13 58%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:800px;margin:auto;padding:14px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-size:20px;font-weight:900}.logo small{display:block;font-size:11px;color:var(--muted)}.week{text-align:right}.week b{font-size:17px}.week small{display:block;color:var(--muted)}.hero{border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(135deg,#123552,#0b1726);margin-bottom:12px}.live{color:#86efac;font-weight:900;font-size:11px;text-transform:uppercase}.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:5px;box-shadow:0 0 10px var(--green)}h1{margin:6px 0;font-size:28px}.sub{color:var(--muted)}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}button{font:inherit;cursor:pointer}.btn{border:1px solid #315574;background:#16334d;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800}.btn.primary{background:#0b6b9a;border-color:#39bdf8}.btn.lock{background:#5b2634;border-color:#fb7185}.btn:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:10px;padding:10px 12px;border-radius:11px;background:#111f2f;border:1px solid var(--line);color:var(--muted);font-size:12px}.status.good{background:#0b211d;border-color:#1e5a48;color:#a7f3d0}.status.warn{background:#2a2010;border-color:#6a5120;color:#fde68a}.section{margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.head h2{margin:0;font-size:17px}.head small{color:var(--muted)}.slots{display:grid;gap:8px}.slot{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:11px}.slotTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.slotLabel{font-weight:900}.slotReq{font-size:10px;color:var(--muted);text-transform:uppercase}.slot select{width:100%;background:#081521;border:1px solid #2b465f;color:#fff;border-radius:9px;padding:11px;font:inherit}.slot select:focus{outline:2px solid var(--blue)}.roster{display:grid;gap:7px}.player{display:flex;justify-content:space-between;align-items:center;background:var(--p);border:1px solid var(--line);border-radius:12px;padding:10px}.player b{display:block}.player small{color:var(--muted)}.empty{padding:15px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}.bottom{position:fixed;bottom:0;left:0;right:0;background:#07111eeb;border-top:1px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.bottom a{color:var(--muted);font-size:11px;padding:6px 10px;text-decoration:none;text-align:center}.bottom .active{color:var(--blue);font-weight:900}@media(min-width:650px){.slots{grid-template-columns:1fr 1fr}.slots .slot:nth-last-child(1){grid-column:span 2}.roster{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap" id="app">Loading Lineup…</main><nav class="bottom"><a href="manager-center.html">⌂<br>Home</a><a href="game-center.html">🏈<br>Game Day</a><a class="active" href="lineup-center.html">📋<br>Lineup</a><a href="waiver-center.html">💰<br>Waivers</a><a href="live-scoring.html">📈<br>Scores</a></nav><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',sb=supabase.createClient(URL,KEY);let uid,league,teams=[],mine,roster=[],saved=[],week=1,slots=[],dirty=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function slotPlan(w){if(w<=6)return['QB','RB','WR1','WR2','TE','FLEX','K','DEF'];if(w<=12)return['QB1','RB1','RB2','WR1','WR2','WR3','TE','FLEX','K','DEF'];return['QB1','QB2','RB1','RB2','WR1','WR2','WR3','TE','FLEX1','FLEX2','K','DEF']}
function posAllowed(slot,pos){if(slot.startsWith('QB'))return pos==='QB';if(slot.startsWith('RB'))return pos==='RB';if(slot.startsWith('WR'))return pos==='WR';if(slot==='TE')return pos==='TE';if(slot.startsWith('FLEX'))return ['RB','WR','TE'].includes(pos);if(slot==='K')return pos==='K';if(slot==='DEF')return ['DEF','DST'].includes(pos);return false}
function optionPlayers(slot){return roster.filter(r=>!r.is_ir&&posAllowed(slot,r.players?.position||r.position)).sort((a,b)=>(a.players?.name||'').localeCompare(b.players?.name||''))}
async function rpc(name,args){let r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data}
async function load(){try{if(!(await sb.auth.getSession()).data.session)await sb.auth.signInAnonymously();uid=(await sb.auth.getUser()).data.user.id;let lid=localStorage.getItem('guillotine-live-league-id');if(!lid){location.href='index.html';return}let L=await sb.from('leagues').select('*').eq('id',lid).single();if(L.error)throw L.error;league=L.data;week=league.current_week||1;slots=slotPlan(week);let [t,r,l]=await Promise.all([sb.from('teams').select('*').eq('league_id',lid).order('team_number'),sb.from('roster_players').select('*,players(*)').eq('league_id',lid),sb.from('lineups').select('*').eq('league_id',lid).eq('week',week)]);teams=t.data||[];mine=teams.find(x=>x.owner_user_id===uid);roster=(r.data||[]).filter(x=>x.team_id===mine?.id);saved=l.data||[];dirty=false;render()}catch(e){document.getElementById('app').innerHTML='<div class="empty">Unable to load Lineup: '+esc(e.message)+'</div>'}}
function current(){let map={};saved.forEach(x=>map[x.slot]=x.sleeper_id);return map}
function render(){if(!mine){document.getElementById('app').innerHTML='<div class="empty">You do not have a team in this league yet. Use your league join link to claim a team.</div>';return}let locked=saved.some(x=>x.locked);let map=current();document.getElementById('app').innerHTML=`<div class="top"><div class="logo">⚔️ Guillotine League<small>${esc(league.name)}</small></div><div class="week"><b>Week ${week}</b><small>${esc(mine.name)}</small></div></div><section class="hero"><div class="live"><i class="dot"></i> Lineup Center</div><h1>${esc(mine.name)}</h1><div class="sub">${locked?'🔒 Your lineup is locked for this week.':'Set every starting slot, then save and lock your lineup before the deadline.'}</div><div class="actions"><button class="btn primary" onclick="saveLineup()" ${locked?'disabled':''}>✓ Save Lineup</button><button class="btn lock" onclick="lockLineup()" ${locked?'disabled':''}>🔒 Save & Lock</button><button class="btn" onclick="load()">↻ Refresh</button></div><div id="status" class="status">${locked?'Lineup locked. Changes are no longer allowed.':'Not locked yet.'}</div></section><section class="section"><div class="head"><h2>Starting Lineup</h2><small>${slots.length} starters required</small></div><div class="slots">${slots.map((slot,i)=>{let val=map[slot]||'';return `<div class="slot"><div class="slotTop"><span class="slotLabel">${esc(slot)}</span><span class="slotReq">Starter ${i+1}</span></div><select id="slot-${esc(slot)}" onchange="dirty=true"><option value="">— Select player —</option>${optionPlayers(slot).map(p=>{let id=p.sleeper_id;return `<option value="${esc(id)}" ${id===val?'selected':''}>${esc(p.players?.name||p.name||id)} · ${esc(p.players?.position||p.position||'')}</option>`}).join('')}</select></div>`}).join('')}</div></section><section class="section"><div class="head"><h2>Your Roster</h2><small>${roster.length} players</small></div><div class="roster">${roster.length?roster.map(r=>`<div class="player"><div><b>${esc(r.players?.name||r.name||'Unknown')}</b><small>${esc(r.players?.position||r.position||'')} · ${esc(r.players?.nfl_team||'')}</small></div><small>${r.is_ir?'IR':(saved.find(x=>x.sleeper_id===r.sleeper_id)?.slot||'BENCH')}</small></div>`).join(''):'<div class="empty">No players on your roster yet.</div>'}</div></section>`}
function getPayload(){let out={};for(const slot of slots){let v=document.getElementById('slot-'+slot)?.value||'';if(!v)throw new Error('Select a player for '+slot+'.');if(out[slot])throw new Error('Duplicate slot.');out[slot]=v}let ids=Object.values(out);if(new Set(ids).size!==ids.length)throw new Error('A player can only occupy one starting slot.');return out}
async function saveLineup(){try{if(saved.some(x=>x.locked))return;let p=getPayload();let d=await rpc('set_lineup',{p_league_id:league.id,p_team_id:mine.id,p_week:week,p_slots:p});saved=await sb.from('lineups').select('*').eq('league_id',league.id).eq('team_id',mine.id).eq('week',week).then(x=>x.data||[]);dirty=false;document.getElementById('status').className='status good';document.getElementById('status').textContent='✓ Lineup saved successfully. '+(d?.starters||slots.length)+' starters set.';render()}catch(e){document.getElementById('status').className='status warn';document.getElementById('status').textContent=e.message}}
async function lockLineup(){try{if(saved.some(x=>x.locked))return;await saveLineup();if(!saved.length)return;let d=await rpc('lock_lineup',{p_league_id:league.id,p_team_id:mine.id,p_week:week});saved=await sb.from('lineups').select('*').eq('league_id',league.id).eq('team_id',mine.id).eq('week',week).then(x=>x.data||[]);render();alert('Lineup locked for Week '+week+'.')}catch(e){alert(e.message)}}
load();setInterval(load,30000);
</script></body></html>
