<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guillotine League — Draft Timeout</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050b13;--p:#0d1826;--line:#29425a;--text:#f8fafc;--muted:#91a4b9;--blue:#38bdf8;--green:#34d399;--red:#fb7185;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#351c22,#050b13 62%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 14px 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:900;font-size:21px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.back{color:var(--muted);text-decoration:none}.hero{margin-top:12px;border:1px solid #7f3042;border-radius:20px;padding:24px;background:linear-gradient(135deg,#451d29,#0d1724);text-align:center}.eyebrow{color:var(--red);font-size:12px;font-weight:1000;letter-spacing:1px}.hero h1{font-size:34px;margin:7px 0}.clock{font-size:72px;font-weight:1000;color:var(--red);letter-spacing:-4px}.muted{color:var(--muted)}.card{background:#0d1826ee;border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}button{border:0;border-radius:9px;padding:12px 15px;font-weight:900;cursor:pointer;background:#2563eb;color:white}button.red{background:#dc2626}button.green{background:#059669}button.alt{background:#253449}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.good{color:var(--green)}.warn{color:var(--gold)}.bad{color:var(--red)}.notice{padding:12px;border-radius:10px;background:#291b24;color:#f6cbd4;margin-top:12px}@media(max-width:600px){.hero h1{font-size:27px}.clock{font-size:58px}.actions button{flex:1;min-width:180px}}</style></head><body><main class="wrap"><div id="app"><div class="card">Loading timeout console…</div></div></main><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY),LK='guillotine-live-league-id';let user,league,teams=[],picks=[],skips=[],state=null,timer,autoProcessing=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function auth(){let r=await db.auth.getSession();if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}user=(await db.auth.getSession()).data.user}
async function load(){let id=localStorage.getItem(LK);if(!id)throw Error('Open the main league app first.');let a=await db.from('leagues').select('*').eq('id',id).single();if(a.error)throw a.error;league=a.data;if(league.commissioner_user_id!==user.id)throw Error('Commissioner access required.');let [t,d,s,k]=await Promise.all([db.from('teams').select('*').eq('league_id',id).order('team_number'),db.from('draft_picks').select('*').eq('league_id',id).order('pick_number'),db.from('draft_state').select('*').eq('league_id',id).maybeSingle(),db.from('draft_skips').select('*').eq('league_id',id).order('pick_number')]);if(t.error)throw t.error;if(d.error)throw d.error;if(s.error)throw s.error;if(k.error)throw k.error;teams=t.data||[];picks=d.data||[];state=s.data||null;skips=k.data||[];render()}
function next(){let n=picks.length+1,r=Math.floor((n-1)/18)+1;return {n,r,tno:r%2?((n-1)%18)+1:18-((n-1)%18)}}
function rem(){if(!state)return 0;if(state.status!=='running'||!state.pick_started_at)return Math.max(0,state.remaining_seconds??state.pick_seconds??90);return Math.max(0,(state.remaining_seconds??state.pick_seconds??90)-Math.floor((Date.now()-new Date(state.pick_started_at).getTime())/1000))}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){clearInterval(timer);let x=next(),t=teams.find(z=>z.team_number===x.tno),r=rem(),pending=!!state?.timeout_pending;document.getElementById('app').innerHTML=`<div class="top"><div class="brand">⏰ Draft Timeout Console<small>${esc(league.name)} · Commissioner only</small></div><a class="back" href="draft-control.html">← Draft Control</a></div><section class="hero"><div class="eyebrow">${pending||r===0?'TIME EXPIRED':'DRAFT CLOCK'}</div><h1>${t?`Team ${x.tno} · ${esc(t.name)}`:'Draft Complete'}</h1><div class="muted">Round ${x.r} · Pick #${x.n} · ${esc(t?.manager_name||'Manager')}</div><div class="clock" id="clock">${fmt(r)}</div>${pending?'<div class="notice"><b>TIME EXPIRED — AUTOMATIC PICK</b><br>The clock expired. The system will select the best available player for this team and immediately advance the draft.</div>':'<div class="muted">This page automatically processes the best available player when the pick clock reaches 00:00.</div>'}</section><section class="card"><h2>Commissioner Action</h2><div class="actions"><button class="green" onclick="openRoom()">🏈 Open Draft Room</button><button class="alt" onclick="load()">↻ Refresh</button></div></section><section class="card"><h2>What happens next?</h2><div class="row"><span>Clock expires</span><span class="good">Best available player is selected</span></div><div class="row"><span>Roster</span><span class="good">Player is added automatically</span></div><div class="row"><span>Next manager</span><span class="warn">Clock starts immediately</span></div></section></div>`;if(state?.status==='running')timer=setInterval(update,250)}
function update(){let e=document.getElementById('clock');if(!e)return;let r=rem();e.textContent=fmt(r);if(r===0&&!state.timeout_pending&&!autoProcessing){flagAndAutoPick()} }
async function flagAndAutoPick(){if(autoProcessing)return;autoProcessing=true;try{let f=await db.rpc('flag_expired_draft_pick',{p_league_id:league.id});if(f.error)throw f.error;state=f.data;render();let a=await db.rpc('auto_pick_expired_draft_pick',{p_league_id:league.id});if(a.error)throw a.error;state=a.data;await load()}catch(e){console.error(e);autoProcessing=false;try{await load()}catch(_){}}finally{autoProcessing=false}}
async function openRoom(){location.href='draft-room.html'}
async function start(){try{await auth();await load();db.channel('draft-timeout-live').on('postgres_changes',{event:'*',schema:'public',table:'draft_picks',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'draft_skips',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'draft_state',filter:'league_id=eq.'+league.id},load).subscribe();setInterval(load,30000)}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Timeout console unavailable</h2><p class="muted">'+esc(e.message||e)+'</p><a class="back" href="draft-control.html">Return to Draft Control</a></div>'}}start();
</script></body></html>
