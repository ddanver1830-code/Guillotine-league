<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Guillotine League — Draft Room</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050b13;--p:#0d1826;--line:#263b51;--text:#f8fafc;--muted:#91a4b9;--blue:#38bdf8;--green:#34d399;--red:#fb7185;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12314a,#050b13 58%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:14px 14px 92px}.top,.clockbar,.teamtop{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:21px;font-weight:900}.brand small,.muted{color:var(--muted)}.brand small{display:block;font-size:11px;font-weight:500}.turn{text-align:right}.turn b{font-size:20px}.turn small{display:block;color:var(--muted)}.hero,.card{background:#0d1826ee;border:1px solid var(--line);border-radius:15px}.hero{padding:19px;background:linear-gradient(135deg,#153b58,#0b1725);margin:12px 0}.eyebrow{font-size:11px;font-weight:900;text-transform:uppercase;color:#86efac}.hero h1{margin:4px 0;font-size:29px}.clockbar{border:1px solid var(--line);border-radius:14px;padding:12px 15px;background:#0a1522;margin-top:13px}.clocknum{font-size:35px;font-weight:1000}.clockbar.warning{border-color:#876b1b}.clockbar.danger{border-color:#853246}.clockbar.warning .clocknum{color:var(--gold)}.clockbar.danger .clocknum{color:var(--red)}.you{font-weight:900;color:var(--green)}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}.card{padding:14px;margin-bottom:12px}.card h2{margin:0 0 10px;font-size:17px}.controls{display:flex;gap:7px;flex-wrap:wrap}.search,.select{padding:11px;border:1px solid var(--line);border-radius:9px;background:#07121e;color:#fff}.search{flex:1;min-width:180px}.player{display:grid;grid-template-columns:40px 1fr auto;gap:9px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}.avatar{width:34px;height:34px;border-radius:9px;background:#182c42;display:grid;place-items:center;font-size:12px;font-weight:900}.pos{display:inline-block;border-radius:999px;padding:2px 6px;background:#193047;color:#a9d8f4;font-size:10px;font-weight:900;margin-left:4px}.player button,button{border:0;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer;background:#2563eb;color:#fff}.player button:disabled,button:disabled{opacity:.45;cursor:not-allowed}.pick{display:grid;grid-template-columns:50px 1fr auto;gap:10px;padding:10px;border-bottom:1px solid var(--line)}.picknum{font-weight:900;color:var(--blue)}.round{color:var(--muted);font-size:11px}.board{display:grid;grid-template-columns:1fr 1fr;gap:7px}.team{border:1px solid var(--line);border-radius:11px;padding:9px;background:#0b1522}.team.current{border-color:#0ea5e9;background:#10283a}.count{color:var(--muted);font-size:11px}.mini{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;font-weight:900}.green{color:var(--green)}.gold{color:var(--gold)}.notice{padding:10px;border-radius:9px;background:#14253a;color:#b7c9dc;margin:7px 0}.empty{padding:20px;text-align:center;color:var(--muted)}.bar{height:7px;border-radius:10px;background:#17283a;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--blue)}.bottom{position:fixed;left:0;right:0;bottom:0;background:#06101eee;border-top:1px solid var(--line);display:flex;justify-content:center;gap:3px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);z-index:4}.bottom a{color:var(--muted);text-decoration:none;font-size:11px;text-align:center;padding:6px 10px}.bottom .active{color:var(--blue);font-weight:900}@media(max-width:800px){.grid{grid-template-columns:1fr}}@media(max-width:480px){.hero h1{font-size:24px}.clocknum{font-size:29px}.board{grid-template-columns:1fr}.bottom a{padding:6px 7px}}</style></head><body><main class="wrap"><div id="app"><div class="card">Loading Draft Room…</div></div></main><nav class="bottom"><a href="manager-center.html">⌂<br>Home</a><a href="game-center.html">🏈<br>Game Day</a><a class="active" href="draft-room-v2.html">📝<br>Draft</a><a href="waiver-center.html">💰<br>Waivers</a><a href="league-history.html">🏆<br>History</a></nav><script>
const URL='https://unmahnndjtljktvrupkh.supabase.co',KEY='sb_publishable_XZw7-dE6M6eJ_IFUBJWsIA_WnDk-ROM',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),LK='guillotine-live-league-id';let user,league,teams=[],picks=[],players=[],roster=[],state=null,myTeam=null,q='',pos='ALL',timer,autoPicking=false,lastAutoAttempt=0;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function auth(){let r=await db.auth.getSession();if(r.error)throw r.error;if(!r.data.session){r=await db.auth.signInAnonymously();if(r.error)throw r.error}user=r.data.session?.user;if(!user){r=await db.auth.getSession();if(r.error)throw r.error;user=r.data.session?.user}if(!user)throw Error('Could not establish a draft session.')}
async function load(){let id=localStorage.getItem(LK);if(!id)throw Error('Open the main league app first.');let a=await db.from('leagues').select('*').eq('id',id).single();if(a.error)throw a.error;league=a.data;let [t,d,p,r,s]=await Promise.all([db.from('teams').select('*').eq('league_id',id).order('team_number'),db.from('draft_picks').select('*').eq('league_id',id).order('pick_number'),db.from('players').select('*').order('name'),db.from('roster_players').select('*').eq('league_id',id),db.from('draft_state').select('*').eq('league_id',id).maybeSingle()]);for(const x of [t,d,p,r,s])if(x.error)throw x.error;teams=t.data||[];picks=d.data||[];players=p.data||[];roster=r.data||[];state=s.data||null;myTeam=teams.find(t=>t.owner_user_id===user.id)||null;render()}
function turnTeam(){let n=picks.length+1,r=Math.floor((n-1)/18)+1;return r%2?((n-1)%18)+1:18-((n-1)%18)}
function remaining(){if(!state)return 0;if(state.status!=='running'||!state.pick_started_at)return Math.max(0,state.remaining_seconds??state.pick_seconds??90);return Math.max(0,(state.remaining_seconds??state.pick_seconds??90)-Math.floor((Date.now()-new Date(state.pick_started_at).getTime())/1000))}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function eligible(){let d=new Set(picks.map(p=>p.sleeper_id).filter(Boolean));return players.filter(p=>!d.has(p.sleeper_id)&&(!q||(`${p.name} ${p.nfl_team||''}`.toLowerCase().includes(q.toLowerCase())))&&(pos==='ALL'||p.position===pos)).slice(0,80)}
function render(){clearInterval(timer);let n=picks.length+1,round=Math.floor((n-1)/18)+1,expected=turnTeam(),et=teams.find(t=>t.team_number===expected),mine=myTeam?.team_number===expected,st=state?.status||'setup',total=18*(state?.rounds||13),done=state&&picks.length>=total,rem=remaining(),progress=Math.min(100,picks.length/total*100);document.getElementById('app').innerHTML=`<div class="top"><div class="brand">📝 Guillotine Draft Room<small>${esc(league.name)} · ${esc(league.season||2026)} Season</small></div><div class="turn"><b>${done?'Draft Complete':st==='running'?'Pick '+n:'Draft '+st}</b><small>Round ${round} · ${picks.length}/${total} picks</small></div></div><section class="hero"><div class="eyebrow">${st==='running'?'LIVE DRAFT':st==='paused'?'DRAFT PAUSED':st==='complete'?'DRAFT COMPLETE':'DRAFT ROOM'}</div><h1>${et&&!done?esc(et.name):'All Picks Complete'}</h1><div class="muted">${st==='running'&&!done?(mine?'<span class="you">🔥 YOU ARE ON THE CLOCK!</span>':`Waiting for ${esc(et?.manager_name||et?.name||'next manager')}.`):st==='paused'?'The commissioner has paused the draft clock.':st==='setup'?'The commissioner has not started the draft yet.':'The draft is complete.'}</div>${st==='running'&&!done?`<div class="clockbar ${rem<=15?'danger':rem<=30?'warning':''}"><div><div class="muted">TIME REMAINING</div><div class="clocknum" id="clock">${fmt(rem)}</div></div><div style="text-align:right"><b>Pick #${n}</b><br><span class="muted">${mine?'Make your pick now':'On the clock: '+esc(et?.name||'')}</span></div></div>`:''}<div class="bar"><div class="fill" style="width:${progress}%"></div></div></section><div class="grid"><div><section class="card"><h2>🔎 Player Pool</h2><div class="controls"><input class="search" placeholder="Search player or NFL team…" value="${esc(q)}" oninput="q=this.value;renderPlayers()"><select class="select" onchange="pos=this.value;renderPlayers()"><option>ALL</option>${['QB','RB','WR','TE','K','DEF'].map(x=>`<option ${pos===x?'selected':''}>${x}</option>`).join('')}</select></div><div id="players"></div></section><section class="card"><h2>📜 Pick History</h2><div>${picks.length?picks.slice().reverse().map(p=>`<div class="pick"><div class="picknum">#${p.pick_number}<div class="round">R${p.round}</div></div><div><b>${esc(p.player_name)}</b><br><span class="muted">${esc(p.position)} · ${esc(teams.find(t=>t.id===p.team_id)?.name||'')}</span></div><div class="muted">T${teams.find(t=>t.id===p.team_id)?.team_number||'?'}</div></div>`).join(''):'<div class="empty">No picks yet. The commissioner can start the draft.</div>'}</div></section></div><div><section class="card"><h2>👥 Draft Board</h2><div class="board">${teams.map(t=>{let rr=roster.filter(r=>r.team_id===t.id);return `<div class="team ${t.team_number===expected?'current':''}"><div class="teamtop"><span><b>${t.team_number}. ${esc(t.name)}</b></span><span class="count">${rr.length} players</span></div><div class="mini">${esc(t.manager_name||'Waiting for manager')}</div><div class="status ${t.owner_user_id?'green':'gold'}">${t.owner_user_id?'● JOINED':'○ OPEN'}</div></div>`}).join('')}</div></section><section class="card"><h2>🏈 My Draft Team</h2>${myTeam?`<b>${esc(myTeam.name)}</b><div class="muted">${esc(myTeam.manager_name||'')}</div>${roster.filter(r=>r.team_id===myTeam.id).map(r=>{let p=players.find(x=>x.sleeper_id===r.sleeper_id);return `<div class="notice"><b>${esc(p?.name||r.sleeper_id)}</b> <span class="pos">${esc(p?.position||'')}</span><br><span class="muted">Drafted · Bench</span></div>`}).join('')||'<div class="empty">No players drafted yet.</div>`:'<div class="notice">You have not claimed a team yet.</div>'}</section><section class="card"><h2>⚡ Automatic Timeout</h2><div class="notice"><span class="green">ENABLED:</span> When the server clock expires, this room first flags the expired pick and then requests the automatic best-available selection. The next pick starts automatically.</div><div class="controls"><button onclick="refresh()">↻ Refresh</button><button onclick="location.href='draft-control.html'">⚙️ Commissioner</button></div></section></div></div>`;renderPlayers();if(st==='running'&&!done)timer=setInterval(updateClock,250)}
function renderPlayers(){let el=document.getElementById('players');if(!el)return;let expected=turnTeam(),mine=myTeam?.team_number===expected,st=state?.status||'setup',list=eligible();el.innerHTML=list.length?list.map(p=>`<div class="player"><div class="avatar">${esc(p.position||'?')}</div><div><b>${esc(p.name)}</b><br><span class="muted">${esc(p.nfl_team||'FA')}</span><span class="pos">${esc(p.position||'')}</span></div><button onclick="draft('${esc(p.sleeper_id)}')" ${st==='running'&&(mine||league.commissioner_user_id===user.id)?'':'disabled'}>${mine?'DRAFT':'Pick'}</button></div>`).join(''):'<div class="empty">No available players match that search.</div>'}
function updateClock(){let el=document.getElementById('clock');if(!el)return;let r=remaining();el.textContent=fmt(r);let box=el.closest('.clockbar');if(box)box.className='clockbar '+(r<=15?'danger':r<=30?'warning':'');if(r<=0&&Date.now()-lastAutoAttempt>1500)autoPick()}
async function autoPick(){if(autoPicking||!state||state.status!=='running'||picks.length>=18*(state.rounds||13))return;autoPicking=true;lastAutoAttempt=Date.now();try{let f=await db.rpc('flag_expired_draft_pick',{p_league_id:league.id});if(f.error&&!/not expired/i.test(f.error.message||'')){console.error('Timeout flag failed:',f.error);return}let a=await db.rpc('auto_pick_expired_draft_pick',{p_league_id:league.id});if(a.error){console.error('Automatic timeout pick failed:',a.error);return}await load()}catch(e){console.error('Automatic timeout pick failed:',e)}finally{autoPicking=false}}
async function draft(sid){let p=players.find(x=>x.sleeper_id===sid),t=teams.find(x=>x.team_number===turnTeam());if(!p||!t||!state||state.status!=='running')return;if(!confirm(`Draft ${p.name} to ${t.name}?`))return;try{let r=await db.rpc('make_draft_pick',{p_league_id:league.id,p_team_id:t.id,p_sleeper_id:p.sleeper_id,p_player_name:p.name,p_position:p.position});if(r.error)throw r.error;await load()}catch(e){alert(e.message||e);await refresh()}}
async function refresh(){try{await load()}catch(e){console.error(e)}}
async function start(){try{await auth();await load();db.channel('draft-room-live-v2').on('postgres_changes',{event:'*',schema:'public',table:'draft_picks',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'roster_players',filter:'league_id=eq.'+league.id},load).on('postgres_changes',{event:'*',schema:'public',table:'draft_state',filter:'league_id=eq.'+league.id},load).subscribe();setInterval(refresh,30000)}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Draft Room unavailable</h2><p class="muted">'+esc(e.message||e)+'</p></div>'}}start();
</script></body></html>
